ltiple 6 places (prise européenne)<\/td>\n<td><strong>PMPN4289<\/strong><\/td>\n<td>Magasin radio<\/td>\n<\/tr>\n<tr>\n<td>Câble de programmation<\/td>\n<td><strong>PMKN4265<\/strong><\/td>\n<td>Mini GCAI ↔ USB, pour CPS 2.0<\/td>\n<\/tr>\n<tr>\n<td>Oreillettes / kits surveillance<\/td>\n<td>PMLN8341, PMLN8342, PMLN8343…<\/td>\n<td>Zones bruyantes<\/td>\n<\/tr>\n<tr>\n<td>Micro haut-parleur sans fil<\/td>\n<td>PMMN4127 (WM500)<\/td>\n<td>Bluetooth<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — sur des postes de 12 heures, prévoyez une batterie <strong>longue durée<\/strong> et un <strong>chargeur multiple<\/strong> au magasin. Une batterie IMPRES se suit dans le temps : le chargeur IMPRES l’entretient et indique son état.<\/p>\n<\/div>\n<h2>Le cycle 5/5/90, c’est quoi ?<\/h2>\n<p>L’autonomie annoncée suppose que la radio <strong>émet 5 %<\/strong> du temps, <strong>reçoit 5 %<\/strong> et reste <strong>en veille 90 %<\/strong>. Sur un site très bavard, l’autonomie réelle est plus courte.<\/p>"},{"t":"Le mobile sur engin : exemple du DM4600e","h":"<p>Le <strong>DM4600e<\/strong> (série DM4000e, appelée XPR 5000e sur d’autres continents) est un mobile DMR/analogique avec écran couleur. Selon les marchés, il peut être remplacé par des modèles plus récents : la méthode d’installation reste la même.<\/p>\n<table>\n<thead>\n<tr>\n<th>Caractéristique<\/th>\n<th>DM4600e (données fabricant)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bandes<\/td>\n<td>VHF 136–174 MHz ; UHF 403–470 MHz, 450–527 MHz<\/td>\n<\/tr>\n<tr>\n<td>Puissance VHF<\/td>\n<td>1–25 W (version 25 W) ou 25–45 W (version haute puissance)<\/td>\n<\/tr>\n<tr>\n<td>Puissance UHF<\/td>\n<td>1–40 W<\/td>\n<\/tr>\n<tr>\n<td>Canaux<\/td>\n<td>1 000<\/td>\n<\/tr>\n<tr>\n<td>Alimentation<\/td>\n<td><strong>12 V nominal<\/strong> (courant continu)<\/td>\n<\/tr>\n<tr>\n<td>Consommation en émission<\/td>\n<td><strong>14,5 A<\/strong> à haute puissance ; 11 A à basse puissance<\/td>\n<\/tr>\n<tr>\n<td>Étanchéité<\/td>\n<td>IP54<\/td>\n<\/tr>\n<tr>\n<td>GPS<\/td>\n<td>Oui (GPS + GLONASS)<\/td>\n<\/tr>\n<tr>\n<td>Température<\/td>\n<td>–30 °C à +60 °C<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"fig\" data-fig=\"mobile_rear\"><div class=\"plate\"><\/div><figcaption>L’arrière d’un mobile : connecteur d’antenne, câble d’alimentation, connecteur d’accessoires.<\/figcaption><\/figure>\n<h2>Les trois branchements à l’arrière<\/h2>\n<ol>\n<li><strong>L’antenne<\/strong> : sur les mobiles Motorola de cette série, le connecteur d’antenne est de type <strong>mini-UHF<\/strong>. On utilise un câble d’antenne (souvent avec embase <strong>NMO<\/strong> côté toit) terminé par une fiche mini-UHF.<\/li>\n<li><strong>L’alimentation<\/strong> : câble d’origine <strong>HKN4137<\/strong> (3 m, 14 AWG, <strong>15 A<\/strong>, avec <strong>fusible en ligne<\/strong>), pour la plupart des versions. Pour les versions haute puissance, un câble de plus forte section est proposé (référence <strong>HKN4191<\/strong> chez Motorola — à confirmer avec votre fournisseur selon la version de radio).<\/li>\n<li><strong>Le connecteur d’accessoires arrière<\/strong> : programmation (câble <strong>PMKN4010<\/strong>), haut-parleur externe, détection de contact (« ignition »), options.<\/li>\n<\/ol>"},{"t":"Installer un mobile pas à pas","h":"<figure class=\"fig\" data-fig=\"mobile_wiring\"><div class=\"plate\"><\/div><figcaption>Schéma de câblage d’un mobile sur un engin en 12 V, et avec convertisseur sur un engin en 24 V.<\/figcaption><\/figure>\n<h2>Étape 1 : vérifier la tension de l’engin<\/h2>\n<div class=\"warn\">\n<p><strong>12 V ou 24 V ?<\/strong> Les <strong>véhicules légers<\/strong> (pick-up) sont en général en <strong>12 V<\/strong>. Les <strong>engins lourds<\/strong> (camions de transport, chargeuses, bulldozers, foreuses) sont très souvent en <strong>24 V<\/strong>. Le DM4600e est prévu pour du <strong>12 V<\/strong> : sur un engin en 24 V, il faut un <strong>convertisseur DC/DC 24 → 12 V<\/strong>, dimensionné au-dessus de la consommation (au moins <strong>20 A en continu<\/strong> pour une radio qui consomme 14,5 A en émission). <strong>Mesurez toujours au multimètre<\/strong> avant de brancher.<\/p>\n<\/div>\n<h2>Étape 2 : choisir les emplacements<\/h2>\n<table>\n<thead>\n<tr>\n<th>Élément<\/th>\n<th>Bon emplacement<\/th>\n<th>À éviter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Radio<\/td>\n<td>Visible, accessible, ventilée, fixée sur support rigide<\/td>\n<td>Zone des genoux, airbags, soleil direct, au sol (eau, pieds)<\/td>\n<\/tr>\n<tr>\n<td>Micro<\/td>\n<td>À portée de main, crochet de micro fixé<\/td>\n<td>Pendant librement, coincé dans une porte<\/td>\n<\/tr>\n<tr>\n<td>Haut-parleur (option)<\/td>\n<td>Orienté vers le conducteur<\/td>\n<td>Derrière le siège<\/td>\n<\/tr>\n<tr>\n<td>Antenne<\/td>\n<td><strong>Centre du toit métallique<\/strong> de la cabine<\/td>\n<td>Collée à un gyrophare, sous une structure métallique (ROPS) qui la masque<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Étape 3 : poser l’antenne<\/h2>\n<ul>\n<li><strong>Toit métallique<\/strong> : antenne <strong>quart d’onde<\/strong> (≈ 50 cm en VHF) sur embase NMO : le toit sert de <strong>plan de masse<\/strong>.<\/li>\n<li><strong>Cabine en fibre ou plastique<\/strong> : antenne <strong>sans plan de masse<\/strong> (« ground independent ») ou avec plaque de masse.<\/li>\n<li><strong>Passage du câble<\/strong> : par un <strong>passe-fil étanche<\/strong>, jamais pincé dans une porte, loin des pièces chaudes (échappement) et des articulations.<\/li>\n<li><strong>Longueur<\/strong> : couper le câble d’antenne à la bonne longueur, sertir proprement la fiche mini-UHF.<\/li>\n<\/ul>\n<h2>Étape 4 : l’alimentation<\/h2>\n<ol>\n<li>Raccordez le <strong>fil rouge (+)<\/strong> <strong>directement à la batterie<\/strong> de l’engin (ou au coupe-batterie, côté protégé), avec le <strong>fusible au plus près de la batterie<\/strong>.<\/li>\n<li>Raccordez le <strong>fil noir (–)<\/strong> au <strong>châssis<\/strong> ou à la borne moins, sur un point propre et serré.<\/li>\n<li>Sur un engin en 24 V : <strong>batterie 24 V → fusible → convertisseur 24/12 V → radio<\/strong>.<\/li>\n<li>Faites passer le câble dans une <strong>gaine<\/strong>, fixé tous les 30 à 50 cm, loin des câbles du démarreur.<\/li>\n<li>Option : raccordez la <strong>détection de contact<\/strong> (« ignition ») pour que la radio s’allume et s’éteigne avec l’engin (selon programmation).<\/li>\n<\/ol>\n<div class=\"warn\">\n<p><strong>Jamais<\/strong> sur l’allume-cigare ni sur un fil « bricolé » du tableau de bord : chutes de tension, coupures et risque d’incendie. <strong>Toujours un fusible<\/strong> côté batterie.<\/p>\n<\/div>\n<h2>Étape 5 : fixer la radio et tester<\/h2>\n<ol>\n<li>Fixez le <strong>support<\/strong> avec des vis (ou boulons) adaptés aux vibrations.<\/li>\n<li>Branchez antenne, alimentation, micro.<\/li>\n<li><strong>Mesurez le TOS<\/strong> (objectif ≤ 1,5) et la <strong>puissance<\/strong>.<\/li>\n<li><strong>Appel d’essai<\/strong> au dispatch, moteur <strong>arrêté puis moteur en marche<\/strong> (pour détecter les parasites de l’alternateur).<\/li>\n<li>Remplissez la <strong>fiche d’installation<\/strong> (voir Partie 6) : engin, radio, numéro de série, date, mesures, technicien.<\/li>\n<\/ol>\n<h2>Les particularités par type d’engin<\/h2>\n<table>\n<thead>\n<tr>\n<th>Engin<\/th>\n<th>Tension habituelle<\/th>\n<th>Point d’attention<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Camion de transport (dumper)<\/td>\n<td>24 V<\/td>\n<td>Cabine haute, antenne sur le toit, vibrations fortes<\/td>\n<\/tr>\n<tr>\n<td>Pelle, chargeuse<\/td>\n<td>24 V<\/td>\n<td>Rotation de la cabine : câble souple et protégé<\/td>\n<\/tr>\n<tr>\n<td>Foreuse<\/td>\n<td>24 V<\/td>\n<td>Poussière : radio dans la cabine fermée<\/td>\n<\/tr>\n<tr>\n<td>Bulldozer, niveleuse<\/td>\n<td>24 V<\/td>\n<td>Chocs : support renforcé, antenne protégée (ressort)<\/td>\n<\/tr>\n<tr>\n<td>Pick-up, véhicule léger<\/td>\n<td>12 V<\/td>\n<td>Antenne au centre du toit<\/td>\n<\/tr>\n<tr>\n<td>Bus du personnel<\/td>\n<td>24 V (souvent)<\/td>\n<td>Radio près du chauffeur, micro accessible<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Le poste fixe au dispatch","h":"<p>Un mobile peut servir de <strong>poste fixe<\/strong> au bureau ou au dispatch.<\/p>\n<ul>\n<li><strong>Alimentation stabilisée 13,8 V<\/strong> de puissance suffisante (au moins <strong>20 A<\/strong> pour un mobile 25–45 W), si possible derrière un <strong>onduleur<\/strong>.<\/li>\n<li><strong>Antenne extérieure<\/strong> sur mât ou toit, câble faible perte, <strong>parafoudre<\/strong> et mise à la terre.<\/li>\n<li>Micro de table, haut-parleur externe, enregistreur des communications si prévu.<\/li>\n<\/ul>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — au dispatch, gardez toujours <strong>une radio portable chargée<\/strong> en secours : si le poste fixe ou son alimentation tombe, le dispatch reste joignable.<\/p>\n<\/div>"}]},"technicien-3":{"id":"technicien-3","lvl":"technicien","titre":"Câbles, connecteurs et mesures","steps":[{"t":"Choisir le bon câble coaxial","h":"<figure class=\"fig\" data-fig=\"coax\"><div class=\"plate\"><\/div><figcaption>Le câble coaxial : âme, isolant, blindage, gaine.<\/figcaption><\/figure>\n<p>Le câble coaxial transporte le signal entre la radio et l’antenne. <strong>Chaque mètre perd un peu de puissance.<\/strong> Plus la fréquence est haute, plus la perte est grande.<\/p>\n<table>\n<thead>\n<tr>\n<th>Câble<\/th>\n<th>Diamètre<\/th>\n<th>Perte ≈ VHF 150 MHz (pour 100 m)<\/th>\n<th>Perte ≈ UHF 450 MHz (pour 100 m)<\/th>\n<th>Usage conseillé<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>RG-58<\/strong><\/td>\n<td>5 mm<\/td>\n<td>≈ 16 dB<\/td>\n<td>≈ 28 dB<\/td>\n<td>Petits raccordements, quelques mètres seulement<\/td>\n<\/tr>\n<tr>\n<td><strong>RG-213<\/strong><\/td>\n<td>10 mm<\/td>\n<td>≈ 7 dB<\/td>\n<td>≈ 14 dB<\/td>\n<td>Postes fixes, courtes descentes<\/td>\n<\/tr>\n<tr>\n<td><strong>LMR-400<\/strong> (ou équivalent)<\/td>\n<td>10 mm<\/td>\n<td>≈ 5 dB<\/td>\n<td>≈ 9 dB<\/td>\n<td>Descente de relais jusqu’à 30–40 m<\/td>\n<\/tr>\n<tr>\n<td><strong>1/2 pouce<\/strong> (type heliax)<\/td>\n<td>16 mm<\/td>\n<td>≈ 3 dB<\/td>\n<td>≈ 5 dB<\/td>\n<td>Pylônes hauts, longues descentes<\/td>\n<\/tr>\n<tr>\n<td><strong>7/8 pouce<\/strong><\/td>\n<td>28 mm<\/td>\n<td>≈ 1,5 dB<\/td>\n<td>≈ 2,7 dB<\/td>\n<td>Très grandes descentes, sites principaux<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p>Valeurs <strong>approximatives<\/strong>, pour comparer. Les vraies pertes sont dans la <strong>fiche technique du fabricant<\/strong> du câble. Rappel : <strong>3 dB de perte = la moitié de la puissance perdue.<\/strong><\/p>\n<\/div>\n<div class=\"exp\">\n<p><strong>Exemple<\/strong> — relais VHF 50 W, descente de 40 m. En RG-58 : environ 6,4 dB perdus, il reste <strong>à peine 11 W<\/strong> à l’antenne. En LMR-400 : environ 2 dB perdus, il reste <strong>≈ 31 W<\/strong>. En 1/2 pouce : environ 1,2 dB perdu, il reste <strong>≈ 38 W<\/strong>.<\/p>\n<\/div>"},{"t":"Les connecteurs","h":"<table>\n<thead>\n<tr>\n<th>Connecteur<\/th>\n<th>Où on le trouve<\/th>\n<th>Remarque<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>N<\/strong><\/td>\n<td>Relais, antennes de site, duplexeurs, parafoudres<\/td>\n<td>Étanche quand il est bien monté ; le standard des sites<\/td>\n<\/tr>\n<tr>\n<td><strong>UHF (PL-259 / SO-239)<\/strong><\/td>\n<td>Anciennes radios, postes fixes<\/td>\n<td>Pas adapté au-delà de quelques centaines de MHz, peu étanche<\/td>\n<\/tr>\n<tr>\n<td><strong>Mini-UHF<\/strong><\/td>\n<td>Arrière de nombreux mobiles (ex. DM4600e)<\/td>\n<td>Petit, à visser<\/td>\n<\/tr>\n<tr>\n<td><strong>BNC<\/strong><\/td>\n<td>Entrée RX de certains relais, appareils de mesure<\/td>\n<td>Verrouillage rapide quart de tour<\/td>\n<\/tr>\n<tr>\n<td><strong>SMA<\/strong><\/td>\n<td>Antennes de portables, petits équipements<\/td>\n<td>Fragile, ne pas forcer<\/td>\n<\/tr>\n<tr>\n<td><strong>NMO<\/strong><\/td>\n<td>Embase d’antenne sur le toit des véhicules<\/td>\n<td>Se perce dans la carrosserie, très solide<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Monter un connecteur N pas à pas","h":"<ol>\n<li><strong>Couper<\/strong> le câble bien droit, avec une pince adaptée.<\/li>\n<li><strong>Glisser<\/strong> d’abord l’écrou, la bague et le manchon sur le câble (on les oublie souvent !).<\/li>\n<li><strong>Dénuder<\/strong> aux cotes données par le fabricant du connecteur (gabarit ou outil de dénudage).<\/li>\n<li><strong>Préparer<\/strong> le blindage : le rabattre proprement, sans brin qui touche l’âme.<\/li>\n<li><strong>Poser<\/strong> la pointe centrale : sertir ou souder selon le modèle.<\/li>\n<li><strong>Assembler<\/strong> et <strong>serrer<\/strong> le corps du connecteur.<\/li>\n<li><strong>Contrôler<\/strong> à l’ohmmètre : pas de court-circuit entre l’âme et le blindage, continuité de bout en bout.<\/li>\n<li><strong>Mesurer le TOS<\/strong> une fois l’antenne raccordée.<\/li>\n<li><strong>Étanchéifier<\/strong> à l’extérieur : ruban vulcanisant (auto-amalgamant), puis ruban PVC par-dessus pour le protéger des UV.<\/li>\n<\/ol>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — l’<strong>eau dans un connecteur<\/strong> est la cause n° 1 des TOS élevés sur les sites. Faites une <strong>boucle d’égouttement<\/strong> sur le câble avant l’entrée de l’abri, et refaites l’étanchéité à chaque intervention.<\/p>\n<\/div>"},{"t":"Poser la descente de câble","h":"<figure class=\"fig\" data-fig=\"antenna_mount\"><div class=\"plate\"><\/div><figcaption>Bien placer l’antenne : au sommet ou sur un bras de déport, jamais collée au pylône.<\/figcaption><\/figure>\n<ol>\n<li><strong>Fixer<\/strong> le câble au pylône tous les <strong>1 à 1,5 m<\/strong> avec des colliers adaptés (inox ou résistants aux UV).<\/li>\n<li><strong>Respecter le rayon de courbure<\/strong> minimum du câble : jamais de pli serré.<\/li>\n<li><strong>Mettre à la terre<\/strong> le blindage du câble en haut du pylône, en bas, et à l’entrée de l’abri (kits de mise à la terre).<\/li>\n<li><strong>Poser le parafoudre<\/strong> à l’entrée de l’abri, relié à la <strong>barre de terre<\/strong>.<\/li>\n<li><strong>Étiqueter<\/strong> chaque câble aux deux bouts (relais, antenne, fréquence).<\/li>\n<\/ol>\n<figure class=\"fig\" data-fig=\"grounding\"><div class=\"plate\"><\/div><figcaption>Mise à la terre et parafoudre : protéger le relais contre la foudre.<\/figcaption><\/figure>"},{"t":"Les appareils de mesure","h":"<table>\n<thead>\n<tr>\n<th>Appareil<\/th>\n<th>À quoi il sert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TOS-mètre / wattmètre<\/strong><\/td>\n<td>Mesurer la puissance envoyée et la puissance réfléchie ; calculer le TOS<\/td>\n<\/tr>\n<tr>\n<td><strong>Charge fictive 50 Ω<\/strong><\/td>\n<td>Faire émettre une radio <strong>sans antenne<\/strong> (tests, réglages) sans rien rayonner<\/td>\n<\/tr>\n<tr>\n<td><strong>Analyseur d’antenne<\/strong><\/td>\n<td>Mesurer le TOS sur toute une bande, trouver la <strong>distance d’un défaut<\/strong> dans un câble<\/td>\n<\/tr>\n<tr>\n<td><strong>Analyseur de spectre<\/strong><\/td>\n<td>Voir les signaux présents, chercher un <strong>brouillage<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Testeur de radio<\/strong> (<em>service monitor<\/em>)<\/td>\n<td>Contrôler puissance, fréquence, sensibilité, déviation d’une radio<\/td>\n<\/tr>\n<tr>\n<td><strong>Multimètre<\/strong><\/td>\n<td>Tensions, continuité, fusibles<\/td>\n<\/tr>\n<tr>\n<td><strong>Mesureur de terre<\/strong><\/td>\n<td>Vérifier la valeur de la prise de terre du site<\/td>\n<\/tr>\n<tr>\n<td><strong>Alimentation stabilisée 13,8 V<\/strong><\/td>\n<td>Alimenter un mobile ou un relais à l’atelier<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Ne jamais faire émettre une radio sans antenne ni charge.<\/strong> L’étage de puissance peut être détruit en quelques secondes.<\/p>\n<\/div>"}]},"technicien-4":{"id":"technicien-4","lvl":"technicien","titre":"Programmer les radios et le relais","steps":[{"t":"Avant de programmer : le plan de programmation","h":"<p>On ne programme jamais une flotte « au fil de l’eau ». On prépare d’abord un <strong>plan écrit<\/strong>, validé, que l’on applique à toutes les radios.<\/p>\n<h2>Le plan de fréquences<\/h2>\n<div class=\"exp\">\n<p><strong>Exemple de plan<\/strong> (fréquences <strong>fictives<\/strong>, à remplacer par celles de votre autorisation AMRTP)<\/p>\n<table>\n<thead>\n<tr>\n<th>Canal<\/th>\n<th>Mode<\/th>\n<th>RX radio (MHz)<\/th>\n<th>TX radio (MHz)<\/th>\n<th>Code<\/th>\n<th>Usage<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MINE<\/td>\n<td>Numérique, slot 1<\/td>\n<td>155,1000<\/td>\n<td>150,5000<\/td>\n<td>Color code 1<\/td>\n<td>Dispatch, engins, pit<\/td>\n<\/tr>\n<tr>\n<td>MAINT<\/td>\n<td>Numérique, slot 2<\/td>\n<td>155,1000<\/td>\n<td>150,5000<\/td>\n<td>Color code 1<\/td>\n<td>Maintenance, ateliers<\/td>\n<\/tr>\n<tr>\n<td>ANA-RELAIS<\/td>\n<td>Analogique<\/td>\n<td>155,1000<\/td>\n<td>150,5000<\/td>\n<td>CTCSS 88,5 Hz<\/td>\n<td>Anciennes radios (mode mixte)<\/td>\n<\/tr>\n<tr>\n<td>DIRECT<\/td>\n<td>Analogique ou numérique, sans relais<\/td>\n<td>156,0000<\/td>\n<td>156,0000<\/td>\n<td>—<\/td>\n<td>Petits travaux, secours<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"def\">\n<p><strong>RX / TX<\/strong> — RX = fréquence de <strong>réception<\/strong> de la radio ; TX = fréquence d’<strong>émission<\/strong>. Pour la radio, <strong>TX = fréquence d’entrée du relais<\/strong> et <strong>RX = fréquence de sortie du relais<\/strong>. Pour le relais, c’est l’inverse.<\/p>\n<\/div>\n<h2>Le plan d’identifiants (numérique)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Plage d’ID radio<\/th>\n<th>Attribution (exemple)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 à 99<\/td>\n<td>Relais et équipements de réseau<\/td>\n<\/tr>\n<tr>\n<td>100 à 199<\/td>\n<td>Dispatch et postes fixes<\/td>\n<\/tr>\n<tr>\n<td>1000 à 1999<\/td>\n<td>Portables mine<\/td>\n<\/tr>\n<tr>\n<td>2000 à 2999<\/td>\n<td>Mobiles sur engins<\/td>\n<\/tr>\n<tr>\n<td>3000 à 3999<\/td>\n<td>Sous-traitants<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Groupe (talkgroup)<\/th>\n<th>ID<\/th>\n<th>Slot<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MINE<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>MAINTENANCE<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>SÉCURITÉ<\/td>\n<td>3<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>TOUS (appel général)<\/td>\n<td>16777215 (« All Call »)<\/td>\n<td>1 et 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — l’<strong>ID radio<\/strong> est comme un numéro de téléphone : <strong>unique<\/strong> pour chaque radio. Notez-le dans l’inventaire à côté du numéro de série. Deux radios avec le même ID provoquent des erreurs d’affichage et de localisation.<\/p>\n<\/div>"},{"t":"Le matériel et le logiciel","h":"<table>\n<thead>\n<tr>\n<th>Élément<\/th>\n<th>Pour le R7<\/th>\n<th>Pour le DM4600e<\/th>\n<th>Pour le SLR 5500<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Logiciel<\/td>\n<td>MOTOTRBO <strong>CPS 2.0<\/strong><\/td>\n<td>MOTOTRBO <strong>CPS 2.0<\/strong><\/td>\n<td>MOTOTRBO <strong>CPS 2.0<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Câble<\/td>\n<td><strong>PMKN4265<\/strong> (Mini GCAI ↔ USB)<\/td>\n<td><strong>PMKN4010<\/strong> (connecteur arrière ↔ USB)<\/td>\n<td>Port USB du relais (câble USB standard) ou réseau, selon configuration<\/td>\n<\/tr>\n<tr>\n<td>Alimentation pendant la programmation<\/td>\n<td>Batterie chargée<\/td>\n<td>Alimentation 13,8 V stable<\/td>\n<td>Secteur ou 12 V<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Ne jamais couper<\/strong> la radio, le câble ou le PC pendant l’écriture d’une programmation ou d’une mise à jour : la radio peut devenir inutilisable. Batterie chargée, PC sur secteur, câble d’origine.<\/p>\n<\/div>\n<figure class=\"fig\" data-fig=\"prog_setup\"><div class=\"plate\"><\/div><figcaption>Le poste de programmation : PC avec CPS 2.0, câble, radio.<\/figcaption><\/figure>"},{"t":"La méthode en 10 étapes","h":"<figure class=\"fig\" data-fig=\"codeplug\"><div class=\"plate\"><\/div><figcaption>Ce que contient une programmation (« codeplug ») MOTOTRBO.<\/figcaption><\/figure>\n<ol>\n<li><strong>Lire la radio<\/strong> (bouton <em>Read<\/em>). Toujours, même pour une radio neuve.<\/li>\n<li><strong>Sauvegarder immédiatement<\/strong> le fichier lu, avec un nom clair : <code>R7_N°série_AAAAMMJJ_origine<\/code>.<\/li>\n<li><strong>Paramètres généraux<\/strong> (<em>General Settings<\/em>) : <strong>ID radio<\/strong> (<em>Radio ID<\/em>), nom (<em>Radio Alias<\/em>), minuterie d’émission (<em>TOT<\/em>, par exemple 60 s pour éviter un bouton bloqué), langue, tonalités.<\/li>\n<li><strong>Contacts numériques<\/strong> (<em>Contacts<\/em>) : créer les <strong>appels de groupe<\/strong> (<em>Group Call<\/em>) avec leurs ID, et l’appel général (<em>All Call<\/em>) si autorisé.<\/li>\n<li><strong>Listes de groupes en réception<\/strong> (<em>RX Group Lists<\/em>) : quels groupes la radio entend sur chaque canal.<\/li>\n<li><strong>Créer les canaux<\/strong> (analogiques et numériques), détaillés ci-dessous.<\/li>\n<li><strong>Ranger les canaux en zones<\/strong> (<em>Zones<\/em>) : une zone par site ou par activité.<\/li>\n<li><strong>Boutons programmables<\/strong> : urgence, puissance haute/basse, balayage (<em>scan<\/em>), mode direct (<em>talkaround<\/em>).<\/li>\n<li><strong>Écrire la radio<\/strong> (bouton <em>Write<\/em>), puis <strong>tester<\/strong> chaque canal avec le dispatch.<\/li>\n<li><strong>Étiqueter et noter<\/strong> : ID, version de programmation, date, technicien, dans le registre des programmations.<\/li>\n<\/ol>\n<h2>Programmer un canal analogique<\/h2>\n<table>\n<thead>\n<tr>\n<th>Champ (CPS 2.0)<\/th>\n<th>Réglage<\/th>\n<th>Explication simple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nom du canal<\/td>\n<td><code>ANA-RELAIS<\/code><\/td>\n<td>Ce qui s’affiche à l’écran<\/td>\n<\/tr>\n<tr>\n<td>Type de canal<\/td>\n<td>Analogique<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Espacement (<em>Channel Spacing<\/em>)<\/td>\n<td><strong>12,5 kHz<\/strong><\/td>\n<td>La largeur du canal (norme actuelle)<\/td>\n<\/tr>\n<tr>\n<td>Fréquence RX<\/td>\n<td>155,1000 MHz<\/td>\n<td>Sortie du relais<\/td>\n<\/tr>\n<tr>\n<td>Fréquence TX<\/td>\n<td>150,5000 MHz<\/td>\n<td>Entrée du relais<\/td>\n<\/tr>\n<tr>\n<td>Type de squelch / code TX et RX<\/td>\n<td><strong>CTCSS 88,5 Hz<\/strong> (ou DCS)<\/td>\n<td>Le « code d’accès » analogique<\/td>\n<\/tr>\n<tr>\n<td>Puissance<\/td>\n<td>Haute ou basse<\/td>\n<td>Basse si possible : moins de brouillage, plus d’autonomie<\/td>\n<\/tr>\n<tr>\n<td>Mode direct (<em>Talkaround<\/em>)<\/td>\n<td>Autorisé ou non<\/td>\n<td>Permet de parler radio à radio sur la fréquence RX<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Programmer un canal numérique<\/h2>\n<table>\n<thead>\n<tr>\n<th>Champ (CPS 2.0)<\/th>\n<th>Réglage<\/th>\n<th>Explication simple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nom du canal<\/td>\n<td><code>MINE<\/code><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Type de canal<\/td>\n<td>Numérique<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Fréquences RX / TX<\/td>\n<td>155,1000 / 150,5000 MHz<\/td>\n<td>Comme en analogique<\/td>\n<\/tr>\n<tr>\n<td><strong>Color code<\/strong><\/td>\n<td><strong>1<\/strong><\/td>\n<td>Doit être <strong>identique<\/strong> à celui du relais<\/td>\n<\/tr>\n<tr>\n<td><strong>Slot<\/strong> (<em>Repeater Slot<\/em>)<\/td>\n<td><strong>1<\/strong><\/td>\n<td>Slot 1 ou 2<\/td>\n<\/tr>\n<tr>\n<td>Contact d’émission (<em>Contact Name<\/em>)<\/td>\n<td>Groupe <code>MINE<\/code> (ID 1)<\/td>\n<td>À qui on parle quand on appuie<\/td>\n<\/tr>\n<tr>\n<td>Liste RX (<em>RX Group List<\/em>)<\/td>\n<td><code>MINE<\/code> + <code>TOUS<\/code><\/td>\n<td>Ce qu’on entend<\/td>\n<\/tr>\n<tr>\n<td>Critère d’accès (<em>Admit Criteria<\/em>)<\/td>\n<td>« Couleur libre » ou « canal libre »<\/td>\n<td>Évite de parler par-dessus un autre<\/td>\n<\/tr>\n<tr>\n<td>Système d’urgence<\/td>\n<td>Activé, vers le groupe dispatch<\/td>\n<td>Le bouton orange déclenche l’alarme<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"exp\">\n<p><strong>Exemple — même fréquence, deux canaux<\/strong>\nCanal <code>MINE<\/code> = 155,1000 / 150,5000 MHz, color code 1, <strong>slot 1<\/strong>, groupe 1.\nCanal <code>MAINT<\/code> = <strong>mêmes fréquences<\/strong>, color code 1, <strong>slot 2<\/strong>, groupe 2.\nLe relais fait passer les deux conversations en même temps.<\/p>\n<\/div>\n<h2>Le canal direct et l’urgence<\/h2>\n<ul>\n<li>Créez un <strong>canal DIRECT<\/strong> (sans relais) dans <strong>toutes<\/strong> les radios, en dernière position de la zone.<\/li>\n<li>Programmez le <strong>bouton d’urgence<\/strong> (bouton orange du R7) : il envoie une <strong>alarme<\/strong> au dispatch et, selon le réglage, ouvre un <strong>appel prioritaire<\/strong>.<\/li>\n<li>Si vos radios disposent des options <strong>homme à terre<\/strong> (<em>Man Down<\/em>) ou <strong>travailleur isolé<\/strong> (<em>Lone Worker<\/em>), activez-les et testez-les (certaines demandent une licence).<\/li>\n<\/ul>\n<h2>Cloner une flotte<\/h2>\n<ol>\n<li>Créez <strong>une radio « modèle »<\/strong> parfaite, testée.<\/li>\n<li>Sauvegardez son fichier comme <strong>référence<\/strong> (version 1.0, date).<\/li>\n<li>Pour chaque radio : lire → sauvegarder l’original → <strong>copier la référence<\/strong> → changer <strong>seulement<\/strong> l’ID radio et le nom → écrire → tester.<\/li>\n<\/ol>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — protégez la programmation par <strong>mot de passe<\/strong> : un utilisateur ne doit pas pouvoir reprogrammer sa radio. Et gardez tous les fichiers dans un dossier sauvegardé (PC + disque externe ou cloud de l’entreprise).<\/p>\n<\/div>"},{"t":"Programmer le relais SLR 5500","h":"<p>Le relais se programme avec le même logiciel (CPS 2.0). Les points essentiels :<\/p>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Exemple<\/th>\n<th>Remarque<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fréquence TX du relais<\/td>\n<td>155,1000 MHz<\/td>\n<td>= RX des radios<\/td>\n<\/tr>\n<tr>\n<td>Fréquence RX du relais<\/td>\n<td>150,5000 MHz<\/td>\n<td>= TX des radios<\/td>\n<\/tr>\n<tr>\n<td>Mode du canal<\/td>\n<td>Numérique / analogique / mixte<\/td>\n<td>Le mode mixte sert pendant la migration<\/td>\n<\/tr>\n<tr>\n<td>Color code<\/td>\n<td>1<\/td>\n<td>Le même dans toutes les radios<\/td>\n<\/tr>\n<tr>\n<td>CTCSS (partie analogique)<\/td>\n<td>88,5 Hz<\/td>\n<td>Si mode mixte<\/td>\n<\/tr>\n<tr>\n<td>Puissance<\/td>\n<td>25 à 50 W<\/td>\n<td>Au juste nécessaire<\/td>\n<\/tr>\n<tr>\n<td>Minuterie, temps de maintien (<em>hang time<\/em>)<\/td>\n<td>Valeurs du plan<\/td>\n<td>Les mêmes sur tous les relais d’un système<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Le mode mixte<\/h2>\n<div class=\"def\">\n<p><strong>Mode mixte<\/strong> — le relais reconnaît chaque appel et le répète <strong>tel quel<\/strong> : un appel analogique sort en analogique, un appel numérique en numérique. Il permet de faire cohabiter anciennes et nouvelles radios pendant la migration.<\/p>\n<\/div>\n<div class=\"warn\">\n<p><strong>Limites du mode mixte<\/strong> : il <strong>ne traduit pas<\/strong> (une radio analogique n’entend pas un appel numérique), et pendant un appel analogique, <strong>les deux slots numériques sont bloqués<\/strong>. C’est une solution <strong>temporaire<\/strong> : fixez une date de fin de migration.<\/p>\n<\/div>"},{"t":"IP Site Connect : relier plusieurs sites","h":"<figure class=\"fig\" data-fig=\"ipsc\"><div class=\"plate\"><\/div><figcaption>Un relais maître à adresse fixe, des pairs qui s’y relient par le réseau IP.<\/figcaption><\/figure>\n<h2>Le principe<\/h2>\n<ul>\n<li>Jusqu’à <strong>15 relais<\/strong> (sites) reliés par <strong>réseau IP<\/strong> (fibre, faisceau, VSAT, Starlink).<\/li>\n<li><strong>Un relais maître<\/strong> (<em>Master<\/em>) avec une <strong>adresse IP fixe<\/strong> ; les autres sont des <strong>pairs<\/strong> (<em>Peers<\/em>) qui connaissent l’adresse IP et le <strong>port UDP<\/strong> du maître.<\/li>\n<li>Les radios passent d’un site à l’autre <strong>automatiquement<\/strong> (itinérance).<\/li>\n<li>On gagne de la <strong>couverture<\/strong>, pas de la <strong>capacité<\/strong> : un canal large zone reste un canal.<\/li>\n<\/ul>\n<h2>Les réglages de liaison (dans le relais)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Maître<\/th>\n<th>Pairs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Type de liaison (<em>Link Type<\/em>)<\/td>\n<td>Master<\/td>\n<td>Peer<\/td>\n<\/tr>\n<tr>\n<td>Adresse IP Ethernet<\/td>\n<td>Fixe, unique (ex. 10.10.1.10)<\/td>\n<td>Unique sur son réseau<\/td>\n<\/tr>\n<tr>\n<td>Masque, passerelle<\/td>\n<td>Ceux du routeur du site<\/td>\n<td>Idem<\/td>\n<\/tr>\n<tr>\n<td>Port UDP<\/td>\n<td>Port du maître (choisi par vous)<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>IP et port du maître<\/td>\n<td>—<\/td>\n<td><strong>Ceux du maître<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ID du relais<\/td>\n<td>Unique (ex. 1)<\/td>\n<td>Unique (ex. 2, 3…)<\/td>\n<\/tr>\n<tr>\n<td>Clé d’authentification<\/td>\n<td>Optionnelle<\/td>\n<td><strong>La même partout<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Slots<\/td>\n<td>Slot 1 <strong>large zone<\/strong>, slot 2 <strong>local<\/strong> (exemple)<\/td>\n<td>Idem<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — mettez le <strong>dispatch, la sécurité et les urgences<\/strong> sur le slot <strong>large zone<\/strong> (entendu sur tous les sites) et le travail local sur le slot <strong>local<\/strong>. Ouvrez sur le pare-feu <strong>uniquement<\/strong> le port UDP de la liaison, et testez site par site avec un appel large zone.<\/p>\n<\/div>"},{"t":"Les bonnes pratiques du programmeur","h":"<ul>\n<li><strong>Une seule version<\/strong> du logiciel CPS dans l’équipe.<\/li>\n<li><strong>Lire et sauvegarder<\/strong> avant toute modification.<\/li>\n<li><strong>Un registre des programmations<\/strong> : radio, ID, version, date, technicien, modification.<\/li>\n<li><strong>Tester<\/strong> chaque canal après écriture, avec le dispatch.<\/li>\n<li><strong>Ne jamais<\/strong> programmer une fréquence non autorisée.<\/li>\n<\/ul>"}]},"technicien-5":{"id":"technicien-5","lvl":"technicien","titre":"Le réseau souterrain","steps":[{"t":"Pourquoi le souterrain est différent","h":"<p>À ciel ouvert, les ondes voyagent <strong>en ligne de vue<\/strong> et un relais en point haut couvre une grande zone. Sous terre, c’est tout l’inverse :<\/p>\n<ul>\n<li>la <strong>roche absorbe<\/strong> les ondes ;<\/li>\n<li>les galeries <strong>tournent<\/strong>, montent et descendent : il n’y a pas de ligne de vue ;<\/li>\n<li>sans infrastructure, une radio porte à peine <strong>au-delà du prochain virage<\/strong>.<\/li>\n<\/ul>\n<figure class=\"fig\" data-fig=\"underground_vs\"><div class=\"plate\"><\/div><figcaption>Sous terre, le signal du relais de surface ne descend pas : il faut amener le réseau dans chaque galerie.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Ciel ouvert<\/th>\n<th>Souterrain<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Propagation<\/td>\n<td>Ligne de vue, longue portée<\/td>\n<td>Bloquée par la roche et les virages<\/td>\n<\/tr>\n<tr>\n<td>Infrastructure<\/td>\n<td>Relais sur point haut<\/td>\n<td>Câble ou nœuds <strong>dans chaque galerie<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Points faibles<\/td>\n<td>Fond du pit, derrière les verses<\/td>\n<td>Nouvelles galeries, zones de tir<\/td>\n<\/tr>\n<tr>\n<td>À chaque avancement<\/td>\n<td>Revoir les relais<\/td>\n<td><strong>Prolonger<\/strong> le réseau<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Les solutions pour le souterrain","h":"<table>\n<thead>\n<tr>\n<th>Solution<\/th>\n<th>Principe<\/th>\n<th>Points forts<\/th>\n<th>Points faibles<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Câble rayonnant<\/strong> (<em>leaky feeder<\/em>)<\/td>\n<td>Un câble coaxial « percé » qui rayonne tout le long de la galerie<\/td>\n<td>Éprouvé, simple pour la voix, compatible avec les radios VHF/UHF<\/td>\n<td>Doit être continu ; amplificateurs et alimentations à entretenir<\/td>\n<\/tr>\n<tr>\n<td><strong>Réseau maillé / Wi-Fi<\/strong><\/td>\n<td>Des nœuds radio qui se relaient<\/td>\n<td>Voix + données + localisation ; se répare seul si un nœud tombe<\/td>\n<td>Nœuds alimentés partout ; technologie souvent propriétaire<\/td>\n<\/tr>\n<tr>\n<td><strong>4G / LTE privée<\/strong><\/td>\n<td>Une petite antenne-relais 4G sous terre<\/td>\n<td>Haut débit, vidéo, données<\/td>\n<td>Coût, terminaux spécifiques<\/td>\n<\/tr>\n<tr>\n<td><strong>Fibre optique<\/strong><\/td>\n<td>La « colonne vertébrale » qui relie tout à la surface<\/td>\n<td>Très haut débit, insensible aux parasites<\/td>\n<td>Pas de radio à elle seule<\/td>\n<\/tr>\n<tr>\n<td><strong>Systèmes d’urgence<\/strong> (moyenne fréquence, alertes à travers la roche)<\/td>\n<td>Utilisent les conducteurs métalliques ou traversent le terrain<\/td>\n<td>Peuvent survivre à un accident<\/td>\n<td>Usage surtout d’urgence<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — dans la pratique, on <strong>combine<\/strong> : câble rayonnant pour la voix radio, fibre pour la liaison avec la surface, et Wi-Fi ou réseau maillé pour les données et la localisation.<\/p>\n<\/div>"},{"t":"Le câble rayonnant de bout en bout","h":"<figure class=\"fig\" data-fig=\"leaky_feeder\"><div class=\"plate\"><\/div><figcaption>Le système à câble rayonnant : tête de réseau en surface, câble dans les galeries, amplificateurs de ligne.<\/figcaption><\/figure>\n<div class=\"def\">\n<p><strong>Câble rayonnant (leaky feeder)<\/strong> — un câble coaxial dont le blindage comporte des <strong>fentes<\/strong> : le signal « fuit » volontairement tout le long. Le câble devient une <strong>antenne longue de plusieurs kilomètres<\/strong>. Les radios des mineurs captent ce signal à quelques mètres du câble.<\/p>\n<\/div>\n<h2>Les éléments du système<\/h2>\n<ol>\n<li><strong>La tête de réseau<\/strong> (en surface) : un <strong>relais<\/strong> (par exemple SLR 5500) relié au câble par un <strong>combineur<\/strong> et, souvent, par une interface fournie par le fabricant du système.<\/li>\n<li><strong>La descente<\/strong> : par le portail (entrée de galerie) ou un <strong>puits/forage<\/strong>.<\/li>\n<li><strong>Le câble rayonnant<\/strong> : suspendu au toit ou à la paroi de <strong>chaque galerie<\/strong>.<\/li>\n<li><strong>Les amplificateurs de ligne<\/strong> : ils relancent le signal, typiquement tous les <strong>350 à 500 m<\/strong> (selon le fabricant et le type de câble).<\/li>\n<li><strong>Les alimentations de ligne<\/strong> : elles injectent le courant dans le câble pour alimenter les amplificateurs, avec <strong>batteries de secours<\/strong>.<\/li>\n<li><strong>Les séparateurs (<em>splitters<\/em>)<\/strong> : pour créer des <strong>branches<\/strong> vers chaque galerie.<\/li>\n<li><strong>Les terminaisons<\/strong> : en bout de câble (charge ou antenne), selon le système.<\/li>\n<\/ol>\n<h2>Concevoir le réseau<\/h2>\n<ol>\n<li><strong>Plan des galeries<\/strong> à jour (actuelles et prévues) : tracez le parcours du câble.<\/li>\n<li><strong>Longueurs<\/strong> de chaque branche → <strong>nombre d’amplificateurs<\/strong> (1 tous les 350–500 m, selon le fabricant).<\/li>\n<li><strong>Position des alimentations<\/strong> de ligne et des <strong>batteries<\/strong>.<\/li>\n<li><strong>Zones particulières<\/strong> : refuges, salles souterraines, ateliers, stations de pompage, zones de tir.<\/li>\n<li><strong>Liaison avec la surface<\/strong> : relais en surface, fibre, et lien avec le dispatch.<\/li>\n<\/ol>\n<div class=\"exp\">\n<p><strong>Exemple de calcul<\/strong> — une rampe principale de 2 km et deux galeries de 600 m :\nrampe : 2 000 ÷ 400 ≈ <strong>5 amplificateurs<\/strong> ; chaque galerie : 600 ÷ 400 ≈ <strong>2 amplificateurs<\/strong> → environ <strong>9 amplificateurs<\/strong>, 2 séparateurs, et les alimentations de ligne prévues par le fabricant. (Valeurs d’exemple : suivez toujours les règles de conception du fournisseur.)<\/p>\n<\/div>\n<h2>Installer pas à pas<\/h2>\n<ol>\n<li><strong>Préparer<\/strong> : permis de travail, consignation électrique si nécessaire, coordination avec la production (pas de tir pendant les travaux).<\/li>\n<li><strong>Poser les supports<\/strong> au toit ou à la paroi : crochets ou attaches régulières, <strong>sans écraser<\/strong> le câble.<\/li>\n<li><strong>Dérouler le câble<\/strong> sans pli serré (respecter le <strong>rayon de courbure<\/strong> du fabricant), à distance des câbles électriques de puissance quand c’est possible.<\/li>\n<li><strong>Installer les amplificateurs<\/strong> et les <strong>séparateurs<\/strong> aux points prévus, dans des boîtiers protégés.<\/li>\n<li><strong>Raccorder<\/strong> avec les connecteurs du système, <strong>étanchéifier<\/strong> chaque connexion.<\/li>\n<li><strong>Alimenter<\/strong> : alimentations de ligne + batteries de secours.<\/li>\n<li><strong>Mesurer<\/strong> le niveau de signal le long du câble, à chaque amplificateur.<\/li>\n<li><strong>Tester<\/strong> : appels depuis chaque galerie, chaque refuge, chaque front de taille.<\/li>\n<li><strong>Documenter<\/strong> : plan du réseau mis à jour, position de chaque amplificateur, mesures.<\/li>\n<\/ol>\n\n<h2>Prolonger le réseau à chaque avancement<\/h2>\n<p>Quand une galerie avance, le câble doit <strong>suivre<\/strong>. Prévoyez :<\/p>\n<ul>\n<li>une <strong>réserve de câble<\/strong> et d’amplificateurs en magasin ;<\/li>\n<li>une <strong>procédure<\/strong> : à chaque nouvel avancement de X mètres, le service radio prolonge le câble ;<\/li>\n<li>une <strong>protection<\/strong> du câble près des fronts de tir (retrait temporaire, protection mécanique).<\/li>\n<\/ul>"},{"t":"Couvrir l’entrée d’une galerie avec un booster","h":"<p>Pour une galerie courte ou l’entrée d’un tunnel, on peut utiliser un <strong>amplificateur bidirectionnel<\/strong> (<em>booster<\/em>, BDA).<\/p>\n<figure class=\"fig\" data-fig=\"booster\"><div class=\"plate\"><\/div><figcaption>L’antenne donneuse capte le relais de surface ; le booster amplifie ; le câble rayonnant ou des antennes diffusent dans la galerie.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Règle<\/th>\n<th>Pourquoi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Placer le booster <strong>près de l’entrée<\/strong>, là où le relais de surface est bien reçu<\/td>\n<td>Signal donneur propre<\/td>\n<\/tr>\n<tr>\n<td><strong>Antenne donneuse directive<\/strong> (Yagi) pointée vers le relais<\/td>\n<td>Capter le bon signal<\/td>\n<\/tr>\n<tr>\n<td><strong>Séparer<\/strong> l’antenne donneuse et les antennes de service (distance, roche, directions opposées)<\/td>\n<td>Éviter l’<strong>accrochage<\/strong> (sifflement, brouillage)<\/td>\n<\/tr>\n<tr>\n<td><strong>Gain réglé au juste nécessaire<\/strong>, jamais au maximum<\/td>\n<td>Un booster trop fort brouille tout le réseau<\/td>\n<\/tr>\n<tr>\n<td><strong>Filtré<\/strong> sur les fréquences du site<\/td>\n<td>Ne pas amplifier les autres services<\/td>\n<\/tr>\n<tr>\n<td><strong>Déclaré<\/strong> à l’AMRTP<\/td>\n<td>Un booster est un émetteur<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Exploitation et sécurité sous terre","h":"<h2>Les règles d’or pour les utilisateurs<\/h2>\n<ul>\n<li><strong>Radio toujours sur soi<\/strong>, chargée et testée avant de descendre.<\/li>\n<li>Connaître les <strong>points radio<\/strong> et les <strong>postes fixes<\/strong> (refuges, salles).<\/li>\n<li><strong>Pointer<\/strong> à l’entrée et à la sortie (badge ou tableau) : on sait qui est en bas.<\/li>\n<li><strong>Zone de tir<\/strong> : respecter les consignes et distances de sécurité fixées pour les radios.<\/li>\n<\/ul>\n\n<h2>Les salles souterraines et refuges<\/h2>\n<p>Chaque <strong>refuge<\/strong> et chaque <strong>salle souterraine<\/strong> doit disposer d’un <strong>moyen de communication fixe<\/strong> en état (poste radio fixe raccordé au réseau, ou téléphone), testé régulièrement.<\/p>\n<h2>La maintenance du réseau souterrain<\/h2>\n<table>\n<thead>\n<tr>\n<th>Fréquence<\/th>\n<th>Contrôle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chaque jour<\/td>\n<td>Appel d’essai depuis les points clés ; alarmes des alimentations de ligne<\/td>\n<\/tr>\n<tr>\n<td>Chaque semaine<\/td>\n<td>Inspection visuelle du câble sur les zones actives (chocs, engins, eau)<\/td>\n<\/tr>\n<tr>\n<td>Chaque mois<\/td>\n<td>Mesure des niveaux aux amplificateurs ; test des batteries de secours<\/td>\n<\/tr>\n<tr>\n<td>À chaque avancement<\/td>\n<td>Prolongement du câble ; mise à jour du plan<\/td>\n<\/tr>\n<tr>\n<td>Chaque année<\/td>\n<td>Audit complet : plan, mesures, état des équipements<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Dans les zones à atmosphère explosive<\/strong> (gaz, poussières, carburant), seuls des équipements <strong>certifiés Ex (ATEX / IECEx)<\/strong> sont autorisés : radios, batteries et accessoires. On ne charge jamais une batterie et on n’ouvre jamais une radio en zone Ex.<\/p>\n<\/div>"}]},"technicien-6":{"id":"technicien-6","lvl":"technicien","titre":"Suivi, entretien et dépannage","steps":[{"t":"Les fichiers de suivi","h":"<p>Un bon réseau radio, c’est <strong>50 % de technique et 50 % d’organisation<\/strong>. Le technicien tient à jour un ensemble de fichiers (un classeur Excel avec un onglet par fichier convient très bien) :<\/p>\n<figure class=\"fig\" data-fig=\"files\"><div class=\"plate\"><\/div><figcaption>Les fichiers de suivi et la façon dont ils se relient.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>N°<\/th>\n<th>Fichier<\/th>\n<th>Contenu<\/th>\n<th>Mise à jour<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>Inventaire global<\/strong><\/td>\n<td>Toutes les radios : n° de série, marque, modèle, type (portable/mobile/fixe/relais), bande, ID radio, utilisateur ou engin, société, site, état, date de contrôle<\/td>\n<td>À chaque mouvement<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>Fiches d’entrée<\/strong><\/td>\n<td>Réception de matériel : date, fournisseur, modèle, n° de série, état, contrôle<\/td>\n<td>À chaque réception<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>Fiches de sortie / décharges<\/strong><\/td>\n<td>Remise d’une radio : date, radio, accessoires, bénéficiaire, société, signatures<\/td>\n<td>À chaque remise<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>Stock<\/strong><\/td>\n<td>Entrées – sorties = stock disponible, par modèle et accessoire<\/td>\n<td>Chaque semaine<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>Fiches d’installation<\/strong><\/td>\n<td>Radio posée sur un engin : engin, radio, mesures (TOS, puissance), date, technicien<\/td>\n<td>À chaque pose<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>Registre de maintenance<\/strong><\/td>\n<td>Visites des relais et sites : date, constat, mesures, action<\/td>\n<td>À chaque visite<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>Rapports de panne / d’intervention<\/strong><\/td>\n<td>Symptôme, cause, action, temps d’arrêt, état final<\/td>\n<td>À chaque panne<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>Contrôle des sous-traitants<\/strong><\/td>\n<td>Radios de chaque société : conforme / non conforme / à vérifier<\/td>\n<td>Chaque trimestre<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>Plan de fréquences et registre des programmations<\/strong><\/td>\n<td>Canaux, codes, ID, versions de codeplug<\/td>\n<td>À chaque modification<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><strong>Bilan mensuel<\/strong><\/td>\n<td>Indicateurs du mois (voir plus bas)<\/td>\n<td>Chaque mois<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — <strong>une radio = une ligne<\/strong> dans l’inventaire, identifiée par son <strong>numéro de série<\/strong>. Collez une <strong>étiquette<\/strong> visible avec un numéro interne sur chaque radio. Et faites un <strong>comptage physique<\/strong> chaque mois ou chaque trimestre : ce qui est compté doit être égal à ce qui est écrit.<\/p>\n<\/div>\n<h2>Le contrôle des sous-traitants<\/h2>\n<p>Les radios des sous-traitants passent sur <strong>votre<\/strong> réseau : elles doivent être contrôlées.<\/p>\n<table>\n<thead>\n<tr>\n<th>Résultat<\/th>\n<th>Signification<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Conforme<\/strong><\/td>\n<td>Bon modèle, bonne norme, bonne programmation, bon état<\/td>\n<td>Autorisée sur le réseau<\/td>\n<\/tr>\n<tr>\n<td><strong>Non conforme<\/strong><\/td>\n<td>Mauvais modèle, mauvaise norme ou canaux non autorisés<\/td>\n<td>Retirée jusqu’à remplacement ou reprogrammation<\/td>\n<\/tr>\n<tr>\n<td><strong>À vérifier<\/strong><\/td>\n<td>Modèle ou programmation inconnus<\/td>\n<td>Contrôle sur place à prévoir<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Le bilan mensuel<\/h2>\n<table>\n<thead>\n<tr>\n<th>Indicateur<\/th>\n<th>Comment le calculer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Disponibilité du réseau<\/td>\n<td>(Heures de fonctionnement des relais ÷ heures totales) × 100<\/td>\n<\/tr>\n<tr>\n<td>Radios opérationnelles<\/td>\n<td>(Radios en service ÷ radios du parc) × 100<\/td>\n<\/tr>\n<tr>\n<td>Pannes du mois<\/td>\n<td>Nombre de rapports de panne ouverts / clôturés<\/td>\n<\/tr>\n<tr>\n<td>Délai moyen de réparation<\/td>\n<td>Moyenne (heure de remise en service – heure de l’appel)<\/td>\n<\/tr>\n<tr>\n<td>Contrôles réalisés<\/td>\n<td>Visites faites ÷ visites prévues<\/td>\n<\/tr>\n<tr>\n<td>Radios non localisées<\/td>\n<td>À rechercher immédiatement<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"La maintenance préventive","h":"<p>Une panne évitée vaut mieux qu’une panne réparée. Voici un <strong>calendrier type<\/strong> :<\/p>\n<table>\n<thead>\n<tr>\n<th>Fréquence<\/th>\n<th>Ce que l’on fait<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Chaque jour<\/strong><\/td>\n<td>Radio check avec le dispatch ; tous les relais répondent ? Alarmes d’énergie ; pannes de la veille<\/td>\n<\/tr>\n<tr>\n<td><strong>Chaque semaine<\/strong><\/td>\n<td>Tournée visuelle : antennes, câbles, coffrets ; état des chargeurs ; stock de batteries<\/td>\n<\/tr>\n<tr>\n<td><strong>Chaque mois<\/strong><\/td>\n<td>Mesure du <strong>TOS<\/strong> et de la puissance des relais ; tension des batteries et du solaire ; nettoyage des panneaux ; test de l’onduleur (couper le secteur)<\/td>\n<\/tr>\n<tr>\n<td><strong>Chaque trimestre<\/strong><\/td>\n<td>Test de couverture ; contrôle des radios des sous-traitants ; inventaire physique<\/td>\n<\/tr>\n<tr>\n<td><strong>Chaque année<\/strong><\/td>\n<td>Mesure de la <strong>terre<\/strong> ; contrôle du pylône (fixations, corrosion, balisage) ; remplacement des batteries fatiguées ; audit complet ; mise à jour du dossier AMRTP<\/td>\n<\/tr>\n<tr>\n<td><strong>Après chaque orage violent<\/strong><\/td>\n<td>Contrôle des parafoudres, des relais et de la terre<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — la poussière fait chuter la production des panneaux solaires et chauffer l’électronique. <strong>Nettoyez<\/strong> panneaux et filtres d’abri régulièrement, surtout en saison sèche et près des pistes.<\/p>\n<\/div>"},{"t":"Le dépannage : méthode et tableau","h":"<h2>La méthode en 5 questions<\/h2>\n<ol>\n<li><strong>Qui<\/strong> est touché ? Une radio, un groupe, tout un site ?<\/li>\n<li><strong>Où<\/strong> ? Partout ou dans une zone ?<\/li>\n<li><strong>Depuis quand<\/strong> ? Après un orage, une modification, une reprogrammation ?<\/li>\n<li><strong>Quoi<\/strong> exactement ? Pas d’émission, pas de réception, bruit, coupures ?<\/li>\n<li><strong>Qu’est-ce qui a changé<\/strong> ? (antenne, câble, programmation, énergie, nouvelle verse…)<\/li>\n<\/ol>\n<div class=\"tip\">\n<p><strong>Rétablir d’abord, réparer ensuite<\/strong> : remplacez la radio en panne par une radio de prêt pour que l’équipe continue à travailler, puis réparez à l’atelier.<\/p>\n<\/div>\n<h2>Tableau des pannes courantes<\/h2>\n<table>\n<thead>\n<tr>\n<th>Symptôme<\/th>\n<th>Causes probables<\/th>\n<th>Solutions<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>La radio ne s’allume pas<\/td>\n<td>Batterie vide ou défectueuse ; contacts sales ; (mobile) fusible grillé<\/td>\n<td>Batterie chargée ; nettoyer les contacts ; contrôler fusible et tension<\/td>\n<\/tr>\n<tr>\n<td>Émet mais personne n’entend<\/td>\n<td>Mauvais canal ; mauvais color code / CTCSS ; antenne cassée ; relais en panne<\/td>\n<td>Vérifier canal et programmation ; changer l’antenne ; tester en mode direct<\/td>\n<\/tr>\n<tr>\n<td>Entend mais ne peut pas émettre<\/td>\n<td>Bouton PTT défectueux ; critère d’accès (canal occupé) ; minuterie TOT<\/td>\n<td>Test sur autre radio ; vérifier programmation<\/td>\n<\/tr>\n<tr>\n<td>Souffle, son haché (analogique)<\/td>\n<td>Limite de portée ; antenne ; TOS élevé<\/td>\n<td>Se déplacer ; contrôler antenne et câble<\/td>\n<\/tr>\n<tr>\n<td>Coupures nettes (numérique)<\/td>\n<td>Limite de portée (« effet falaise »)<\/td>\n<td>Test de couverture ; renforcer la zone<\/td>\n<\/tr>\n<tr>\n<td>Toute une zone sans radio<\/td>\n<td>Relais en panne ; énergie coupée ; liaison IP coupée<\/td>\n<td>Alarmes, énergie, relais, liaison ; répéteur portable<\/td>\n<\/tr>\n<tr>\n<td>Le relais s’ouvre sans que personne parle<\/td>\n<td>Brouillage ; radio bloquée en émission<\/td>\n<td>Analyseur de spectre ; rechercher la radio bloquée<\/td>\n<\/tr>\n<tr>\n<td>TOS élevé au relais<\/td>\n<td>Eau dans un connecteur ; câble écrasé ; antenne endommagée ; parafoudre HS<\/td>\n<td>Inspection, remplacement, étanchéité<\/td>\n<\/tr>\n<tr>\n<td>Parasites sur un mobile moteur en marche<\/td>\n<td>Alimentation mal raccordée ; masse ; alternateur<\/td>\n<td>Raccorder à la batterie ; vérifier la masse ; filtre<\/td>\n<\/tr>\n<tr>\n<td>Batterie qui ne tient pas<\/td>\n<td>Batterie usée ; copie ; mauvais chargeur<\/td>\n<td>Batterie d’origine ; chargeur adapté<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Le rapport d’intervention<\/h2>\n<p>Chaque intervention a son rapport, <strong>sans exception<\/strong> (modèle en annexe) : date et heures (appel, arrivée, fin), équipement, symptôme, cause trouvée, action, état final, nom et signature du technicien. Ces rapports permettent de repérer les <strong>pannes répétées<\/strong>, de mesurer la <strong>réactivité<\/strong> et de nourrir le <strong>bilan mensuel<\/strong>.<\/p>"},{"t":"Les outils du technicien","h":"<figure class=\"fig\" data-fig=\"toolbox\"><div class=\"plate\"><\/div><figcaption>La caisse à outils du technicien radio.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Outil<\/th>\n<th>À quoi il sert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TOS-mètre / wattmètre<\/strong><\/td>\n<td>Mesurer la puissance directe et réfléchie (TOS)<\/td>\n<\/tr>\n<tr>\n<td><strong>Charge fictive 50 Ω<\/strong><\/td>\n<td>Tester un émetteur sans rayonner (« fausse antenne »)<\/td>\n<\/tr>\n<tr>\n<td><strong>Analyseur d’antenne / de spectre<\/strong><\/td>\n<td>Voir les fréquences occupées, trouver un brouillage, vérifier une antenne<\/td>\n<\/tr>\n<tr>\n<td><strong>Testeur de radio<\/strong> (<em>service monitor<\/em>)<\/td>\n<td>Mesurer puissance, fréquence, sensibilité, audio d’une radio<\/td>\n<\/tr>\n<tr>\n<td><strong>Multimètre<\/strong><\/td>\n<td>Tensions, continuité, fusibles<\/td>\n<\/tr>\n<tr>\n<td><strong>Mesureur de terre<\/strong><\/td>\n<td>Résistance de la prise de terre<\/td>\n<\/tr>\n<tr>\n<td><strong>Pince à sertir et dénudeur coaxial<\/strong><\/td>\n<td>Poser les connecteurs proprement<\/td>\n<\/tr>\n<tr>\n<td><strong>Clés, clé dynamométrique<\/strong><\/td>\n<td>Serrage correct des connecteurs et fixations<\/td>\n<\/tr>\n<tr>\n<td><strong>Ruban vulcanisant, gaine thermo, colliers UV<\/strong><\/td>\n<td>Étanchéité et fixation<\/td>\n<\/tr>\n<tr>\n<td><strong>Étiqueteuse<\/strong><\/td>\n<td>Repérage des câbles et des radios<\/td>\n<\/tr>\n<tr>\n<td><strong>PC + CPS 2.0 + câbles de programmation<\/strong><\/td>\n<td>Programmer radios et relais<\/td>\n<\/tr>\n<tr>\n<td><strong>EPI, harnais double longe<\/strong><\/td>\n<td>Sécurité, travail en hauteur<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Ne jamais émettre sans antenne ou sans charge fictive<\/strong> : l’étage de puissance de la radio ou du relais peut être détruit.<\/p>\n<\/div>"}]},"technicien-7":{"id":"technicien-7","lvl":"technicien","titre":"Sécurité et métier du technicien","steps":[{"t":"La sécurité du technicien","h":"<table>\n<thead>\n<tr>\n<th>Risque<\/th>\n<th>Règles<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Travail en hauteur<\/strong><\/td>\n<td>Permis, harnais double longe, travail à deux, matériel contrôlé, jamais par vent fort<\/td>\n<\/tr>\n<tr>\n<td><strong>Foudre<\/strong><\/td>\n<td>Jamais sur un pylône par temps d’orage ; descendre et s’éloigner dès les premiers éclairs<\/td>\n<\/tr>\n<tr>\n<td><strong>Électricité<\/strong><\/td>\n<td>Consignation avant intervention sur le 230 V ; batteries : attention aux courts-circuits (outils isolés)<\/td>\n<\/tr>\n<tr>\n<td><strong>Rayonnement<\/strong><\/td>\n<td>Ne pas rester devant une antenne d’émission puissante ; couper l’émetteur avant d’intervenir sur l’antenne<\/td>\n<\/tr>\n<tr>\n<td><strong>Zones minières<\/strong><\/td>\n<td>Respect des règles du site : EPI, autorisation d’entrée dans le pit, zones de tir<\/td>\n<\/tr>\n<tr>\n<td><strong>Zones ATEX<\/strong><\/td>\n<td>Matériel certifié Ex uniquement ; ne jamais ouvrir ni charger en zone<\/td>\n<\/tr>\n<tr>\n<td><strong>Chaleur<\/strong><\/td>\n<td>Hydratation, pauses, travail aux heures fraîches pour les pylônes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Aucune urgence radio ne justifie un risque pour la vie du technicien.<\/strong> Rapide, oui ; imprudent, jamais.<\/p>\n<\/div>"},{"t":"Le métier de technicien radio","h":"<h2>Les compétences<\/h2>\n<table>\n<thead>\n<tr>\n<th>Savoir<\/th>\n<th>Savoir-faire<\/th>\n<th>Savoir-être<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ondes, fréquences, VHF/UHF<\/td>\n<td>Installer relais, antennes, mobiles<\/td>\n<td>Réactif<\/td>\n<\/tr>\n<tr>\n<td>Analogique, DMR, normes<\/td>\n<td>Programmer une flotte<\/td>\n<td>Rigoureux<\/td>\n<\/tr>\n<tr>\n<td>Électricité, énergie, solaire<\/td>\n<td>Mesurer (TOS, puissance, terre)<\/td>\n<td>Ponctuel<\/td>\n<\/tr>\n<tr>\n<td>Réseaux IP<\/td>\n<td>Dépanner avec méthode<\/td>\n<td>À l’écoute des utilisateurs<\/td>\n<\/tr>\n<tr>\n<td>Règles AMRTP, sécurité<\/td>\n<td>Documenter, rédiger des rapports<\/td>\n<td>Toujours en formation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Être réactif<\/h2>\n<table>\n<thead>\n<tr>\n<th>Niveau<\/th>\n<th>Exemples<\/th>\n<th>Délai visé<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Urgent<\/strong><\/td>\n<td>Relais en panne, zone sans radio, radio du dispatch ou des secours<\/td>\n<td>Tout de suite<\/td>\n<\/tr>\n<tr>\n<td><strong>Important<\/strong><\/td>\n<td>Radio d’engin en panne, couverture dégradée<\/td>\n<td>Dans la journée<\/td>\n<\/tr>\n<tr>\n<td><strong>Normal<\/strong><\/td>\n<td>Accessoire, étiquette, demande de programmation<\/td>\n<td>Planifié<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Le réflexe : <strong>répondre<\/strong> tout de suite (« reçu, je m’en occupe »), <strong>donner un délai<\/strong>, venir <strong>équipé<\/strong> (radio de rechange), <strong>rétablir<\/strong> d’abord, <strong>informer et clôturer<\/strong>, puis <strong>écrire le rapport<\/strong>.<\/p>"}]},"technicien-8":{"id":"technicien-8","lvl":"technicien","titre":"Check-lists d’installation","steps":[{"t":"Annexe B : check-list mise en service d’un relais","h":"<table>\n<thead>\n<tr>\n<th>☐<\/th>\n<th>Contrôle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>☐<\/td>\n<td>Autorisation et fréquences AMRTP vérifiées<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Antenne au sommet ou sur bras de déport, verticale, bien fixée<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Câble faible perte, fixé tous les 1 à 1,5 m, boucle d’égouttement<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Connecteurs serrés et étanchés (vulcanisant + adhésif)<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Kits de terre du câble posés ; parafoudre à l’entrée de l’abri<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Pylône, armoire, relais, parafoudre reliés à la même terre ; terre mesurée<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Duplexeur accordé et vérifié<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Relais programmé (fréquences, codes, puissance, IPSC si besoin) ; sauvegarde faite<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>TOS ≤ 1,5 ; puissance mesurée et notée<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Énergie secourue testée (coupure secteur)<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Test de couverture réalisé et carte mise à jour<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Étiquetage, schéma affiché, dossier de mise en service remis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Annexe C : check-list installation d’un mobile","h":"<table>\n<thead>\n<tr>\n<th>☐<\/th>\n<th>Contrôle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>☐<\/td>\n<td>Tension de l’engin mesurée (12 V ou 24 V)<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Si 24 V : convertisseur 24 → 12 V ≥ 20 A posé<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Alimentation directe batterie, fusible côté batterie, masse propre<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Câbles en gaine, fixés, loin des pièces chaudes et articulations<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Antenne au centre du toit (ou sans plan de masse si cabine non métallique)<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Radio et micro fixés, accessibles, sans gêner la conduite<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>TOS ≤ 1,5 ; puissance mesurée<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Appel d’essai moteur arrêté et moteur en marche<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Fiche d’installation remplie ; inventaire mis à jour<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},"avance-1":{"id":"avance-1","lvl":"avance","titre":"Le codeplug de A à Z","steps":[{"t":"Le cas d’étude de ce livre","h":"<p>Pour que tout soit concret, nous suivrons un même exemple du début à la fin : une mine fictive, <strong>« Mine Kankou »<\/strong>, avec <strong>trois sites<\/strong> à relier.<\/p>\n<figure class=\"fig\" data-fig=\"case_study\"><div class=\"plate\"><\/div><figcaption>La Mine Kankou : un pit, une usine à 25 km et un camp à 60 km.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Site<\/th>\n<th>Rôle<\/th>\n<th>Distance du pit<\/th>\n<th>Relais<\/th>\n<th>Liaison IP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A – Pit<\/strong><\/td>\n<td>Exploitation, dispatch principal<\/td>\n<td>—<\/td>\n<td>Relais 1 (maître IPSC)<\/td>\n<td>Fibre vers l’usine<\/td>\n<\/tr>\n<tr>\n<td><strong>B – Usine<\/strong><\/td>\n<td>Traitement, ateliers<\/td>\n<td>25 km<\/td>\n<td>Relais 2 (pair)<\/td>\n<td>Fibre<\/td>\n<\/tr>\n<tr>\n<td><strong>C – Camp<\/strong><\/td>\n<td>Hébergement, logistique<\/td>\n<td>60 km<\/td>\n<td>Relais 3 (pair)<\/td>\n<td>Starlink + VPN<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"exp\">\n<p><strong>Le plan de fréquences du cas d’étude<\/strong> (fréquences <strong>fictives<\/strong>)<\/p>\n<table>\n<thead>\n<tr>\n<th>Site<\/th>\n<th>Relais émet (= RX radio)<\/th>\n<th>Relais reçoit (= TX radio)<\/th>\n<th>Color code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A – Pit<\/td>\n<td>155,1000 MHz<\/td>\n<td>150,5000 MHz<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>B – Usine<\/td>\n<td>155,2000 MHz<\/td>\n<td>150,6000 MHz<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>C – Camp<\/td>\n<td>155,3000 MHz<\/td>\n<td>150,7000 MHz<\/td>\n<td>3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Groupe (talkgroup)<\/th>\n<th>ID<\/th>\n<th>Où est-il entendu ?<\/th>\n<th>Slot<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DISPATCH<\/td>\n<td>1<\/td>\n<td>Tous les sites (large zone)<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>SÉCURITÉ<\/td>\n<td>2<\/td>\n<td>Tous les sites (large zone)<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>PIT-LOCAL<\/td>\n<td>10<\/td>\n<td>Site A uniquement<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>USINE-LOCAL<\/td>\n<td>20<\/td>\n<td>Site B uniquement<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>CAMP-LOCAL<\/td>\n<td>30<\/td>\n<td>Site C uniquement<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>TOUS (appel général)<\/td>\n<td>16777215<\/td>\n<td>Tous<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"La structure complète d’un codeplug","h":"<figure class=\"fig\" data-fig=\"codeplug_full\"><div class=\"plate\"><\/div><figcaption>Les sections d’un codeplug MOTOTRBO et leurs liens : un canal utilise des contacts, une liste RX, une liste de balayage ou d’itinérance et un système d’urgence.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Section (CPS 2.0)<\/th>\n<th>Ce qu’on y règle<\/th>\n<th>À retenir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>General Settings<\/strong><\/td>\n<td>ID radio, nom, minuterie TOT, tonalités, mot de passe, langue<\/td>\n<td>L’ID est <strong>unique<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Network<\/strong><\/td>\n<td>Adresse IP de la radio, ID des serveurs ARS / TMS<\/td>\n<td>Pour GPS, texte, dispatch<\/td>\n<\/tr>\n<tr>\n<td><strong>Accessories<\/strong><\/td>\n<td>Comportement avec micro, oreillette, Bluetooth<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Buttons<\/strong><\/td>\n<td>Rôle de chaque bouton programmable<\/td>\n<td>Urgence, puissance, direct, scan<\/td>\n<\/tr>\n<tr>\n<td><strong>Text Messages<\/strong><\/td>\n<td>Messages prédéfinis<\/td>\n<td>Ex. « Je suis en route »<\/td>\n<\/tr>\n<tr>\n<td><strong>Privacy<\/strong><\/td>\n<td>Clés de confidentialité / chiffrement<\/td>\n<td>Mêmes clés sur toute la flotte<\/td>\n<\/tr>\n<tr>\n<td><strong>Contacts<\/strong><\/td>\n<td>Appels de groupe, privés, général<\/td>\n<td>ID = ID des groupes du plan<\/td>\n<\/tr>\n<tr>\n<td><strong>RX Group Lists<\/strong><\/td>\n<td>Groupes entendus sur un canal<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Scan Lists<\/strong><\/td>\n<td>Canaux balayés (écoute de plusieurs canaux)<\/td>\n<td>Pas pour changer de site<\/td>\n<\/tr>\n<tr>\n<td><strong>Roam Lists<\/strong><\/td>\n<td>Sites entre lesquels la radio passe seule (IPSC)<\/td>\n<td>Pour l’<strong>itinérance<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Emergency Systems<\/strong><\/td>\n<td>Qui reçoit l’alarme, comment<\/td>\n<td>Vers le groupe DISPATCH<\/td>\n<\/tr>\n<tr>\n<td><strong>Zones / Channels<\/strong><\/td>\n<td>Les canaux rangés en zones<\/td>\n<td>Une zone par site ou par usage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>General Settings : la carte d’identité<\/h2>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Exemple<\/th>\n<th>Pourquoi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Radio ID<\/td>\n<td>1025<\/td>\n<td>Unique, noté dans l’inventaire<\/td>\n<\/tr>\n<tr>\n<td>Radio Alias<\/td>\n<td><code>PIT-CHEF-01<\/code><\/td>\n<td>Nom affiché chez les autres et au dispatch<\/td>\n<\/tr>\n<tr>\n<td>TOT (<em>Time-Out Timer<\/em>)<\/td>\n<td>60 s<\/td>\n<td>Coupe l’émission si un bouton reste coincé<\/td>\n<\/tr>\n<tr>\n<td>Mot de passe de programmation<\/td>\n<td>Défini par le service radio<\/td>\n<td>Empêche la reprogrammation sauvage<\/td>\n<\/tr>\n<tr>\n<td>Tonalités, rétroéclairage<\/td>\n<td>Selon le site<\/td>\n<td>Confort, discrétion<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Network : l’identité « informatique » de la radio<\/h2>\n<p>En numérique, la radio a aussi une <strong>adresse IP interne<\/strong> et sait à quels « serveurs » envoyer ses données (positions GPS, messages texte). Les logiciels de dispatch (TRBOnet, SmartPTT…) utilisent souvent l’ID <strong>64250<\/strong> pour ces serveurs (ARS pour la présence, TMS pour les textes) : l’important est que la radio et le dispatch utilisent <strong>le même ID<\/strong>.<\/p>\n<h2>Contacts et listes RX<\/h2>\n<ul>\n<li>Chaque <strong>groupe<\/strong> du plan devient un <strong>contact<\/strong> (<em>Group Call<\/em>) avec son ID.<\/li>\n<li>Une <strong>liste RX<\/strong> dit ce que la radio <strong>entend<\/strong> sur un canal : par exemple, sur le canal PIT, la radio entend DISPATCH, SÉCURITÉ, PIT-LOCAL et TOUS.<\/li>\n<\/ul>\n<h2>Scan ou itinérance ?<\/h2>\n<div class=\"def\">\n<p><strong>Scan (balayage)<\/strong> — la radio <strong>écoute plusieurs canaux<\/strong> à tour de rôle et s’arrête sur celui où quelqu’un parle.\n<strong>Itinérance (roaming)<\/strong> — la radio <strong>change seule de relais<\/strong> quand elle passe d’un site à l’autre, pour rester sur le meilleur signal. C’est la fonction utilisée avec IP Site Connect.<\/p>\n<\/div>\n<h2>Le système d’urgence<\/h2>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Type d’alarme<\/td>\n<td>Alarme + appel<\/td>\n<\/tr>\n<tr>\n<td>Destinataire<\/td>\n<td>Groupe DISPATCH<\/td>\n<\/tr>\n<tr>\n<td>Canal de repli (<em>Revert Channel<\/em>)<\/td>\n<td>Canal large zone du site<\/td>\n<\/tr>\n<tr>\n<td>Mode « silencieux » (option)<\/td>\n<td>Pour les situations de sécurité<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Le codeplug complet du cas d’étude","h":"<h2>Les zones et canaux d’une radio portable<\/h2>\n<table>\n<thead>\n<tr>\n<th>Zone<\/th>\n<th>Canal<\/th>\n<th>Mode<\/th>\n<th>Fréquences (RX / TX)<\/th>\n<th>Color code<\/th>\n<th>Slot<\/th>\n<th>Contact TX<\/th>\n<th>Liste RX<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 – KANKOU<\/strong><\/td>\n<td>DISPATCH<\/td>\n<td>Numérique, large zone<\/td>\n<td>Site du relais (itinérance)<\/td>\n<td>selon site<\/td>\n<td>1<\/td>\n<td>DISPATCH<\/td>\n<td>DISPATCH, SÉCU, TOUS<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>SÉCURITÉ<\/td>\n<td>Numérique, large zone<\/td>\n<td>Itinérance<\/td>\n<td>selon site<\/td>\n<td>1<\/td>\n<td>SÉCURITÉ<\/td>\n<td>SÉCU, TOUS<\/td>\n<\/tr>\n<tr>\n<td><strong>2 – PIT<\/strong><\/td>\n<td>PIT-LOCAL<\/td>\n<td>Numérique, local<\/td>\n<td>155,1000 / 150,5000<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>PIT-LOCAL<\/td>\n<td>PIT-LOCAL, TOUS<\/td>\n<\/tr>\n<tr>\n<td><strong>3 – USINE<\/strong><\/td>\n<td>USINE-LOCAL<\/td>\n<td>Numérique, local<\/td>\n<td>155,2000 / 150,6000<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>USINE-LOCAL<\/td>\n<td>USINE-LOCAL, TOUS<\/td>\n<\/tr>\n<tr>\n<td><strong>4 – CAMP<\/strong><\/td>\n<td>CAMP-LOCAL<\/td>\n<td>Numérique, local<\/td>\n<td>155,3000 / 150,7000<\/td>\n<td>3<\/td>\n<td>2<\/td>\n<td>CAMP-LOCAL<\/td>\n<td>CAMP-LOCAL, TOUS<\/td>\n<\/tr>\n<tr>\n<td><strong>5 – SECOURS<\/strong><\/td>\n<td>DIRECT-1<\/td>\n<td>Direct, sans relais<\/td>\n<td>156,0000 / 156,0000<\/td>\n<td>1<\/td>\n<td>—<\/td>\n<td>DISPATCH<\/td>\n<td>Tous<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>ANA-PIT<\/td>\n<td>Analogique (radios anciennes)<\/td>\n<td>155,1000 / 150,5000<\/td>\n<td>CTCSS 88,5 Hz<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>La liste d’itinérance (Roam List)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Membre<\/th>\n<th>Canal<\/th>\n<th>Site<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>DISPATCH-A (155,1000 / 150,5000, CC 1, slot 1)<\/td>\n<td>Pit<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>DISPATCH-B (155,2000 / 150,6000, CC 2, slot 1)<\/td>\n<td>Usine<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>DISPATCH-C (155,3000 / 150,7000, CC 3, slot 1)<\/td>\n<td>Camp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La radio mesure le signal de chaque relais et se cale sur le <strong>meilleur<\/strong>. Le seuil de changement de site (<em>RSSI threshold<\/em>) se règle pour éviter que la radio « saute » sans arrêt entre deux sites.<\/p>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — gardez le <strong>même ordre de zones<\/strong> dans toutes les radios. Un opérateur qui change de radio retrouve ses canaux au même endroit, même en urgence.<\/p>\n<\/div>"},{"t":"Gérer une flotte de codeplugs","h":"<h2>Les versions<\/h2>\n<table>\n<thead>\n<tr>\n<th>Fichier<\/th>\n<th>Contenu<\/th>\n<th>Exemple de nom<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Référence portable<\/td>\n<td>Radio modèle validée<\/td>\n<td><code>KANKOU_R7_REF_v1.3_20261014.ctb<\/code><\/td>\n<\/tr>\n<tr>\n<td>Référence mobile<\/td>\n<td>Mobile modèle validé<\/td>\n<td><code>KANKOU_DM4600e_REF_v1.3.ctb<\/code><\/td>\n<\/tr>\n<tr>\n<td>Sauvegarde radio<\/td>\n<td>Lu avant modification<\/td>\n<td><code>R7_SN123456_20261014_avant.ctb<\/code><\/td>\n<\/tr>\n<tr>\n<td>Relais<\/td>\n<td>Configuration de chaque relais<\/td>\n<td><code>RELAIS1_PIT_MAITRE_v1.1.ctb<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Une modification = une nouvelle version.<\/strong> Notez dans le registre : ce qui a changé, pourquoi, qui, quand. Ne gardez jamais deux « références » différentes en circulation.<\/p>\n<\/div>\n<h2>Programmer en série<\/h2>\n<ol>\n<li>Préparez la <strong>référence<\/strong> et testez-la sur 2 ou 3 radios pendant quelques jours.<\/li>\n<li>Pour chaque radio : lire, <strong>sauvegarder l’original<\/strong>, appliquer la référence, changer <strong>ID et nom<\/strong>, écrire, tester.<\/li>\n<li>Tenez une <strong>feuille de suivi<\/strong> : n° de série, ID, version, date, technicien, test OK.<\/li>\n<\/ol>\n<h2>Mises à jour du micrologiciel (firmware)<\/h2>\n<ul>\n<li>Elles corrigent des défauts et ajoutent des fonctions, mais <strong>toute la flotte<\/strong> et les <strong>relais<\/strong> doivent rester <strong>compatibles<\/strong>.<\/li>\n<li>Testez la mise à jour sur quelques radios avant de l’appliquer à tout le parc.<\/li>\n<li>Batterie pleine ou alimentation stable : une coupure pendant la mise à jour peut bloquer la radio.<\/li>\n<\/ul>"}]},"avance-2":{"id":"avance-2","lvl":"avance","titre":"IP Site Connect pas à pas","steps":[{"t":"Comprendre IP Site Connect","h":"<div class=\"def\">\n<p><strong>IP Site Connect (IPSC)<\/strong> — un mode MOTOTRBO qui relie <strong>jusqu’à 15 relais<\/strong> (sur un ou plusieurs sites) par un <strong>réseau IP<\/strong>. Un appel lancé sur un relais est <strong>répété en même temps<\/strong> sur tous les autres. Les radios passent d’un site à l’autre <strong>automatiquement<\/strong> (itinérance).<\/p>\n<\/div>\n<figure class=\"fig\" data-fig=\"ipsc3\"><div class=\"plate\"><\/div><figcaption>Les trois sites de la Mine Kankou reliés par IP Site Connect.<\/figcaption><\/figure>\n<h2>Ce qu’IPSC apporte… et ce qu’il n’apporte pas<\/h2>\n<table>\n<thead>\n<tr>\n<th>Apporte<\/th>\n<th>N’apporte pas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Une <strong>couverture large zone<\/strong> : pit + usine + camp = un seul réseau<\/td>\n<td>Plus de <strong>capacité<\/strong> : un slot large zone reste <strong>un seul appel à la fois<\/strong> sur tous les sites<\/td>\n<\/tr>\n<tr>\n<td>L’<strong>itinérance<\/strong> automatique<\/td>\n<td>La traduction analogique ↔ numérique<\/td>\n<\/tr>\n<tr>\n<td>Des sites en <strong>VHF et UHF<\/strong> reliés entre eux<\/td>\n<td>La suppression des zones d’ombre d’un site<\/td>\n<\/tr>\n<tr>\n<td>Un dispatch central pour tous les sites<\/td>\n<td>Une sécurité réseau « automatique » (à configurer)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — utilisez <strong>un slot large zone<\/strong> (entendu partout : dispatch, sécurité, urgences) et <strong>un slot local<\/strong> par site (travail de l’équipe sur place). Le trafic local ne bloque pas les autres sites.<\/p>\n<\/div>\n<h2>Le maître et les pairs<\/h2>\n<ul>\n<li><strong>Un relais maître<\/strong> (<em>Master<\/em>) : il doit avoir une <strong>adresse IP fixe et joignable<\/strong> par tous les autres. Il « réunit » le système.<\/li>\n<li><strong>Les pairs<\/strong> (<em>Peers<\/em>) : ils connaissent l’<strong>adresse IP et le port UDP<\/strong> du maître et s’y connectent.<\/li>\n<li>Une fois connectés, les relais <strong>s’échangent directement<\/strong> la voix et les données.<\/li>\n<\/ul>"},{"t":"Étape 1 : préparer le réseau IP","h":"<h2>Le plan d’adressage<\/h2>\n<div class=\"exp\">\n<p><strong>Plan IP du cas d’étude<\/strong> (adresses <strong>fictives<\/strong>)<\/p>\n<table>\n<thead>\n<tr>\n<th>Site<\/th>\n<th>Réseau local<\/th>\n<th>Routeur (passerelle)<\/th>\n<th>Relais<\/th>\n<th>Adresse publique / VPN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A – Pit<\/td>\n<td>10.10.1.0/24<\/td>\n<td>10.10.1.1<\/td>\n<td>10.10.1.10 (maître)<\/td>\n<td>Fixe : 196.x.x.10 ou via VPN<\/td>\n<\/tr>\n<tr>\n<td>B – Usine<\/td>\n<td>10.10.2.0/24<\/td>\n<td>10.10.2.1<\/td>\n<td>10.10.2.20 (pair)<\/td>\n<td>Via fibre / VPN<\/td>\n<\/tr>\n<tr>\n<td>C – Camp<\/td>\n<td>10.10.3.0/24<\/td>\n<td>10.10.3.1<\/td>\n<td>10.10.3.30 (pair)<\/td>\n<td>Via Starlink + VPN<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<h2>Les exigences du lien IP<\/h2>\n<table>\n<thead>\n<tr>\n<th>Exigence<\/th>\n<th>Valeur repère<\/th>\n<th>Remarque<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bande passante par relais<\/td>\n<td><strong>au moins 30 kbit/s<\/strong> pour la voix et les données, plus la supervision<\/td>\n<td>Prévoyez de la marge : 64 à 100 kbit/s par relais est confortable<\/td>\n<\/tr>\n<tr>\n<td>Délai (latence)<\/td>\n<td>Le plus bas et le plus <strong>stable<\/strong> possible<\/td>\n<td>Le relais a un réglage « normal » ou « élevé » du délai entre relais<\/td>\n<\/tr>\n<tr>\n<td>Gigue (variations)<\/td>\n<td>Faible<\/td>\n<td>Les variations font « hacher » la voix<\/td>\n<\/tr>\n<tr>\n<td>Disponibilité<\/td>\n<td>Proche de 100 %<\/td>\n<td>Un lien coupé = un site isolé du réseau<\/td>\n<\/tr>\n<tr>\n<td>Adresse du maître<\/td>\n<td><strong>Fixe<\/strong> et joignable<\/td>\n<td>IP publique fixe ou VPN<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Satellites<\/strong> — un VSAT <strong>géostationnaire<\/strong> ajoute un long délai (de l’ordre d’une demi-seconde aller-retour) : testez la qualité de la voix avant de l’adopter. Un satellite en orbite basse (type Starlink) a un délai beaucoup plus court, mais son adresse publique change souvent : on passe alors par un <strong>VPN<\/strong> pour garder une adresse fixe vers le maître.<\/p>\n<\/div>\n<h2>Le routeur, le NAT et le pare-feu<\/h2>\n<ul>\n<li>Si le maître est derrière un routeur, il faut une <strong>redirection de port<\/strong> (<em>port forwarding<\/em>) : le <strong>port UDP<\/strong> du maître doit être redirigé vers son adresse locale.<\/li>\n<li>Sur chaque site, le pare-feu ne laisse passer <strong>que le nécessaire<\/strong> : le port UDP de la liaison IPSC.<\/li>\n<li>La solution la plus propre : un <strong>VPN entre les routeurs<\/strong> des sites. Tous les relais se voient alors comme sur un même réseau privé, sans exposer de port sur Internet.<\/li>\n<\/ul>\n<figure class=\"fig\" data-fig=\"vpn\"><div class=\"plate\"><\/div><figcaption>Avec un VPN, les trois sites forment un seul réseau privé : pas de port ouvert sur Internet.<\/figcaption><\/figure>"},{"t":"Étape 2 : configurer les relais","h":"<p>Les réglages se font dans le logiciel <strong>CPS 2.0<\/strong>, relais par relais (connecté par USB). Les noms ci-dessous sont ceux du logiciel.<\/p>\n<h2>Réglages réseau (Network)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Relais 1 – Pit (maître)<\/th>\n<th>Relais 2 – Usine (pair)<\/th>\n<th>Relais 3 – Camp (pair)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>Link Type<\/em><\/td>\n<td><strong>Master<\/strong><\/td>\n<td><strong>Peer<\/strong><\/td>\n<td><strong>Peer<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>Ethernet IP<\/em><\/td>\n<td>10.10.1.10<\/td>\n<td>10.10.2.20<\/td>\n<td>10.10.3.30<\/td>\n<\/tr>\n<tr>\n<td><em>Gateway<\/em><\/td>\n<td>10.10.1.1<\/td>\n<td>10.10.2.1<\/td>\n<td>10.10.3.1<\/td>\n<\/tr>\n<tr>\n<td><em>Netmask<\/em><\/td>\n<td>255.255.255.0<\/td>\n<td>255.255.255.0<\/td>\n<td>255.255.255.0<\/td>\n<\/tr>\n<tr>\n<td><em>UDP Port<\/em> (du relais)<\/td>\n<td>50000 (exemple)<\/td>\n<td>50000<\/td>\n<td>50000<\/td>\n<\/tr>\n<tr>\n<td><em>Master IP<\/em><\/td>\n<td>—<\/td>\n<td>10.10.1.10 (via VPN)<\/td>\n<td>10.10.1.10 (via VPN)<\/td>\n<\/tr>\n<tr>\n<td><em>Master UDP Port<\/em><\/td>\n<td>50000<\/td>\n<td>50000<\/td>\n<td>50000<\/td>\n<\/tr>\n<tr>\n<td><em>Peer ID<\/em> (ID du relais)<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><em>Authentication Key<\/em><\/td>\n<td>La même clé sur les 3<\/td>\n<td>Idem<\/td>\n<td>Idem<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Réglages des canaux (Channels)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Relais 1<\/th>\n<th>Relais 2<\/th>\n<th>Relais 3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fréquence TX du relais<\/td>\n<td>155,1000<\/td>\n<td>155,2000<\/td>\n<td>155,3000<\/td>\n<\/tr>\n<tr>\n<td>Fréquence RX du relais<\/td>\n<td>150,5000<\/td>\n<td>150,6000<\/td>\n<td>150,7000<\/td>\n<\/tr>\n<tr>\n<td>Color code<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Slot 1<\/td>\n<td><strong>IP Site Connect (large zone)<\/strong><\/td>\n<td>Large zone<\/td>\n<td>Large zone<\/td>\n<\/tr>\n<tr>\n<td>Slot 2<\/td>\n<td><strong>Local<\/strong><\/td>\n<td>Local<\/td>\n<td>Local<\/td>\n<\/tr>\n<tr>\n<td>Mode<\/td>\n<td>Numérique<\/td>\n<td>Numérique<\/td>\n<td>Numérique<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — les temps de maintien (<em>hang time<\/em>) et les paramètres d’appel doivent être <strong>identiques<\/strong> sur tous les relais d’un même système. Programmez d’abord le maître, vérifiez-le, puis les pairs un par un.<\/p>\n<\/div>\n<h2>La balise pour l’itinérance<\/h2>\n<p>Pour que les radios sachent quel relais est le meilleur, les relais peuvent émettre une <strong>balise<\/strong> (<em>beacon<\/em>) quand ils sont au repos. La radio mesure ce signal et choisit le site le plus fort. Réglez la durée et l’intervalle de balise selon la recommandation du fabricant : trop souvent, cela charge le canal ; trop rarement, l’itinérance est lente.<\/p>"},{"t":"Étape 3 : configurer les radios","h":"<ol>\n<li>Créez un <strong>canal large zone par site<\/strong> (même slot 1, groupe DISPATCH, avec la fréquence et le color code de chaque site).<\/li>\n<li>Créez une <strong>liste d’itinérance<\/strong> (<em>Roam List<\/em>) contenant ces canaux.<\/li>\n<li>Dans le canal DISPATCH de la zone principale, <strong>associez la liste d’itinérance<\/strong>.<\/li>\n<li>Réglez le <strong>seuil d’itinérance<\/strong> (<em>RSSI threshold<\/em>) : la radio cherche un autre site quand le signal descend sous ce seuil.<\/li>\n<li>Ajoutez les <strong>canaux locaux<\/strong> de chaque site (slot 2).<\/li>\n<li>Écrivez la radio et <strong>testez sur chaque site<\/strong>.<\/li>\n<\/ol>"},{"t":"Étape 4 : tester et réceptionner","h":"<table>\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Méthode<\/th>\n<th>Résultat attendu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Connexion des relais<\/td>\n<td>Logiciel de diagnostic du relais (RDAC) ou voyants<\/td>\n<td>Les 3 relais sont connectés au maître<\/td>\n<\/tr>\n<tr>\n<td>Ping IP<\/td>\n<td>Depuis un PC sur chaque site vers le maître<\/td>\n<td>Réponse stable, sans perte<\/td>\n<\/tr>\n<tr>\n<td>Appel large zone<\/td>\n<td>Appel DISPATCH depuis A, écoute en B et C<\/td>\n<td>Entendu sur les 3 sites<\/td>\n<\/tr>\n<tr>\n<td>Appel local<\/td>\n<td>Appel PIT-LOCAL depuis A<\/td>\n<td>Entendu <strong>seulement<\/strong> en A<\/td>\n<\/tr>\n<tr>\n<td>Itinérance<\/td>\n<td>Rouler du pit vers l’usine en restant sur DISPATCH<\/td>\n<td>La radio change de site toute seule<\/td>\n<\/tr>\n<tr>\n<td>Coupure de lien<\/td>\n<td>Débrancher le lien du site C<\/td>\n<td>A et B continuent ; C fonctionne en local
