<\/td>\n<\/tr>\n<tr>\n<td>Urgence<\/td>\n<td>Bouton d’urgence depuis C<\/td>\n<td>Alarme reçue au dispatch en A<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Dépanner IP Site Connect","h":"<table>\n<thead>\n<tr>\n<th>Symptôme<\/th>\n<th>Causes probables<\/th>\n<th>Vérifications<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Un pair ne se connecte pas<\/td>\n<td>Mauvaise IP ou port du maître ; port non redirigé ; clé différente ; VPN tombé<\/td>\n<td>Ping vers le maître ; redirection du port UDP ; clé d’authentification identique<\/td>\n<\/tr>\n<tr>\n<td>Appels large zone entendus seulement en local<\/td>\n<td>Slot mal configuré (local au lieu de large zone)<\/td>\n<td>Réglage du slot 1 sur chaque relais<\/td>\n<\/tr>\n<tr>\n<td>Voix hachée entre sites<\/td>\n<td>Bande passante insuffisante, gigue, perte de paquets<\/td>\n<td>Mesure du lien ; priorité (QoS) pour le trafic radio<\/td>\n<\/tr>\n<tr>\n<td>La radio ne change pas de site<\/td>\n<td>Pas de liste d’itinérance, seuil mal réglé, balise absente<\/td>\n<td>Roam list, seuil RSSI, réglage de balise<\/td>\n<\/tr>\n<tr>\n<td>Tout le système tombe<\/td>\n<td>Le maître est hors service ou injoignable<\/td>\n<td>Énergie et lien du maître ; prévoir un relais et une configuration de secours<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Le maître est le point sensible.<\/strong> Placez-le sur le site au <strong>lien le plus fiable<\/strong> et à l’<strong>énergie la mieux secourue<\/strong>. Gardez une <strong>configuration de secours<\/strong> prête pour transformer rapidement un pair en maître si nécessaire.<\/p>\n<\/div>"}]},"avance-3":{"id":"avance-3","lvl":"avance","titre":"Capacity Plus","steps":[{"t":"Comprendre le trunking","h":"<div class=\"def\">\n<p><strong>Trunking (partage de canaux)<\/strong> — au lieu de donner un canal fixe à chaque équipe, on met <strong>plusieurs relais en commun<\/strong>. Quand quelqu’un appuie sur le bouton, le système lui donne <strong>automatiquement un canal libre<\/strong>. Comme aux guichets d’une banque : une seule file d’attente, et le premier guichet libre appelle le client suivant.<\/p>\n<\/div>\n<figure class=\"fig\" data-fig=\"trunking\"><div class=\"plate\"><\/div><figcaption>Sans trunking, une équipe attend alors qu’un autre canal est libre. Avec trunking, l’appel part sur le premier canal libre.<\/figcaption><\/figure>\n<h2>Le canal de repos (rest channel)<\/h2>\n<p>Capacity Plus n’a <strong>pas de canal de contrôle dédié<\/strong> : un des relais libres sert de <strong>canal de repos<\/strong>. Toutes les radios inactives l’écoutent.<\/p>\n<ol>\n<li>Une radio veut parler : elle émet sur le <strong>canal de repos<\/strong>.<\/li>\n<li>L’appel commence sur ce canal ; les radios du groupe concerné y restent.<\/li>\n<li>Le système désigne aussitôt <strong>un autre relais libre<\/strong> comme nouveau canal de repos, et les autres radios y passent.<\/li>\n<li>À la fin de l’appel, le canal redevient libre.<\/li>\n<\/ol>\n<figure class=\"fig\" data-fig=\"rest_channel\"><div class=\"plate\"><\/div><figcaption>Le canal de repos « se déplace » d’un relais libre à l’autre.<\/figcaption><\/figure>\n<h2>Les chiffres repères (documentation Motorola)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Système<\/th>\n<th>Sites<\/th>\n<th>Relais par site<\/th>\n<th>Utilisateurs (recommandé)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Conventionnel (1 relais)<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>jusqu’à 200 radios<\/td>\n<\/tr>\n<tr>\n<td>IP Site Connect<\/td>\n<td>jusqu’à 15<\/td>\n<td>1<\/td>\n<td>jusqu’à 200 radios par site<\/td>\n<\/tr>\n<tr>\n<td><strong>Capacity Plus<\/strong> (mono-site)<\/td>\n<td>1<\/td>\n<td>jusqu’à <strong>12<\/strong> (dont relais voix/données et relais de données)<\/td>\n<td>jusqu’à <strong>1 600 radios<\/strong> par site<\/td>\n<\/tr>\n<tr>\n<td><strong>Capacity Plus multi-site<\/strong><\/td>\n<td>jusqu’à <strong>15<\/strong><\/td>\n<td>jusqu’à 12 (souvent présenté comme 8 relais « trunkés » par site)<\/td>\n<td>jusqu’à 1 600 par site<\/td>\n<\/tr>\n<tr>\n<td>Capacity Max<\/td>\n<td>jusqu’à 250<\/td>\n<td>jusqu’à 21<\/td>\n<td>jusqu’à 3 000 par site<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Quand choisir Capacity Plus ?<\/strong> Quand <strong>un seul site<\/strong> a beaucoup d’utilisateurs et que les canaux sont saturés (attentes au bouton, « bip occupé »). Quand on veut <strong>relier plusieurs sites<\/strong>, chacun avec plusieurs relais : Capacity Plus multi-site. Quand le besoin est surtout de <strong>couvrir plusieurs sites<\/strong> avec peu d’utilisateurs : IP Site Connect suffit.<\/p>\n<\/div>"},{"t":"Configurer un site Capacity Plus","h":"<h2>L’architecture<\/h2>\n<figure class=\"fig\" data-fig=\"capplus_site\"><div class=\"plate\"><\/div><figcaption>Un site Capacity Plus : plusieurs relais sur le même réseau local (commutateur + routeur), chacun avec sa paire de fréquences, combinés sur l’antenne.<\/figcaption><\/figure>\n<ul>\n<li><strong>Plusieurs relais<\/strong>, chacun avec <strong>sa propre paire de fréquences<\/strong> (toutes autorisées par l’AMRTP).<\/li>\n<li>Les relais sont reliés au <strong>même réseau local<\/strong> (commutateur Ethernet + routeur du site).<\/li>\n<li>Les relais partagent l’antenne via un <strong>combineur<\/strong> (émission) et un <strong>multicoupleur<\/strong> (réception), ou utilisent plusieurs antennes bien séparées.<\/li>\n<li>Un relais est <strong>maître<\/strong>, les autres sont <strong>pairs<\/strong> (comme en IPSC).<\/li>\n<\/ul>\n<h2>Les réglages des relais<\/h2>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Relais 1 (maître)<\/th>\n<th>Relais 2<\/th>\n<th>Relais 3<\/th>\n<th>Relais 4<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mode<\/td>\n<td>Capacity Plus<\/td>\n<td>Capacity Plus<\/td>\n<td>Capacity Plus<\/td>\n<td>Capacity Plus<\/td>\n<\/tr>\n<tr>\n<td>Fréquences TX / RX (fictives)<\/td>\n<td>155,100 / 150,500<\/td>\n<td>155,125 / 150,525<\/td>\n<td>155,150 / 150,550<\/td>\n<td>155,175 / 150,575<\/td>\n<\/tr>\n<tr>\n<td>Color code<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td><em>Link Type<\/em><\/td>\n<td>Master<\/td>\n<td>Peer<\/td>\n<td>Peer<\/td>\n<td>Peer<\/td>\n<\/tr>\n<tr>\n<td><em>Ethernet IP<\/em><\/td>\n<td>10.10.1.11<\/td>\n<td>10.10.1.12<\/td>\n<td>10.10.1.13<\/td>\n<td>10.10.1.14<\/td>\n<\/tr>\n<tr>\n<td><em>Master IP / port<\/em><\/td>\n<td>—<\/td>\n<td>10.10.1.11 / port du maître<\/td>\n<td>Idem<\/td>\n<td>Idem<\/td>\n<\/tr>\n<tr>\n<td><em>Rest Channel/Site IP + port<\/em><\/td>\n<td><strong>Identiques sur tous les relais<\/strong><\/td>\n<td>Idem<\/td>\n<td>Idem<\/td>\n<td>Idem<\/td>\n<\/tr>\n<tr>\n<td>Numéro de canal slot 1 / slot 2<\/td>\n<td>1 / 2<\/td>\n<td>3 / 4<\/td>\n<td>5 / 6<\/td>\n<td>7 / 8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Deux règles à ne pas oublier<\/strong> — 1) le numéro de canal du <strong>slot 2 = slot 1 + 1<\/strong>, et aucun numéro ne doit se répéter entre relais ; 2) l’adresse et le port du <strong>canal de repos<\/strong> (<em>Rest Channel/Site IP<\/em>) doivent être <strong>exactement les mêmes<\/strong> sur tous les relais du site. Des licences logicielles peuvent être nécessaires selon les modèles : vérifiez-le avant l’achat.<\/p>\n<\/div>\n<h2>Les réglages des radios<\/h2>\n<ol>\n<li>Créez un canal de type <strong>Capacity Plus<\/strong> (<em>Capacity Plus Personality<\/em>).<\/li>\n<li>Renseignez la <strong>liste des canaux voix<\/strong> du site (<em>Voice Channel List<\/em>) : les fréquences de chaque relais, <strong>dans l’ordre des numéros de canal<\/strong> (1-2, 3-4, 5-6…).<\/li>\n<li>Ajoutez les <strong>groupes<\/strong> (talkgroups) et la <strong>liste RX<\/strong>.<\/li>\n<li>Même <strong>color code<\/strong> que les relais.<\/li>\n<li>Gardez un <strong>canal direct<\/strong> de secours dans une autre zone.<\/li>\n<\/ol>\n<div class=\"exp\">\n<p><strong>Exemple<\/strong> — 4 relais = <strong>8 slots<\/strong> = jusqu’à <strong>8 conversations en même temps<\/strong> sur le site, partagées automatiquement entre tous les groupes (DISPATCH, PIT, MAINTENANCE, SÉCURITÉ, sous-traitants…). Sans trunking, ces 4 relais en conventionnel donneraient aussi 8 slots, mais chaque groupe resterait bloqué sur <strong>son<\/strong> slot même si les autres sont libres.<\/p>\n<\/div>"},{"t":"Capacity Plus multi-site","h":"<p>Pour relier <strong>plusieurs sites Capacity Plus<\/strong> (jusqu’à 15), on relie les réseaux locaux des sites par IP, comme en IP Site Connect.<\/p>\n<table>\n<thead>\n<tr>\n<th>Point<\/th>\n<th>À retenir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Groupes large zone<\/td>\n<td>Certains groupes (DISPATCH, SÉCURITÉ) sont entendus sur tous les sites<\/td>\n<\/tr>\n<tr>\n<td>Groupes locaux<\/td>\n<td>Les autres restent sur leur site : ils n’occupent pas les canaux des autres sites<\/td>\n<\/tr>\n<tr>\n<td>Itinérance<\/td>\n<td>Les radios passent d’un site à l’autre automatiquement<\/td>\n<\/tr>\n<tr>\n<td>Bande passante<\/td>\n<td>Plus de relais = plus de trafic IP : dimensionnez le lien en conséquence<\/td>\n<\/tr>\n<tr>\n<td>Fréquences<\/td>\n<td>Chaque site a ses propres paires de fréquences<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — ne mettez en <strong>large zone<\/strong> que ce qui doit vraiment être entendu partout. Un groupe large zone utilise un slot <strong>sur chaque site<\/strong> pendant l’appel : trop de groupes large zone, et tous les sites se saturent.<\/p>\n<\/div>"},{"t":"Choisir le bon système","h":"<figure class=\"fig\" data-fig=\"choose_system\"><div class=\"plate\"><\/div><figcaption>Arbre de décision simple pour choisir le système.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Besoin<\/th>\n<th>Système conseillé<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Un site, peu d’utilisateurs<\/td>\n<td>Conventionnel (1 relais, 2 slots)<\/td>\n<\/tr>\n<tr>\n<td>Plusieurs sites, peu d’utilisateurs par site<\/td>\n<td><strong>IP Site Connect<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Un site, beaucoup d’utilisateurs<\/td>\n<td><strong>Capacity Plus<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Plusieurs sites, beaucoup d’utilisateurs<\/td>\n<td><strong>Capacity Plus multi-site<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Très grand réseau (dizaines de sites, milliers d’utilisateurs)<\/td>\n<td>Capacity Max<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},"avance-4":{"id":"avance-4","lvl":"avance","titre":"Relier des sites distants","steps":[{"t":"Les quatre situations possibles","h":"<p>Avant de choisir une solution, posez-vous <strong>deux questions<\/strong> : 1) les <strong>zones de couverture<\/strong> des sites se <strong>chevauchent-elles<\/strong> ? 2) le réseau est-il <strong>analogique ou numérique<\/strong> ?<\/p>\n<figure class=\"fig\" data-fig=\"four_cases\"><div class=\"plate\"><\/div><figcaption>Les quatre situations et la solution adaptée à chacune.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Solution<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1.<\/strong> Sites <strong>éloignés<\/strong>, couvertures <strong>séparées<\/strong>, on veut les <strong>mêmes fréquences<\/strong><\/td>\n<td>Réutilisation des fréquences (si l’AMRTP l’autorise) + liaison IP ou radio pour relier l’audio<\/td>\n<\/tr>\n<tr>\n<td><strong>2.<\/strong> Couvertures qui <strong>se chevauchent<\/strong><\/td>\n<td><strong>Fréquences différentes<\/strong> par site + itinérance (IPSC) ; ou <strong>simulcast<\/strong> (même fréquence, synchronisée)<\/td>\n<\/tr>\n<tr>\n<td><strong>3.<\/strong> Réseau <strong>analogique<\/strong> à relier<\/td>\n<td><strong>Passerelle RoIP<\/strong> ou liaison radio entre relais (voir plus loin)<\/td>\n<\/tr>\n<tr>\n<td><strong>4.<\/strong> Réseau <strong>numérique DMR<\/strong> à relier<\/td>\n<td><strong>IP Site Connect<\/strong> ou <strong>Capacity Plus multi-site<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"La même fréquence sur plusieurs sites","h":"<h2>Cas 1 : des sites assez éloignés pour ne pas se gêner<\/h2>\n<p>Si deux sites sont séparés par une grande distance ou par le relief (par exemple deux mines à plus de 100 km), leurs relais peuvent <strong>utiliser la même paire de fréquences<\/strong> sans se brouiller : c’est la <strong>réutilisation de fréquences<\/strong>. Chaque site fonctionne normalement, et on peut relier l’audio des deux sites par IP.<\/p>\n<div class=\"warn\">\n<p><strong>Condition<\/strong> : les couvertures ne doivent <strong>jamais<\/strong> se recouvrir, y compris par propagation exceptionnelle (temps chaud, relief favorable). Et l’<strong>AMRTP<\/strong> doit autoriser l’utilisation de la fréquence sur chaque site : une assignation est liée à un lieu.<\/p>\n<\/div>\n<h2>Cas 2 : des couvertures qui se chevauchent<\/h2>\n<p>Si une radio peut recevoir <strong>deux relais en même temps<\/strong> sur la même fréquence, les deux signaux se mélangent : sifflements, voix incompréhensible, coupures. Deux solutions :<\/p>\n<p><strong>a) Des fréquences différentes par site (la solution simple).<\/strong> Chaque relais a sa paire de fréquences. Les radios passent d’un relais à l’autre grâce à l’<strong>itinérance<\/strong> IP Site Connect. C’est la solution du cas d’étude Kankou.<\/p>\n<p><strong>b) Le simulcast (la solution complexe).<\/strong> Plusieurs émetteurs émettent <strong>la même fréquence au même instant<\/strong>, parfaitement <strong>synchronisés par GPS<\/strong>. Dans la zone de recouvrement, la radio reçoit les deux signaux, mais ils sont alignés et le plus fort l’emporte. Avantage : une seule fréquence pour une grande zone. Inconvénients : matériel spécialisé, étude de couverture poussée, réglages fins et coût élevé.<\/p>\n<figure class=\"fig\" data-fig=\"simulcast\"><div class=\"plate\"><\/div><figcaption>Sans synchronisation, les deux signaux se brouillent dans la zone de recouvrement. Avec le simulcast, ils sont alignés.<\/figcaption><\/figure>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — en numérique, donnez un <strong>color code différent<\/strong> à chaque site qui partagerait une fréquence : une radio ignorera le relais « étranger ». Mais attention : le color code évite les erreurs de <strong>décodage<\/strong>, il <strong>n’empêche pas<\/strong> le brouillage radio si les deux signaux arrivent ensemble.<\/p>\n<\/div>"},{"t":"Relier des sites analogiques","h":"<p>Le mode analogique ne passe pas par IP Site Connect. Pour relier deux relais analogiques éloignés, il existe trois grandes méthodes.<\/p>\n<h2>Méthode 1 : la passerelle RoIP (Radio over IP)<\/h2>\n<figure class=\"fig\" data-fig=\"roip\"><div class=\"plate\"><\/div><figcaption>Une passerelle RoIP sur chaque site transporte l’audio et les commandes d’émission sur le réseau IP.<\/figcaption><\/figure>\n<ul>\n<li>Sur chaque site, une <strong>passerelle RoIP<\/strong> se branche sur le <strong>connecteur d’accessoires<\/strong> du relais (ou d’un poste fixe) : <strong>audio d’entrée<\/strong>, <strong>audio de sortie<\/strong>, signal <strong>« porteuse reçue »<\/strong> (COR) et commande d’<strong>émission<\/strong> (PTT).<\/li>\n<li>Les passerelles s’échangent l’audio par le <strong>réseau IP<\/strong> (fibre, faisceau, VSAT, Starlink, 4G avec VPN).<\/li>\n<li>Quand quelqu’un parle sur le site A, la passerelle B <strong>déclenche l’émission<\/strong> du relais B avec le même audio.<\/li>\n<li>Des fabricants spécialisés proposent ces passerelles (par exemple pour relier plusieurs sites relais ou des radios de marques différentes).<\/li>\n<\/ul>\n<h2>Méthode 2 : la liaison radio entre sites<\/h2>\n<ul>\n<li>Une <strong>radio de liaison<\/strong> (poste fixe avec antenne directive) sur le site A est réglée sur le relais B, et inversement, reliées « dos à dos » au relais local.<\/li>\n<li>Simple et sans Internet, mais il faut une <strong>ligne de vue<\/strong> entre les sites (ou un relais intermédiaire) et des <strong>fréquences de liaison<\/strong> autorisées.<\/li>\n<\/ul>\n<h2>Méthode 3 : passer au numérique<\/h2>\n<p>C’est souvent la meilleure solution à moyen terme : un réseau <strong>DMR<\/strong> relié par <strong>IP Site Connect<\/strong> apporte la liaison entre sites, l’itinérance, l’identité des appelants et le GPS. Pendant la migration, le <strong>mode mixte<\/strong> permet de garder les radios analogiques <strong>en local<\/strong> sur chaque site.<\/p>\n<div class=\"warn\">\n<p><strong>Ce qu’une passerelle ne fait pas<\/strong> : elle relie l’audio, mais <strong>pas<\/strong> les fonctions numériques (ID, GPS, textes). Et un relais analogique relié à un relais numérique par une passerelle « double » le codage de la voix : la qualité baisse un peu.<\/p>\n<\/div>"},{"t":"Les liaisons entre sites","h":"<table>\n<thead>\n<tr>\n<th>Liaison<\/th>\n<th>Distance<\/th>\n<th>Débit<\/th>\n<th>Délai<\/th>\n<th>Points forts<\/th>\n<th>Points faibles<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Fibre optique<\/strong><\/td>\n<td>Plusieurs dizaines de km<\/td>\n<td>Très élevé<\/td>\n<td>Très faible<\/td>\n<td>La plus fiable<\/td>\n<td>Coût de pose, risque de coupure par engins<\/td>\n<\/tr>\n<tr>\n<td><strong>Faisceau hertzien<\/strong><\/td>\n<td>Jusqu’à plusieurs dizaines de km par bond<\/td>\n<td>Élevé<\/td>\n<td>Faible<\/td>\n<td>Rapide à installer, indépendant<\/td>\n<td>Ligne de vue obligatoire, alignement<\/td>\n<\/tr>\n<tr>\n<td><strong>4G / LTE + VPN<\/strong><\/td>\n<td>Là où il y a du réseau<\/td>\n<td>Moyen<\/td>\n<td>Moyen et variable<\/td>\n<td>Peu cher<\/td>\n<td>Dépend de l’opérateur<\/td>\n<\/tr>\n<tr>\n<td><strong>Starlink (orbite basse) + VPN<\/strong><\/td>\n<td>Partout<\/td>\n<td>Élevé<\/td>\n<td>Faible à moyen<\/td>\n<td>Rapide, partout<\/td>\n<td>Adresse publique changeante, dépendance au service<\/td>\n<\/tr>\n<tr>\n<td><strong>VSAT géostationnaire<\/strong><\/td>\n<td>Partout<\/td>\n<td>Moyen<\/td>\n<td><strong>Élevé<\/strong> (≈ 0,5 s aller-retour)<\/td>\n<td>Éprouvé, contrats pros<\/td>\n<td>Délai : tester la qualité voix<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Le faisceau hertzien et la zone de Fresnel<\/h2>\n<p>Un faisceau hertzien a besoin de <strong>ligne de vue<\/strong>, mais pas seulement : il faut aussi dégager une zone en forme de « ballon de rugby » autour de la ligne droite entre les deux antennes : la <strong>zone de Fresnel<\/strong>.<\/p>\n<figure class=\"fig\" data-fig=\"fresnel\"><div class=\"plate\"><\/div><figcaption>La zone de Fresnel : au moins 60 % de son rayon doit être dégagée (arbres, relief, verses, bâtiments).<\/figcaption><\/figure>\n<div class=\"exp\">\n<p><strong>Calcul simple du rayon au milieu du bond<\/strong> : <strong>r (m) ≈ 8,66 × √( D (km) ÷ f (GHz) )<\/strong>\nExemple : bond de <strong>20 km<\/strong> à <strong>5,8 GHz<\/strong> → r ≈ 8,66 × √(20 ÷ 5,8) ≈ 8,66 × 1,86 ≈ <strong>16 m<\/strong>.\nIl faut dégager au moins 60 % de ce rayon, soit <strong>≈ 10 m<\/strong> au-dessus de tout obstacle au milieu du bond, en plus de la courbure de la Terre sur les longs bonds.<\/p>\n<\/div>"},{"t":"Le cas d’étude complet : Kankou","h":"<figure class=\"fig\" data-fig=\"kankou_full\"><div class=\"plate\"><\/div><figcaption>Le réseau final de la Mine Kankou.<\/figcaption><\/figure>\n<ol>\n<li><strong>Site A – Pit<\/strong> : relais 1 (<strong>maître IPSC<\/strong>), dispatch principal, routeur, onduleur et batteries, fibre vers B.<\/li>\n<li><strong>Site B – Usine<\/strong> (25 km) : relais 2 (pair), fibre vers A, routeur.<\/li>\n<li><strong>Site C – Camp<\/strong> (60 km) : relais 3 (pair), lien <strong>Starlink + VPN<\/strong> vers A.<\/li>\n<li><strong>Slot 1<\/strong> large zone (DISPATCH, SÉCURITÉ) ; <strong>slot 2<\/strong> local sur chaque site.<\/li>\n<li>Radios : zone KANKOU avec <strong>itinérance<\/strong> sur les 3 sites + zones locales + zone SECOURS (direct et analogique).<\/li>\n<li>Anciennes radios analogiques : canal <strong>analogique local<\/strong> sur le relais du pit en <strong>mode mixte<\/strong>, jusqu’à la fin de la migration.<\/li>\n<li>Supervision des relais et <strong>dispatch logiciel<\/strong> sur le site A (Partie 5).<\/li>\n<\/ol>"}]},"avance-5":{"id":"avance-5","lvl":"avance","titre":"Dispatch, données et supervision","steps":[{"t":"Raccorder un dispatch logiciel","h":"<p>Un <strong>dispatch logiciel<\/strong> (par exemple TRBOnet ou SmartPTT) transforme un PC en poste central : appels, carte GPS, messages, enregistrement, alarmes.<\/p>\n<figure class=\"fig\" data-fig=\"dispatch_links\"><div class=\"plate\"><\/div><figcaption>Deux façons de raccorder le dispatch : par des postes de contrôle (radio), ou directement en IP au relais maître.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Méthode<\/th>\n<th>Principe<\/th>\n<th>Avantages<\/th>\n<th>Limites<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Postes de contrôle<\/strong> (<em>control stations<\/em>)<\/td>\n<td>Des mobiles fixes, reliés au PC, écoutent et parlent sur les canaux<\/td>\n<td>Simple, fonctionne avec tout système<\/td>\n<td>Un poste par slot ; câbles et radios à entretenir<\/td>\n<\/tr>\n<tr>\n<td><strong>Connexion IP au relais<\/strong><\/td>\n<td>Le logiciel se connecte au <strong>relais maître<\/strong> par le réseau<\/td>\n<td>Pas de radio supplémentaire, accès à tous les sites<\/td>\n<td>Licences et configuration réseau à prévoir<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Les réglages qui comptent<\/h2>\n<table>\n<thead>\n<tr>\n<th>Réglage<\/th>\n<th>Où<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ID des services de présence (ARS) et de messages (TMS)<\/td>\n<td>Radios et logiciel<\/td>\n<td>Le même ID partout (64250 est souvent utilisé)<\/td>\n<\/tr>\n<tr>\n<td>GPS activé, intervalle d’envoi<\/td>\n<td>Radios<\/td>\n<td>60 s pour les engins, 120 s pour les piétons (exemple)<\/td>\n<\/tr>\n<tr>\n<td>Canal de données (<em>data revert<\/em>)<\/td>\n<td>Radios et relais<\/td>\n<td>Pour ne pas encombrer la voix<\/td>\n<\/tr>\n<tr>\n<td>ID du poste de contrôle<\/td>\n<td>Postes de contrôle<\/td>\n<td>Selon la notice du logiciel<\/td>\n<\/tr>\n<tr>\n<td>Adresse du relais maître et port<\/td>\n<td>Logiciel<\/td>\n<td>Ceux du plan IP<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — le GPS envoyé trop souvent <strong>charge les slots<\/strong>. Un camion qui roule mérite des positions fréquentes ; un technicien à l’atelier, beaucoup moins. Réglez l’intervalle selon l’usage.<\/p>\n<\/div>\n<h2>Ce que le dispatch peut faire<\/h2>\n<ul>\n<li><strong>Appels<\/strong> de groupe, privés et généraux, depuis le PC.<\/li>\n<li><strong>Carte<\/strong> des radios et des engins (GPS), avec historique des trajets.<\/li>\n<li><strong>Alarmes<\/strong> : urgence, homme à terre, travailleur isolé, avec position.<\/li>\n<li><strong>Messages texte<\/strong> et alertes générales (tir, évacuation).<\/li>\n<li><strong>Enregistrement<\/strong> des communications, réécoute en cas d’incident.<\/li>\n<li><strong>Rapports<\/strong> : activité par radio, par groupe, par site.<\/li>\n<\/ul>"},{"t":"Superviser le réseau","h":"<h2>Les outils<\/h2>\n<ul>\n<li><strong>Le logiciel de diagnostic du relais<\/strong> (chez Motorola : RDAC, <em>Repeater Diagnostics And Control<\/em>) : état des relais, alarmes (température, puissance, TOS), connexion IP Site Connect, activation à distance.<\/li>\n<li><strong>La supervision IP<\/strong> : ping régulier des relais et des routeurs, alertes en cas de coupure.<\/li>\n<li><strong>Les alarmes d’énergie<\/strong> : secteur, batteries, solaire, onduleur.<\/li>\n<\/ul>\n<h2>Les indicateurs à suivre<\/h2>\n<table>\n<thead>\n<tr>\n<th>Indicateur<\/th>\n<th>Pourquoi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Disponibilité de chaque relais et de chaque lien IP<\/td>\n<td>Repérer le maillon faible<\/td>\n<\/tr>\n<tr>\n<td>Taux d’occupation des slots aux heures de pointe<\/td>\n<td>Savoir quand passer en Capacity Plus<\/td>\n<\/tr>\n<tr>\n<td>Appels refusés ou en attente (« bip occupé »)<\/td>\n<td>Saturation<\/td>\n<\/tr>\n<tr>\n<td>Nombre d’alarmes d’urgence et délai de réponse<\/td>\n<td>Sécurité<\/td>\n<\/tr>\n<tr>\n<td>Itinérances anormales (radios qui changent sans arrêt de site)<\/td>\n<td>Seuils mal réglés, zones limites<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Sécuriser le réseau","h":"<table>\n<thead>\n<tr>\n<th>Menace<\/th>\n<th>Protection<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Écoute des conversations<\/td>\n<td><strong>Chiffrement<\/strong> (clés identiques sur toute la flotte, gardées secrètes)<\/td>\n<\/tr>\n<tr>\n<td>Radio volée ou perdue<\/td>\n<td><strong>Désactivation à distance<\/strong> (si la fonction est disponible) ; ID retiré du système<\/td>\n<\/tr>\n<tr>\n<td>Reprogrammation sauvage<\/td>\n<td><strong>Mot de passe<\/strong> de programmation<\/td>\n<\/tr>\n<tr>\n<td>Intrusion par le réseau IP<\/td>\n<td><strong>VPN<\/strong>, pare-feu, clé d’authentification IPSC, mots de passe forts sur les routeurs<\/td>\n<\/tr>\n<tr>\n<td>Erreur de configuration<\/td>\n<td>Versions de codeplug, sauvegardes, modifications validées<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Les clés de chiffrement et les mots de passe<\/strong> se gardent dans un document <strong>confidentiel<\/strong>, accessible seulement au service radio. Ne les envoyez jamais par message radio, ni par une messagerie non sécurisée.<\/p>\n<\/div>"}]},"expert-1":{"id":"expert-1","lvl":"expert","titre":"Le souterrain dans un réseau multi-sites","steps":[{"t":"Intégrer le souterrain au réseau","h":"<p>Le principe du câble rayonnant est expliqué dans le Tome 1. Ici, la question est : <strong>comment le souterrain rejoint-il le reste du réseau ?<\/strong><\/p>\n<figure class=\"fig\" data-fig=\"ug_ipsc\"><div class=\"plate\"><\/div><figcaption>Le souterrain devient un « site » de plus : un relais en surface alimente le câble rayonnant et rejoint les autres sites par IP Site Connect.<\/figcaption><\/figure>\n<ul>\n<li>La <strong>tête de réseau<\/strong> du câble rayonnant est un <strong>relais<\/strong> (par exemple un SLR 5500) placé en surface ou à l’entrée.<\/li>\n<li>Ce relais devient un <strong>pair IP Site Connect<\/strong> comme les autres : le slot large zone porte le DISPATCH et la SÉCURITÉ jusqu’au fond de la mine.<\/li>\n<li>Le slot local reste pour les équipes du souterrain.<\/li>\n<li>Une <strong>fibre<\/strong> relie la tête de réseau au routeur du site.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Point<\/th>\n<th>À retenir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bande<\/td>\n<td>Le câble rayonnant et ses amplificateurs doivent être prévus pour la bande du relais (VHF ou UHF)<\/td>\n<\/tr>\n<tr>\n<td>Numérique<\/td>\n<td>Le DMR passe sur un câble rayonnant si le système (amplificateurs, filtres) est compatible : vérifiez avec le fabricant<\/td>\n<\/tr>\n<tr>\n<td>Itinérance<\/td>\n<td>À l’entrée de la galerie, la radio passe du relais de surface au relais du souterrain<\/td>\n<\/tr>\n<tr>\n<td>Données<\/td>\n<td>Pour la localisation et les données haut débit, on ajoute souvent un réseau Wi-Fi ou maillé, relié par la même fibre<\/td>\n<\/tr>\n<tr>\n<td>Secours<\/td>\n<td>Batteries sur les alimentations de ligne ; poste fixe dans chaque refuge<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — prévoyez dans le plan de fréquences une <strong>paire dédiée<\/strong> au souterrain, et un <strong>color code<\/strong> différent de celui des relais de surface : on évite qu’une radio à l’entrée de la galerie se cale sur le mauvais relais.<\/p>\n<\/div>"}]},"expert-2":{"id":"expert-2","lvl":"expert","titre":"Concevoir, documenter, réceptionner","steps":[{"t":"Concevoir un réseau en 8 étapes","h":"<ol>\n<li><strong>Recenser les besoins<\/strong> : sites, utilisateurs par site, groupes, engins, zones critiques, besoins de données (GPS, texte, homme à terre).<\/li>\n<li><strong>Choisir l’architecture<\/strong> : conventionnel, IP Site Connect, Capacity Plus, multi-site (voir l’arbre de décision, Partie 3).<\/li>\n<li><strong>Estimer la capacité<\/strong> : nombre de slots nécessaires aux heures de pointe.<\/li>\n<li><strong>Étudier la couverture<\/strong> : points hauts, bilan de liaison, test terrain.<\/li>\n<li><strong>Préparer le plan de fréquences<\/strong> et le dossier <strong>AMRTP<\/strong>.<\/li>\n<li><strong>Préparer le plan IP<\/strong> et les liaisons entre sites.<\/li>\n<li><strong>Écrire les codeplugs de référence<\/strong> (radios et relais).<\/li>\n<li><strong>Installer, tester, réceptionner, documenter.<\/strong><\/li>\n<\/ol>"},{"t":"Estimer la capacité","h":"<table>\n<thead>\n<tr>\n<th>Repère (documentation Motorola, valeurs recommandées)<\/th>\n<th>Valeur<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Radios par relais conventionnel<\/td>\n<td>jusqu’à ≈ 200<\/td>\n<\/tr>\n<tr>\n<td>Radios par site IP Site Connect<\/td>\n<td>jusqu’à ≈ 200<\/td>\n<\/tr>\n<tr>\n<td>Radios par site Capacity Plus<\/td>\n<td>jusqu’à ≈ 1 600<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Le bon signe de saturation<\/strong> : des utilisateurs qui entendent souvent la tonalité « occupé », ou qui attendent avant de pouvoir parler aux heures de changement de poste. Mesurez l’occupation des slots avec le logiciel de supervision avant d’acheter des relais supplémentaires.<\/p>\n<\/div>"},{"t":"Le bilan de liaison (simple)","h":"<p>Le bilan de liaison permet d’<strong>estimer<\/strong> si un signal arrivera assez fort, avant de poser le moindre relais.<\/p>\n<div class=\"def\">\n<p><strong>Signal reçu (dBm) = puissance émise (dBm) – pertes de câble (dB) + gain d’antenne (dBi) – pertes de parcours (dB) + gain de l’antenne de réception (dBi)<\/strong>\nLes <strong>pertes en espace libre<\/strong> se calculent avec : <strong>32,45 + 20 log₁₀(d en km) + 20 log₁₀(f en MHz)<\/strong>.<\/p>\n<\/div>\n<div class=\"exp\">\n<p><strong>Exemple<\/strong> — relais 25 W (<strong>44 dBm<\/strong>), 2 dB de pertes de câble, antenne de 6 dBi → puissance rayonnée ≈ <strong>48 dBm<\/strong>.\nÀ <strong>20 km<\/strong> et <strong>155 MHz<\/strong> : 32,45 + 20 log₁₀(20) + 20 log₁₀(155) = 32,45 + 26,0 + 43,8 ≈ <strong>102 dB<\/strong>.\nSignal reçu en espace libre ≈ 48 – 102 ≈ <strong>–54 dBm<\/strong> (antenne de réception à 0 dBi).\nSur le terrain, le relief, la végétation et les bâtiments ajoutent souvent <strong>20 à 40 dB<\/strong> de pertes, voire plus. On compare ensuite à la <strong>sensibilité<\/strong> de la radio (fiche technique) et on garde une <strong>marge<\/strong> confortable.<\/p>\n<\/div>\n<div class=\"warn\">\n<p>Le bilan de liaison est une <strong>estimation<\/strong>. Il ne remplace jamais le <strong>test de couverture sur le terrain<\/strong>, surtout dans un pit qui se creuse.<\/p>\n<\/div>"},{"t":"Prévoir les pannes : la redondance","h":"<table>\n<thead>\n<tr>\n<th>Point faible<\/th>\n<th>Solution<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Relais maître IPSC<\/td>\n<td>Énergie très bien secourue, configuration de secours prête pour un pair<\/td>\n<\/tr>\n<tr>\n<td>Lien IP unique d’un site<\/td>\n<td>Deuxième lien (fibre + Starlink, ou faisceau + 4G)<\/td>\n<\/tr>\n<tr>\n<td>Énergie<\/td>\n<td>Onduleur + batteries + solaire ou groupe ; alarmes<\/td>\n<\/tr>\n<tr>\n<td>Un relais en panne<\/td>\n<td>Relais de rechange programmé en magasin ; répéteur portable<\/td>\n<\/tr>\n<tr>\n<td>Le dispatch<\/td>\n<td>Poste de secours (portable chargé, deuxième PC)<\/td>\n<\/tr>\n<tr>\n<td>Les fichiers<\/td>\n<td>Sauvegardes des codeplugs hors site<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Réceptionner un réseau","h":"<h2>Le cahier de recette<\/h2>\n<table>\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Critère d’acceptation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TOS et puissance de chaque relais<\/td>\n<td>TOS ≤ 1,5 ; puissance conforme au réglage<\/td>\n<\/tr>\n<tr>\n<td>Couverture<\/td>\n<td>Carte de couverture : zones de travail en « bon » ; zones faibles listées et acceptées<\/td>\n<\/tr>\n<tr>\n<td>Appels large zone et locaux<\/td>\n<td>Conformes au plan des groupes<\/td>\n<\/tr>\n<tr>\n<td>Itinérance<\/td>\n<td>Changement de site correct sur les trajets types<\/td>\n<\/tr>\n<tr>\n<td>Urgence, homme à terre<\/td>\n<td>Alarme reçue au dispatch avec position<\/td>\n<\/tr>\n<tr>\n<td>Coupure de lien et d’énergie<\/td>\n<td>Comportement attendu (site isolé en local, secours énergie)<\/td>\n<\/tr>\n<tr>\n<td>Dispatch<\/td>\n<td>Appels, carte, messages, enregistrement opérationnels<\/td>\n<\/tr>\n<tr>\n<td>Documentation remise<\/td>\n<td>Voir la liste ci-dessous<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Le dossier technique final<\/h2>\n<ol>\n<li>Schéma général du réseau (sites, relais, liens, adresses IP).<\/li>\n<li>Plan de fréquences et copie des autorisations AMRTP.<\/li>\n<li>Plan des groupes et des ID.<\/li>\n<li>Codeplugs de référence (radios et relais) avec leur version.<\/li>\n<li>Fiches de chaque site : équipements, numéros de série, mesures, photos.<\/li>\n<li>Carte de couverture.<\/li>\n<li>Procédures : exploitation, urgence, maintenance, sauvegarde.<\/li>\n<li>Contacts : fournisseurs, opérateurs de liens, support.<\/li>\n<\/ol>"},{"t":"Les idées en plus pour aller plus loin","h":"<ul>\n<li><strong>Planifier la migration<\/strong> analogique → numérique site par site, avec une date de fin du mode mixte (voir Tome 1).<\/li>\n<li><strong>Former les dispatcheurs<\/strong> au logiciel : alarmes, carte, enregistrement.<\/li>\n<li><strong>Faire un audit annuel<\/strong> du réseau : mesures, couverture, capacité, sécurité, documentation.<\/li>\n<li><strong>Garder une veille<\/strong> : nouveaux modèles, nouvelles versions de logiciel, évolutions des liaisons satellites.<\/li>\n<li><strong>Partager l’expérience<\/strong> : un retour d’expérience écrit après chaque incident majeur.<\/li>\n<\/ul>"}]},"expert-3":{"id":"expert-3","lvl":"expert","titre":"Rôles, organisation et formation","steps":[{"t":"Le rôle de l’ingénieur télécom","h":"<p>L’ingénieur télécom (ou responsable radio) <strong>conçoit<\/strong>, <strong>organise<\/strong> et <strong>garantit<\/strong> le réseau radio du site.<\/p>\n<table>\n<thead>\n<tr>\n<th>Domaine<\/th>\n<th>Missions<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Conception<\/strong><\/td>\n<td>Architecture du réseau, choix des systèmes (conventionnel, IP Site Connect, Capacity Plus), plan de fréquences, plan IP, études de couverture<\/td>\n<\/tr>\n<tr>\n<td><strong>Réglementation<\/strong><\/td>\n<td>Dossiers et renouvellements <strong>AMRTP<\/strong>, respect des puissances et fréquences autorisées<\/td>\n<\/tr>\n<tr>\n<td><strong>Budget et achats<\/strong><\/td>\n<td>Prévoir le renouvellement du parc, les pièces de rechange, les contrats de maintenance<\/td>\n<\/tr>\n<tr>\n<td><strong>Organisation<\/strong><\/td>\n<td>Planning des techniciens, astreinte 24/7, procédures, formation<\/td>\n<\/tr>\n<tr>\n<td><strong>Qualité<\/strong><\/td>\n<td>Indicateurs (disponibilité, délais de réparation), audits, retours d’expérience<\/td>\n<\/tr>\n<tr>\n<td><strong>Relations<\/strong><\/td>\n<td>Production, HSE, informatique, sous-traitants, fournisseurs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Le rôle du technicien télécom","h":"<p>Le technicien <strong>installe<\/strong>, <strong>entretient<\/strong> et <strong>dépanne<\/strong>. C’est lui qui fait vivre le réseau au quotidien.<\/p>\n<table>\n<thead>\n<tr>\n<th>Domaine<\/th>\n<th>Missions<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Installation<\/strong><\/td>\n<td>Radios sur engins, antennes, câbles, postes fixes, relais<\/td>\n<\/tr>\n<tr>\n<td><strong>Programmation<\/strong><\/td>\n<td>Codeplugs des radios et des relais, gestion des versions<\/td>\n<\/tr>\n<tr>\n<td><strong>Maintenance préventive<\/strong><\/td>\n<td>Visites des sites relais, mesures, nettoyage, tests d’énergie<\/td>\n<\/tr>\n<tr>\n<td><strong>Dépannage<\/strong><\/td>\n<td>Répondre vite, rétablir le service, réparer, faire le rapport<\/td>\n<\/tr>\n<tr>\n<td><strong>Gestion du parc<\/strong><\/td>\n<td>Inventaire, fiches de sortie, stock, contrôle des sous-traitants<\/td>\n<\/tr>\n<tr>\n<td><strong>Formation<\/strong><\/td>\n<td>Montrer aux utilisateurs le bon usage de la radio<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Ensemble<\/strong> — l’ingénieur fixe le cap et les règles ; le technicien les applique sur le terrain et remonte les problèmes. Les deux se réunissent <strong>chaque semaine<\/strong> pour faire le point : pannes, projets, stock, sécurité.<\/p>\n<\/div>"},{"t":"Organiser un service radio 24/7","h":"<table>\n<thead>\n<tr>\n<th>Élément<\/th>\n<th>Bonne pratique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Astreinte<\/strong><\/td>\n<td>Un technicien joignable à toute heure, avec un <strong>numéro unique<\/strong> affiché au dispatch<\/td>\n<\/tr>\n<tr>\n<td><strong>Priorités<\/strong><\/td>\n<td>Urgent (zone sans radio, dispatch, secours) : tout de suite ; important : dans la journée ; normal : planifié<\/td>\n<\/tr>\n<tr>\n<td><strong>Stock de secours<\/strong><\/td>\n<td>Radios de prêt chargées, relais de rechange programmé, câbles et connecteurs<\/td>\n<\/tr>\n<tr>\n<td><strong>Documentation<\/strong><\/td>\n<td>Dossier technique à jour, accessible à toute l’équipe<\/td>\n<\/tr>\n<tr>\n<td><strong>Passation<\/strong><\/td>\n<td>Cahier de passation entre techniciens à chaque relève<\/td>\n<\/tr>\n<tr>\n<td><strong>Formation continue<\/strong><\/td>\n<td>Nouvelles radios, nouveaux logiciels, sécurité<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Former les utilisateurs","h":"<p>Un réseau parfait ne sert à rien si les utilisateurs ne savent pas s’en servir. La méthode simple :<\/p>\n<ol>\n<li><strong>Expliquer<\/strong> en mots simples (et en <strong>langue locale<\/strong> si besoin) : à quoi sert la radio, les canaux, le bon geste.<\/li>\n<li><strong>Montrer<\/strong> sur une vraie radio : boutons, PTT, urgence, batterie.<\/li>\n<li><strong>Faire faire<\/strong> à chacun : un appel QUI – OÙ – QUOI – BESOIN, un changement de canal, un appel d’urgence simulé.<\/li>\n<li><strong>Vérifier<\/strong> avec un petit quiz ou une mise en situation.<\/li>\n<li><strong>Tracer<\/strong> : la feuille d’émargement et le <strong>registre de formation<\/strong>.<\/li>\n<li><strong>Rappeler<\/strong> : affiches dans les engins, rappels lors des réunions sécurité, recyclage chaque année.<\/li>\n<\/ol>\n<div class=\"exp\">\n<p><strong>Exemple<\/strong> — une session « nouveaux arrivants » de <strong>45 minutes<\/strong> : 15 min d’explication, 20 min de pratique, 10 min de quiz. La radio n’est remise qu’après la session et la signature de la <strong>fiche de sortie<\/strong>.<\/p>\n<\/div>"}]},"expert-4":{"id":"expert-4","lvl":"expert","titre":"Check-lists et modèles avancés","steps":[{"t":"Annexe B : check-list IP Site Connect","h":"<table>\n<thead>\n<tr>\n<th>☐<\/th>\n<th>Contrôle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>☐<\/td>\n<td>Plan IP écrit (réseaux, passerelles, adresses des relais)<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Adresse du maître fixe et joignable (IP fixe ou VPN)<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Port UDP redirigé / ouvert uniquement ce qui est nécessaire<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Même clé d’authentification sur tous les relais<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>ID de relais uniques<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Slot 1 large zone, slot 2 local (ou selon le plan) sur chaque relais<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Paramètres d’appel identiques sur tous les relais<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Bande passante et stabilité des liens mesurées<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Radios : canaux large zone par site, liste d’itinérance, seuil réglé<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Tests : large zone, local, itinérance, coupure de lien, urgence<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Sauvegardes des configurations et dossier remis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Annexe C : check-list Capacity Plus","h":"<table>\n<thead>\n<tr>\n<th>☐<\/th>\n<th>Contrôle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>☐<\/td>\n<td>Une paire de fréquences autorisée par relais<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Combineur / multicoupleur ou antennes séparées, TOS vérifié<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Relais sur le même réseau local ; maître et pairs définis<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Adresse et port du canal de repos identiques sur tous les relais<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Numéros de canal : slot 2 = slot 1 + 1, sans doublon<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Licences nécessaires vérifiées (relais et radios)<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Radios : liste des canaux voix dans l’ordre, groupes, color code<\/td>\n<\/tr>\n<tr>\n<td>☐<\/td>\n<td>Tests : appels simultanés sur plusieurs groupes, canal de repos qui se déplace, urgence<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Annexe D : modèle de plan IP","h":"<div class=\"form\">\n<p><strong>PLAN IP DU RÉSEAU RADIO<\/strong> — Réseau : ……………… Date : ……… Version : ……<\/p>\n<table>\n<thead>\n<tr>\n<th>Site<\/th>\n<th>Réseau / masque<\/th>\n<th>Passerelle<\/th>\n<th>Relais (rôle)<\/th>\n<th>Adresse IP<\/th>\n<th>Port UDP<\/th>\n<th>ID relais<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Clé d’authentification : conservée dans le document confidentiel n° ……  Lien(s) entre sites : ……………………<\/p>\n<\/div>"},{"t":"Annexe E : modèle de plan des groupes","h":"<div class=\"form\">\n<p><strong>PLAN DES GROUPES ET DES ID<\/strong> — Réseau : ……………… Version : ……<\/p>\n<table>\n<thead>\n<tr>\n<th>Groupe<\/th>\n<th>ID<\/th>\n<th>Large zone / local<\/th>\n<th>Slot<\/th>\n<th>Utilisateurs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>"}]}},"quiz":{"debutant":[{"q":"Une onde radio, c’est…","o":["Un fil invisible","Une vague invisible qui voyage dans l’air","Un courant électrique dans le sol","Un son très fort"],"a":1,"e":"Comme les vagues dans l’eau, l’antenne envoie des vagues invisibles : les ondes radio."},{"q":"Que mesure la fréquence ?","o":["La puissance de la radio","Le nombre de vagues par seconde","La longueur de l’antenne","Le volume du son"],"a":1,"e":"La fréquence se mesure en hertz (Hz) : c’est le nombre de vagues par seconde. 150 MHz = 150 millions de vagues par seconde."},{"q":"Quelle bande va de 136 à 174 MHz ?","o":["UHF","VHF","HF","FM radio"],"a":1,"e":"La VHF pro va de 136 à 174 MHz, l’UHF de 400 à 470 MHz."},{"q":"À ciel ouvert, en terrain dégagé, quelle bande porte généralement plus loin ?","o":["VHF","UHF","Les deux pareil","Aucune"],"a":0,"e":"La VHF (fréquence plus basse) porte plus loin en terrain ouvert ; l’UHF passe mieux dans les bâtiments."},{"q":"Quelle radio a sa place sur un site minier ?","o":["Un talkie de loisirs du marché","Une radio professionnelle programmée sur les fréquences autorisées","Un téléphone portable","Une radio FM"],"a":1,"e":"Seules les radios professionnelles programmées par le service radio sont autorisées sur le réseau."},{"q":"Qu’est-ce que le DMR ?","o":["Une marque de radio","Une norme radio numérique avec 2 slots par fréquence","Un type d’antenne","Un câble"],"a":1,"e":"Le DMR est une norme numérique de l’ETSI (2005) : 2 communications sur une seule fréquence."},{"q":"L’« effet falaise », c’est…","o":["Le son numérique qui coupe d’un coup en limite de portée","Une antenne qui tombe","Un écho dans le pit","Une batterie qui se vide"],"a":0,"e":"En numérique, le son reste clair puis coupe net en limite de portée."},{"q":"Quel équipement répète les appels pour couvrir tout le site ?","o":["Le portable","Le relais","Le chargeur","Le micro"],"a":1,"e":"Le relais, placé en hauteur, reçoit et réémet les appels."},{"q":"Quelle radio est installée dans un engin ?","o":["La radio portable","La radio mobile","Le relais","Le scanner"],"a":1,"e":"Le mobile est alimenté par l’engin et utilise une antenne sur le toit."},{"q":"Que permet le numérique, que l’analogique ne fait pas ?","o":["Parler","Afficher l’identité de l’appelant et envoyer la position GPS","Écouter","Changer de canal"],"a":1,"e":"Identité, messages, GPS, homme à terre, chiffrement : ce sont des fonctions numériques."},{"q":"DMR et NXDN peuvent-ils se parler en numérique ?","o":["Oui, toujours","Non, ce sont deux normes différentes","Seulement la nuit","Seulement en UHF"],"a":1,"e":"Deux normes numériques différentes ne se comprennent pas. Il faut la même norme, ou le mode analogique."},{"q":"30 dBm correspond à…","o":["1 W","10 W","30 W","100 W"],"a":0,"e":"0 dBm = 1 mW, 30 dBm = 1 W, 40 dBm = 10 W."},{"q":"Un TOS de 1,2, c’est…","o":["Très mauvais","Bon","Interdit","Une panne"],"a":1,"e":"Un TOS proche de 1 est bon. Au-dessus de 1,5 on cherche le problème."}],"utilisateur":[{"q":"Avant de parler, que faut-il faire ?","o":["Crier","Écouter si le canal est libre","Éteindre la radio","Changer de canal"],"a":1,"e":"On écoute d’abord pour ne pas couper quelqu’un, surtout une urgence."},{"q":"Après avoir appuyé sur le PTT, on attend…","o":["Une seconde avant de parler","10 secondes","Rien","Que le dispatch appelle"],"a":0,"e":"Le relais a besoin d’un court instant pour s’ouvrir ; sinon le d eurs de partager une antenne"],["Connecteur N","Connecteur coaxial robuste et étanche, standard des sites relais"],["COR / PTT","Signal « porteuse reçue » et commande d’émission d’un relais"],["CPS 2.0","Le logiciel de programmation MOTOTRBO"],["CTCSS / DCS","Code d’accès analogique ; il filtre, il ne chiffre pas"],["Câble rayonnant","Câble qui « fuit » le signal le long des galeries"],["dB, dBm","Unités de gain/perte et de puissance (30 dBm = 1 W)"],["DMR","Norme numérique européenne (ETSI), 2 slots par fréquence"],["Duplexeur","Filtre qui permet d’émettre et recevoir sur une seule antenne"],["Effet falaise","En numérique, le son reste clair puis coupe net en limite de portée"],["Fréquence","Nombre de vagues par seconde (Hz, MHz)"],["Homme à terre","Alarme automatique quand la radio reste couchée ou immobile"],["IP Site Connect","Relier jusqu’à 15 relais par réseau IP"],["IP67 / IP68","Indice de protection contre la poussière (6) et l’eau (7 : immersion temporaire, 8 : immersion prolongée selon le fabricant)"],["Itinérance","Changement automatique de relais entre sites"],["Maître / pair","Rôles des relais en IP Site Connect et Capacity Plus"],["Mode direct","Radio à radio, sans relais"],["Mode direct (talkaround)","Communication radio à radio sans passer par le relais"],["Mode mixte","Relais qui répète analogique et numérique"],["NAT / redirection de port","Traduction d’adresse par un routeur ; ouverture d’un port vers un équipement"],["NMO","Embase d’antenne percée dans le toit d’un véhicule"],["NXDN","Norme numérique utilisée par Icom (IDAS) et Kenwood"],["Parafoudre","Protection qui évacue la surtension de la foudre vers la terre"],["PMR446","Radios de loisirs sans licence (en Europe), interdites sur un réseau professionnel"],["Poste de contrôle","Mobile fixe utilisé par un dispatch pour accéder à un canal"],["PTT","Le bouton pour parler (*Push To Talk*)"],["RDAC","Logiciel Motorola de diagnostic et de pilotage des relais"],["Relais","Équipement qui répète les a vec le dispatch"]},{"nom":"Duplexeur","icon":"layer","role":"Filtre qui permet au relais d’émettre et de recevoir en même temps sur une seule antenne.","refs":"4 à 6 cavités, VHF ou UHF, accordé sur vos deux fréquences (émission et réception)","pose":["Accordé en usine ou à l’atelier sur les fréquences exactes","Monté dans l’armoire, à l’abri des chocs","Port TX vers l’émetteur du relais, port RX vers le récepteur, port ANT vers l’antenne","Contrôle : TOS et sensibilité du relais après pose"]},{"nom":"Antenne de relais (omnidirectionnelle)","icon":"wifi","role":"Rayonne le signal dans toutes les directions autour du pylône.","refs":"Fibre de verre, gain 3 à 6 dBi, connecteur N, VHF 136–174 MHz ou UHF 400–470 MHz","pose":["Au sommet du pylône, au-dessus des obstacles","Bien verticale, écartée du pylône (bras de déport)","Sous la pointe du paratonnerre","Connecteur étanché (ruban vulcanisant + PVC)"]},{"nom":"Antenne directive (Yagi)","icon":"signal","role":"Concentre le signal dans une direction : liaison entre sites, antenne donneuse de booster, zone éloignée.","refs":"3 à 9 éléments, gain 7 à 13 dBi, connecteur N","pose":["Pointée précisément vers la cible (boussole, GPS)","Polarisation identique aux deux bouts","Fixation solide (le vent la fait tourner)"]},{"nom":"Câble coaxial (descente)","icon":"cable","role":"Transporte le signal entre le relais et l’antenne.","refs":"LMR-400 jusqu’à 30–40 m ; 1/2 pouce ou 7/8 pouce pour les pylônes hauts ; 50 Ω","pose":["Fixé tous les 1 à 1,5 m, sans pli serré","Mis à la terre en haut, en bas et à l’entrée de l’abri","Boucle d’égouttement avant l’abri","Étiqueté aux deux bouts"]},{"nom":"Connecteurs N","icon":"plug","role":"Relient câbles, antennes, parafoudre et duplexeur.","refs":"N mâle / N femelle adaptés au câble utilisé (à sertir ou à visser)","pose":["Montés aux cotes du fabricant","Contrôlés à l’ohmmètre","Étanchés à l’extérieur"]},{"nom":"Parafoudre coaxial","icon":"bolt","role":"Évacue vers la terre la surtension due ."]],"pannes":[{"cat":"Radio portable","sym":"La radio ne s’allume pas","causes":["Batterie vide ou usée","Contacts de batterie sales ou tordus","Batterie mal enclenchée","Panne interne"],"verif":["Essayer une batterie chargée connue bonne","Nettoyer les contacts (gomme, alcool isopropylique)","Vérifier le voyant du chargeur"],"actions":["Remplacer la batterie","Si toujours rien : radio de prêt et radio à l’atelier"]},{"cat":"Radio portable","sym":"La batterie ne tient pas le poste","causes":["Batterie en fin de vie","Batterie copie","Chargeur inadapté ou défectueux","Radio laissée au soleil"],"verif":["Âge et nombre de cycles (batteries IMPRES : lecture sur le chargeur)","Tester sur un autre chargeur"],"actions":["Batterie d’origine neuve","Remplacer le chargeur","Former l’utilisateur (charge complète, chaleur)"]},{"cat":"Radio portable","sym":"J’émets mais personne ne m’entend","causes":["Mauvais canal","Mauvais color code / CTCSS / groupe","Antenne cassée ou dévissée","Relais en panne","Hors couverture"],"verif":["Canal affiché = canal de l’équipe ?","Test avec une autre radio à côté","Test en mode direct","Le relais répond-il aux autres ?"],"actions":["Remettre le bon canal","Changer l’antenne","Reprogrammer la radio","Si tout le monde est touché : voir « Toute une zone sans radio »"]},{"cat":"Radio portable","sym":"J’entends mais je ne peux pas parler","causes":["Bouton PTT défectueux","Canal occupé (critère d’accès)","Minuterie d’émission (TOT) atteinte","Radio bloquée à distance"],"verif":["Le voyant passe-t-il au rouge ?","Essai sur un autre canal","Lecture du codeplug"],"actions":["Atelier : PTT ou carte","Corriger la programmation"]},{"cat":"Radio portable","sym":"Son faible, haché ou grésillant","causes":["Limite de portée","Antenne abîmée","Haut-parleur ou micro encrassé ou mouillé","Accessoire (micro déporté, oreillette) défectueux"],"verif":["Se déplacer vers une zone dégagée","Retirer l’accessoire et retester","Comparer avec une autre radio"],"actions r l’énergie","Basculer sur le relais de secours ou un répéteur portable","Réparer puis faire le rapport"]},{"cat":"Relais et site","sym":"TOS élevé sur la ligne du relais","causes":["Eau dans un connecteur","Câble écrasé ou percé","Antenne endommagée (foudre, vent)","Parafoudre détruit"],"verif":["Mesure du TOS tronçon par tronçon","Analyseur d’antenne : distance du défaut"],"actions":["Refaire le connecteur et l’étanchéité","Changer le tronçon, l’antenne ou le parafoudre","Mesurer et noter après réparation"]},{"cat":"Relais et site","sym":"Le relais s’ouvre tout seul (porteuse, souffle)","causes":["Radio bloquée en émission (PTT coincé)","Brouillage extérieur","Intermodulation sur le site","Duplexeur désaccordé"],"verif":["Identifier l’ID de la radio (numérique)","Analyseur de spectre","Couper l’émetteur du relais et écouter"],"actions":["Retrouver et bloquer la radio fautive","Chercher la source du brouillage","Réaccorder ou changer le duplexeur","Signaler un brouillage persistant à l’AMRTP"]},{"cat":"Relais et site","sym":"Les sites ne se parlent plus (IP Site Connect)","causes":["Lien Internet / VPN coupé","Adresse ou port du maître changé","Clé d’authentification différente","Pare-feu modifié"],"verif":["Ping entre routeurs","Logiciel de diagnostic (RDAC) : état des pairs","Comparer les réglages réseau"],"actions":["Rétablir le lien","Corriger adresse, port ou clé","Rouvrir le port UDP nécessaire"]},{"cat":"Relais et site","sym":"Batteries de site toujours faibles","causes":["Panneaux sales ou ombragés","Batteries en fin de vie","Régulateur défectueux","Consommation ajoutée sans recalcul"],"verif":["Tension le matin avant le soleil","Courant de charge à midi","Propreté des panneaux"],"actions":["Nettoyer les panneaux","Remplacer batteries ou régulateur","Refaire le bilan énergétique"]},{"cat":"Numérique","sym":"Son coupé net par moments","causes":["Limite de couverture (effet falaise)","Itinérance mal réglée entre sites","Interférence sur un slot"],"verif":["Test de couverture sur le trajet","Seuil d’itinérance et liste d’itinérance"],"actions":["Renforcer la couverture (antenne, relais, booster)","Ajuster l’itinérance"]},{"cat":"Numérique","sym":"Une radio n’entend pas un groupe","causes":["Groupe absent de la liste de réception","Mauvais slot","Mauvais color code"],"verif":["Comparer le codeplug avec une radio qui fonctionne"],"actions":["Corriger la liste RX, le slot ou le color code","Reprogrammer et mettre à jour le registre des versions"]},{"cat":"Souterrain","sym":"Plus de radio dans une galerie","causes":["Câble rayonnant coupé ou arraché","Amplificateur en panne","Alimentation de ligne en défaut","Nouvelle galerie pas encore équipée"],"verif":["Appels d’essai de la surface vers le fond, galerie par galerie","Alarmes des alimentations","Mesure des niveaux aux amplificateurs"],"actions":["Réparer ou remplacer le tronçon","Changer l’amplificateur","Prolonger le câble jusqu’au front","Prévenir les équipes et utiliser les postes fixes"]},{"cat":"Souterrain","sym":"Le booster siffle ou brouille","causes":["Isolement insuffisant entre antenne donneuse et antennes de service","Gain trop élevé","Antenne déplacée"],"verif":["Baisser le gain : le sifflement disparaît-il ?","Contrôler la position des antennes"],"actions":["Éloigner ou réorienter les antennes","Régler le gain au juste nécessaire"]}],"methode":[["Qui est touché ?","Une radio, un groupe, ou tout un site ?"],["Où ?","Partout, ou seulement dans une zone ?"],["Depuis quand ?","Après un orage, une modification, une reprogrammation ?"],["Quoi exactement ?","Pas d’émission, pas de réception, bruit, coupures ?"],["Qu’est-ce qui a changé ?","Antenne, câble, programmation, énergie, nouvelle verse, nouveau bâtiment…"]],"conseils":[["Organisation","calendar",[["Une radio = une ligne","Chaque radio a sa ligne dans l’inventaire, avec son numéro de série et un numéro interne collé sur la radio."],["Comptage physique régulier","Chaque mois ou chaque trimestre : ce qui est compté doit être égal à ce qui est écrit."],["Aucune radio sans fiche","Toute sortie de radio passe par une fiche de sortie signée. Toute perte est signalée le jour même."],["Un plan de fréquences unique","Un seul document fait foi pour les canaux, codes et ID. Il est mis à jour à chaque changement, avec une version."],["Des radios de prêt toujours prêtes","Gardez quelques radios chargées et programmées pour remplacer tout de suite une radio en panne."]]],["Technique","tools",[["La hauteur fait la portée","Une antenne 10 m plus haute vaut souvent mieux qu’un émetteur plus puissant."],["Le bon câble","Sur une descente longue, un câble faible perte (LMR-400, 1/2 pouce) fait gagner plus que n’importe quel réglage."],["L’eau est l’ennemie","Étanchéité de chaque connecteur extérieur, boucle d’égouttement, contrôle après la saison des pluies."],["Terre et parafoudre","Une seule terre commune, mesurée et notée. Parafoudre vérifié après chaque gros orage."],["Sauvegarder les codeplugs","Avant toute modification, sauvegarde du fichier d’origine. Copie hors site de tous les fichiers de référence."],["Passer au numérique par étapes","Mode mixte pendant la migration, avec une date de fin fixée. Ne restez pas en mixte pour toujours."]]],["Sécurité","shield",[["Discipline radio","Messages courts, QUI – OÙ – QUOI – BESOIN, priorité absolue aux urgences."],["Exercices d’urgence","Testez régulièrement l’appel d’urgence, l’homme à terre et les postes des refuges."],["Radios des sous-traitants","Contrôle à l’entrée sur le site : conforme, non conforme, à vérifier. Pas de talkie de loisirs sur le réseau."],["Pas d’informations sensibles en clair","Convois, explosifs, codes, données personnelles : chiffrement ou téléphone."],["Le technicien d’abord","Pas de pylône sous l’orage, travail en hauteur à deux, consignation électrique."]]],["Qualité de service","chart",[["Mesurer pour progresser","Disponibilité du réseau, délai moyen de réparation, pannes répétées : un bilan chaque mois."],["Un rapport pour chaque panne","Sans rapport, on ne voit pas les pannes qui reviennent et on ne peut pas prouver sa réactivité."],["Écouter les utilisateurs","Les conducteurs connaissent les zones faibles. Notez leurs remarques et allez mesurer."],["Suivre l’avancement de la mine","Le pit se creuse, les verses montent, les galeries avancent : la couverture doit suivre."],["Former, encore et toujours","Chaque nouvel arrivant reçoit une formation radio avant de recevoir sa radio."]]],["Réglementation","gavel",[["Fréquences autorisées","Utiliser seulement les fréquences et puissances autorisées par l’AMRTP, et payer les redevances à temps."],["Déclarer les émetteurs","Nouveau relais, booster, liaison entre sites : chaque émetteur se déclare."],["Garder les preuves","Copies des autorisations dans le dossier technique, et dates de renouvellement dans l’agenda."]]]],"fichiers":[{"nom":"Inventaire global du parc","icon":"clipboard","but":"Savoir à tout moment où est chaque radio, à qui, et dans quel état.","cols":["N° interne","N° de série","Marque / modèle","Type","Bande","ID radio","Utilisateur / engin","Société","Site","État","Dernier contrôle"],"rows":[["MRS-0001","871TXY0123","Motorola R7","Portable","VHF","1101","K. Diarra, chef de poste","Mine","Pit A","Bon","02/10/2026"],["MRS-0145","103TTK4567","Motorola DM4600e","Mobile","VHF","2112","Camion CAT 777 n° 12","Mine","Pit A","À surveiller","28/09/2026"],["MRS-0300","446CMX0042","Motorola SLR 5500","Relais","VHF","—","Site relais colline Nord","Mine","Nord","Bon","01/10/2026"]]},{"nom":"Fiche de sortie / décharge","icon":"filesig","but":"Prouver qui a reçu quelle radio, avec quels accessoires.","cols":["N° fiche","Date","Radio (N° interne)","Accessoires","Bénéficiaire","Société","Motif","Retour prévu","Signatures"],"rows":[["S-2026-118","05/10/2026","MRS-0001","Batterie, chargeur, clip","K. Diarra","Mine","Dotation","—","Oui / Oui"],["S-2026-119","06/10/2026","MRS-0207","Batterie","A. Traoré","Sous-traitant X","Prêt (panne  répète sur f2, en même temps, grâce au duplexeur.","pit_coverage":"Coupe d’un pit : le relais en point haut voit les gradins supérieurs, mais le fond du pit devient une zone d’ombre à mesure qu’il se creuse.","relay_site":"La chaîne complète d’un site relais, de l’antenne à la batterie.","antenna_mount":"Bonne et mauvaise position de l’antenne sur le pylône.","grounding":"Le chemin de la foudre : tout est relié à une même terre.","energy":"Trois chaînes d’énergie possibles pour un relais.","coverage_map":"Une carte de couverture : chaque point de mesure est noté de 1 à 5.","mobile_rear":"L’arrière d’un mobile : connecteur d’antenne, câble d’alimentation, connecteur d’accessoires.","mobile_wiring":"Schéma de câblage d’un mobile sur un engin en 12 V, et avec convertisseur sur un engin en 24 V.","coax":"Le câble coaxial : âme, isolant, blindage, gaine.","prog_setup":"Le poste de programmation : PC avec CPS 2.0, câble, radio.","codeplug":"Ce que contient une programmation (« codeplug ») MOTOTRBO.","ipsc":"Un relais maître à adresse fixe, des pairs qui s’y relient par le réseau IP.","underground_vs":"Sous terre, le signal du relais de surface ne descend pas : il faut amener le réseau dans chaque galerie.","leaky_feeder":"Le système à câble rayonnant : tête de réseau en surface, câble dans les galeries, amplificateurs de ligne.","booster":"L’antenne donneuse capte le relais de surface ; le booster amplifie ; le câble rayonnant ou des antennes diffusent dans la galerie.","files":"Les fichiers de suivi et la façon dont ils se relient.","toolbox":"La caisse à outils du technicien radio.","case_study":"La Mine Kankou : un pit, une usine à 25 km et un camp à 60 km.","codeplug_full":"Les sections d’un codeplug MOTOTRBO et leurs liens : un canal utilise des contacts, une liste RX, une liste de balayage ou d’itinérance et un système d’urgence.","ipsc3":"Les trois sites de la Mine Kankou reliés par IP Site Connect.","vpn":"Avec un VPN, les trois sites forment un seul réseau privé ":"Multi-sites","dispatch_links":"Dispatch","underground_vs":"Souterrain","leaky_feeder":"Souterrain","booster":"Souterrain","ug_ipsc":"Souterrain","files":"Gestion","toolbox":"Outils"},"iconMap":{"tower":"radio-tower","layer":"layers","wifi":"wifi","signal":"signal","cable":"cable","plug":"plug-zap","bolt":"zap","arrows":"arrow-down-to-line","solar":"sun","building":"warehouse","truck":"truck","headset":"headset","server":"server","arrowup":"arrow-up-from-line","battery":"battery-charging","sitemap":"network","stop":"square","network":"waypoints","phone":"phone","walkie":"radio","clipboard":"clipboard-list","filesig":"file-pen-line","signin":"log-in","wrench":"wrench","warn":"triangle-alert","usercheck":"user-check","book":"book-open","sliders":"sliders-horizontal","gavel":"gavel","chart":"chart-column","calendar":"calendar","tools":"hammer","shield":"shield-check","headphones":"headphones","mountain":"mountain","satellite":"satellite-dish"}}</script>

<script>(function () {

}

// ---- recherche et assistant
let lastQ = '', ansState = null, askCtl = null;
const SUGG = ['Comment installer un relais SLR 5500 ?', 'Quel câble pour une descente de 40 m ?', 'Comment placer un booster en souterrain ?', 'Ma radio émet mais personne ne m’entend', 'Différence entre IP Site Connect et Capacity Plus', 'Comment installer une radio sur un camion 24 V ?'];
function mdLite(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split(/\n/); let out = '', ul = false;
  for (let l of lines) { l = l.trim(); const li = /^([-*•]|\d+[.)])\s+/.test(l);
    if (li) { if (!ul) { out += '<ul>'; ul = true; } out += '<li>' + l.replace(/^([-*•]|\d+[.)])\s+/, '') + '</li>'; }
    else { if (ul) { out += '</ul>'; ul = false; } if (l) out += '<p>' + l.replace(/^#+\s*/, '') + '</p>'; } }
  return out + (ul ? '</ul>' : '');
}
V.chercher = () => {
  setAccent('#F2B01E');
  const res = lastQ ? search(lastQ) : [];
  const canAsk = !!CAP.sample;
  let ans = '';
  if (ansState) ans = `<div class="ans" aria-live="polite"><div class="who"><img data-img="logo" alt="">Assistant MRS</div><div id="anstext">${ansState.html}</div>${ansState.busy ? `<div class="btns" style="margin-top:8px"><button class="btn" data-act="stopask">${ic('square')}Arrêter</button></div>` : ''}</div>`;
  return `<div class="eyebrow">Questions</div><h1 class="ptitle">Posez votre question</h1>
  <p class="lead">Écrivez votre question avec vos mots. L’application cherche dans toutes les leçons, les pannes, les conseils, le dictionnaire et la boutique${canAsk ? ', et l’assistant MRS vous répond' : ''}.</p>
  <form id="askf" class="ask"><textarea id="q" placeholder="Ex. : Comment éviter l’eau dans les connecteurs ?" aria-label="Votre question">${esc(lastQ)}</textarea><button class="btn pri" type="submit">${ic(canAsk ? 'send' : 'search')}${canAsk ? 'Demander' : 'Chercher'}</button></form>
  <div class="sugg">${SUGG.map(s => `<button data-act="sugg">${esc(s)}</button>`).join('')}</div>
  ${ans}
  ${lastQ ? `<section class="sec"><h2>${ic('book-open')}Dans l’application (${res.length})</h2><div class="stack">${res.map(({ it, toks }) => `<a class="res" href="#${it.route}"><em>${esc(it.kind)}</em><b>${esc(it.title)}</b><span>${snippet(it.text, toks)}</span></a>`).join('') || '<p class="muted">Rien trouvé avec ces mots. Essayez d’autres mots, ou écrivez à MRS.</p>'}</div></section>` : ''}
  ${!canAsk && lastQ ? `<div class="sec card"><b>Vous ne trouvez pas la réponse ?</b><p class="muted" style="margin:4px 0 10px">Envoyez votre question à Mali Radio Systems.</p><a class="btn wa2" href="${waLink('Bonjour Mali Radio Systems, j’ai une question radio : ' + lastQ)}" target="_blank" rel="noopener">${ic('message-circle')}Envoyer sur WhatsApp</a></div>` : ''}`;
};
async function ask(q) {
  lastQ = q.trim(); if (!lastQ) return;
  if (!CAP.sample) { ansState = null; render(); return; }
  const res = search(lastQ, 6);
  const ctx = res.map(({ it }, i) => `[${i + 1}] ${it.kind} — ${it.title}\n${it.text.slice(0, 1600)}`).join('\n\n');
  const prompt = `Tu es l’assistant de l’application « MRS Radio Formation » de Mali Radio Systems (Mali), conçue par Zoumana Boris SANOGO. Elle forme les utilisateurs et techniciens à la radiocommunication des sites miniers (ciel ouvert et souterrain).
Réponds en français simple, clair et concret, pour quelqu’un de terrain. Appuie-toi d’abord sur les extraits de l’application ci-dessous. Si les extraits ne suffisent pas, complète avec tes connaissances générales en radiocommunication professionnelle (Motorola MOTOTRBO, Icom, DMR, relais, antennes, câbles, souterrain) en restant prudent, sans inventer de références ni de prix.
Rappelle les règles de sécurité quand c’est utile (travail en hauteur, foudre, zones de tir, ATEX) et que les fréquences doivent être autorisées par l’AMRTP au Mali.
Format : 3 à 10 phrases courtes ou une liste avec des tirets "- ". Mets en **gras** les mots importants. Pas de titres. Si la question concerne l’achat de matériel ou une intervention, termine en proposant de contacter Mali Radio Systems sur WhatsApp au ${PHONES[0]}.

EXTRAITS DE L’APPLICATION :
${ctx || '(aucun extrait trouvé)'}

QUESTION : ${lastQ}`;
  if (askCtl) askCtl.abort();
  askCtl = new AbortController();
  ansState = { html: '<p class="muted">Je réfléchis…</p>', busy: true }; render();
  try {
    const r = await CAP.sample(prompt, { signal: askCtl.signal, onText: ({ text }) => { ansState.html = mdLite(text); const el = $('#anstext'); if (el) el.innerHTML = ansState.html; } });
    ansState = { html: mdLite(r.text), busy: false };
  } catch (e) {
    const c = e && e.code;
    const msg = c === 'not_granted' ? 'L’assistant n’a pas été autorisé. Les réponses trouvées dans l’application sont ci-dessous.' : c === 'rate_limited' ? 'Trop de questions d’un coup. Patientez un instant puis réessayez.' : c === 'aborted' ? 'Réponse arrêtée.' : 'L’assistant ne répond pas pour le moment. Les réponses trouvées dans l’application sont ci-dessous.';
    ansState = { html: (e && e.text ? mdLite(e.text) : '') + `<p class="muted">${msg}</p>`, busy: false };
    if (c === 'not_granted') CAP.sample = null;
  }
  askCtl = null; render();
}

// ------------------------------------------------------------------ routeur
const TABOF = { accueil: 'accueil', formation: 'formation', niveau: 'formation', m: 'formation', quiz: 'quiz', boutique: 'boutique', chercher: 'chercher' };
let lastRoute = '';
function render() {
  const h = (location.hash || '#accueil').slice(1);
  const [r, a, b] = h.split('.');
  let html;
  try {
    if (r === 'm') html = V.m(a, b);
    else if (r === 'pannes') html = V.pannes(a);
    else if (V[r]) html = V[r](a, b);
    else html = V.accueil();
  } catch (e) { console.error(e); html = V.accueil(); }
  const view = $('#view'); view.innerHTML = html + credit(); hydrate(view);
  $$('.tabs a').forEach(t => t.classList.toggle('on', t.dataset.tab === (TABOF[r] || (r ? '' : 'accueil'))));
  if (h !== lastRoute) { if (!(r === 'pannes' && a)) window.scrollTo(0, 0); lastRoute = h; }
  if (r === 'pannes' && a) { const el = document.getElementById('panne-' + a); if (el) el.scrollIntoView({ block: 'center' }); }
  const tt = { accueil: 'MRS Radio Formation', formation: 'Formation', quiz: 'Quiz', boutique: 'Boutique', chercher: 'Questions', schemas: 'Schémas', cielouvert: 'Ciel ouvert', souterrain: 'Souterrain', pannes: 'Pannes', conseils: 'Conseils', gestion: 'Gestion de site', dico: 'Dictionnaire', apropos: 'Le concepteur' };
  document.title = r === 'm' && MOD[a] ? MOD[a].titre + ' · MRS Radio' : (tt[r] ? tt[r] + ' · MRS Radio' : 'MRS Radio Formation');
}
window.addEventListener('hashchange', render);

// ------------------------------------------------------------------ événements
document.addEventListener('click', async e => {
  const d = e.target.closest('[data-done]'); if (d) { const [m, n] = d.dataset.done.split(':'); markDone(m, n); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'qpick') { const q = QS.list[QS.i]; QS.pick = +el.dataset.i; if (QS.pick === q.a) QS.score++; render(); }
  else if (act === 'qnext') { QS.i++; QS.pick = null; render(); }
  else if (act === 'qrestart') { QS = null; render(); }
  else if (act === 'figf') { figFilter = el.dataset.g; render(); }
  else if (act === 'pcat') { panneCat = el.dataset.c; render(); }
  else if (act === 'sugg') { $('#q').value = el.textContent; ask(el.textContent); }
  else if (act === 'stopask') { if (askCtl) askCtl.abort(); }
  else if (act === 'copy') copyText(el.dataset.t);
  else if (act === 'install' && INSTALL) { INSTALL.prompt(); try { await INSTALL.userChoice; } catch (_) { } INSTALL = null; render(); }
  else if (act === 'copytsv') { const f = DATA.fichiers[+el.dataset.i]; copyText([f.cols, ...f.rows].map(r => r.join('\t')).join('\n'), 'Copié : collez dans Excel'); }
  else if (act === 'delp') {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.innerHTML = ic('trash-2') + 'Confirmer le retrait'; return; }
    try { await CAP.db.doc('produits/' + el.dataset.id).delete(); toast('Produit retiré'); } catch (err) { toast('Impossible de retirer ce produit'); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pq') { panneQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#pq'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (_) { } }
  if (e.target.id === 'dq') { dicoQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#dq'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (_) { } }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'askf') ask($('#q').value);
  if (e.target.id === 'addp') {
    const msg = $('#ap-msg'); const nom = $('#ap-nom').value.trim(); if (!nom) return;
    const doc = { cat: $('#ap-cat').value, nom, techno: $('#ap-techno').value.trim(), prix: $('#ap-prix').value.trim(), desc: $('#ap-desc').value.trim(), createdAt: Date.now() };
    msg.textContent = 'Enregistrement…';
    try {
      const f = $('#ap-photo') && $('#ap-photo').files[0];
      if (f && CAP.assets) { const up = await CAP.assets.upload(f); doc.photo = up.url; doc.photoId = up.id; }
      await CAP.db.collection('produits').add(doc);
      toast('Produit ajouté'); shopCat = doc.cat; location.hash = '#boutique.' + doc.cat;
    } catch (err) { msg.textContent = 'Échec de l’enregistrement : ' + ((err && err.message) || 'réessayez'); }
  }
});
document.addEventListener('keydown', e => { if (e.target.id === 'q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(e.target.value); } });

hydrate(document);
render();
initCaps();
})();
