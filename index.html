<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1A22"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>MRS Radio Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>/* Layout : coque d'application mobile — barre haute (logo + WhatsApp), vue centrale de 760px max, barre d'onglets en bas.
   Direction : signalétique de site minier — panneaux jaune sécurité sur ardoise, titres condensés en capitales, références en mono. */
:root {
  --bg: #0F1A22; --surface: #16242F; --raised: #1E3140; --line: #2A4152;
  --ink: #EEF2F4; --muted: #9DB0BD; --gold: #F2B01E; --gold-ink: #F2B01E; --on-gold: #14202A;
  --ok: #3FBF7F; --bad: #E5483B; --warn: #E8892B; --info: #4FB3E8;
  --plate: #FFFFFF; --shadow: 0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.25);
  --f-disp: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px; --tabh: 64px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #EEF1F3; --surface: #FFFFFF; --raised: #F5F7F8; --line: #D5DDE2;
  --ink: #0E1E2D; --muted: #4F606D; --gold: #F2B01E; --gold-ink: #9A6A00; --on-gold: #14202A;
  --ok: #1F8F57; --bad: #C73A2E; --warn: #B8621A; --info: #1F78B4; --plate: #FFFFFF;
  --shadow: 0 1px 2px rgba(14,30,45,.06), 0 6px 18px rgba(14,30,45,.08); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #EEF1F3; --surface: #FFFFFF; --raised: #F5F7F8; --line: #D5DDE2;
  --ink: #0E1E2D; --muted: #4F606D; --gold: #F2B01E; --gold-ink: #9A6A00; --on-gold: #14202A;
  --ok: #1F8F57; --bad: #C73A2E; --warn: #B8621A; --info: #1F78B4; --plate: #FFFFFF;
  --shadow: 0 1px 2px rgba(14,30,45,.06), 0 6px 18px rgba(14,30,45,.08); color-scheme: light; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.i { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.22em; }
h1, h2, h3, .disp { font-family: var(--f-disp); text-wrap: balance; line-height: 1.08; letter-spacing: .01em; }

/* ---- barre haute */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.badge { width: 46px; height: 46px; border-radius: 12px; background: #fff; display: grid; place-items: center; flex: none;
  box-shadow: 0 0 0 3px var(--accent, var(--gold)); transition: box-shadow .3s; }
.badge img { width: 40px; height: 40px; object-fit: contain; }
.bt { display: flex; flex-direction: column; min-width: 0; }
.bt b { font-family: var(--f-disp); font-size: 22px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.bt small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa { display: inline-flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 999px; background: #1FA855; color: #fff; text-decoration: none;
  font-weight: 700; font-size: 14px; white-space: nowrap; }
.wa:hover { background: #18914A; }

/* ---- vue */
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); outline: none; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.crumb a { text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.crumb a:hover { color: var(--ink); }
.eyebrow { font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .12em; font-size: 14px; font-weight: 700; color: var(--gold-ink); }
.ptitle { font-size: clamp(32px, 7vw, 44px); margin: 4px 0 8px; text-transform: uppercase; }
.lead { color: var(--muted); font-size: 17px; margin: 0 0 18px; max-width: 62ch; }
.sec { margin-top: 28px; }
.sec > h2 { font-size: 24px; text-transform: uppercase; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }

/* ---- accueil */
.hero { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; padding: 16px; border-radius: 20px;
  background: linear-gradient(135deg, var(--surface), var(--raised)); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -40px -40px auto; width: 180px; height: 180px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--gold) 35%, transparent); box-shadow: 0 0 0 22px color-mix(in srgb, var(--gold) 8%, transparent), 0 0 0 46px color-mix(in srgb, var(--gold) 5%, transparent); pointer-events: none; }
.portrait { width: 132px; aspect-ratio: 896/1152; max-width: 100%; border-radius: 16px; overflow: hidden; border: 3px solid var(--gold); background: #ddd; }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero h1 { font-size: clamp(30px, 7.4vw, 46px); margin: 0; text-transform: uppercase; }
.hero h1 span { color: var(--gold-ink); }
.hero p { margin: 6px 0 0; color: var(--muted); }
.by { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; }
.by b { color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line);
  font-size: 14px; font-weight: 600; white-space: nowrap; text-decoration: none; cursor: pointer; }
.chip[aria-pressed="true"], .chip.on { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-family: var(--f-disp); font-size: 28px; line-height: 1; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 8px; padding: 14px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
  text-decoration: none; min-height: 112px; position: relative; transition: transform .15s, border-color .15s; }
.tile:hover { transform: translateY(-2px); border-color: var(--tc, var(--gold)); }
.tile .ti { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--tc, var(--gold)); color: #14202A; }
.tile .ti .i { width: 22px; height: 22px; }
.tile b { font-family: var(--f-disp); font-size: 19px; text-transform: uppercase; line-height: 1.05; }
.tile small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.resume { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--gold); color: var(--on-gold); text-decoration: none; margin-top: 14px; }
.resume b { font-family: var(--f-disp); font-size: 20px; text-transform: uppercase; display: block; }
.resume span { font-size: 14px; }

/* ---- cartes génériques */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.row { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.lvl { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px; border-radius: var(--r); background: var(--surface);
  border: 1px solid var(--line); text-decoration: none; border-left: 6px solid var(--lc); }
.lvl .ln { width: 56px; height: 56px; border-radius: 14px; background: var(--lc); color: #14202A; display: grid; place-items: center; font-family: var(--f-disp); font-size: 30px; font-weight: 800; }
.lvl h3 { margin: 0; font-size: 24px; text-transform: uppercase; }
.lvl p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--lc, var(--gold)); border-radius: 3px; }
.pct { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
.mod .mn { font-family: var(--f-disp); font-size: 22px; font-weight: 800; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--raised); color: var(--lc); }
.mod.done .mn { background: var(--lc); color: #14202A; }
.mod b { display: block; font-size: 16.5px; }
.mod small { color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--raised); font-weight: 700; text-decoration: none; cursor: pointer; min-height: 46px; }
.btn.pri { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn.wa2 { background: #1FA855; border-color: #1FA855; color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---- étape de formation */
.stepnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 67px); z-index: 5; background: var(--bg); padding: 8px 0 10px; margin-bottom: 6px; }
.dots { display: flex; gap: 4px; }
.dots a { flex: 1; height: 6px; border-radius: 3px; background: var(--raised); }
.dots a.on { background: var(--lc); }
.dots a.cur { background: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 40%, transparent); }
.stepmeta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; gap: 10px; font-size: 14px; color: var(--muted); }
.stepmeta b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.lesson h1 { font-size: clamp(28px, 6.4vw, 38px); text-transform: uppercase; margin: 6px 0 14px; }
.lesson h2 { font-size: 23px; margin: 26px 0 8px; text-transform: uppercase; color: var(--gold-ink); }
.lesson h3 { font-size: 19px; margin: 18px 0 6px; }
.lesson p, .lesson li { max-width: 68ch; }
.lesson ul, .lesson ol { padding-left: 1.3em; }
.lesson li { margin: 4px 0; }
.lesson li::marker { color: var(--gold-ink); font-weight: 700; }
.lesson strong { color: var(--ink); font-weight: 700; }
.tw { overflow-x: auto; margin: 12px 0; border-radius: 12px; border: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 460px; background: var(--surface); }
th, td { text-align: left; vertical-align: top; padding: 9px 11px; border-bottom: 1px solid var(--line); }
th { background: var(--raised); font-family: var(--f-disp); font-size: 15px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.def, .tip, .warn, .exp, .form, .sign { border-radius: 12px; padding: 12px 14px; margin: 14px 0; border: 1px solid var(--line); background: var(--surface); position: relative; }
.def { border-left: 5px solid var(--info); } .tip { border-left: 5px solid var(--ok); } .warn { border-left: 5px solid var(--bad); } .exp { border-left: 5px solid var(--gold); }
.def p, .tip p, .warn p, .exp p { margin: 4px 0; }
.form { border-style: dashed; }
.sign { font-family: var(--f-disp); font-size: 20px; text-align: right; border: 0; background: none; }
.fig { margin: 16px 0; }
.plate { background: var(--plate); border-radius: 12px; padding: 8px; border: 1px solid var(--line); overflow-x: auto; }
.plate svg { display: block; width: 100%; min-width: 520px; height: auto; }
.fig figcaption, .photo figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; font-style: italic; }
.photo { margin: 16px 0; text-align: center; } .photo img { max-height: 340px; width: auto; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
.pager .btn { width: 100%; }

/* ---- accordéons */
details.acc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
details.acc > summary { list-style: none; cursor: pointer; padding: 14px; display: grid; grid-template-columns: 42px 1fr 22px; gap: 12px; align-items: center; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .ai { width: 42px; height: 42px; border-radius: 10px; background: var(--raised); color: var(--gold-ink); display: grid; place-items: center; }
details.acc > summary b { display: block; font-size: 17px; line-height: 1.25; }
details.acc > summary small { color: var(--muted); font-size: 14px; line-height: 1.35; display: block; margin-top: 2px; }
details.acc > summary .chev { transition: transform .2s; color: var(--muted); }
details.acc[open] > summary .chev { transform: rotate(180deg); }
details.acc .ab { padding: 0 14px 14px; }
.kv { display: grid; grid-template-columns: 1fr; gap: 10px; }
.kv > div { background: var(--raised); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.kv h4 { margin: 0 0 4px; font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .06em; font-size: 14px; color: var(--muted); }
.kv ul, .kv ol { margin: 0; padding-left: 1.2em; }
.ref { font-family: var(--f-mono); font-size: 13.5px; line-height: 1.5; }
.k-c h4 { color: var(--warn); } .k-v h4 { color: var(--info); } .k-a h4 { color: var(--ok); }
.steps-list { counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps-list > div { display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.steps-list > div::before { counter-increment: s; content: counter(s); width: 38px; height: 38px; border-radius: 50%; background: var(--gold); color: var(--on-gold);
  display: grid; place-items: center; font-family: var(--f-disp); font-weight: 800; font-size: 20px; }
.steps-list b { display: block; }
.method { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.method div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 13px; min-width: 0; }
.method b { display: block; font-family: var(--f-disp); font-size: 16px; color: var(--gold-ink); line-height: 1.1; margin-bottom: 2px; }
.input { width: 100%; padding: 13px 14px 13px 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.field { position: relative; }
.field .i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* ---- schémas */
.figgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.figcard { display: flex; flex-direction: column; gap: 6px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.figcard .thumb { background: var(--plate); border-radius: 8px; aspect-ratio: 16/10; overflow: hidden; display: grid; place-items: center; padding: 4px; }
.figcard .thumb svg { width: 100%; height: 100%; }
.figcard span { font-size: 13.5px; line-height: 1.3; }
.figcard em { font-style: normal; font-size: 12px; color: var(--gold-ink); font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .08em; }

/* ---- quiz */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.qcard h2 { font-family: var(--f-body); font-size: 21px; line-height: 1.3; font-weight: 700; margin: 6px 0 16px; text-transform: none; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raised); cursor: pointer; display: grid; grid-template-columns: 30px 1fr 22px; gap: 10px; align-items: center; }
.opt .ol { width: 30px; height: 30px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font-family: var(--f-disp); font-weight: 800; }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--raised)); }
.opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--raised)); }
.opt:disabled { cursor: default; }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--raised); }
.fb b.ok { color: var(--ok); } .fb b.ko { color: var(--bad); }
.score { text-align: center; padding: 26px 16px; }
.score .big { font-family: var(--f-disp); font-size: 76px; line-height: 1; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.qlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.qitem { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; display: flex; flex-direction: column; gap: 2px; }
.qitem b { font-family: var(--f-disp); font-size: 19px; text-transform: uppercase; }
.qitem small { color: var(--muted); }
.qgen { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: var(--gold); color: var(--on-gold); text-decoration: none; margin-bottom: 14px; }
.qgen b { font-family: var(--f-disp); font-size: 26px; text-transform: uppercase; display: block; line-height: 1; }

/* ---- boutique */
.prod { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.prodgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.prod h3 { margin: 0; font-size: 20px; }
.prod p { margin: 0; color: var(--muted); font-size: 14.5px; flex: 1; }
.prod .ph { border-radius: 10px; overflow: hidden; background: #fff; aspect-ratio: 4/3; }
.prod .ph img { width: 100%; height: 100%; object-fit: contain; display: block; }
.tag { align-self: flex-start; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); }
.tag.num { color: var(--info); border-color: color-mix(in srgb, var(--info) 50%, var(--line)); }
.tag.ana { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.tag.new { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.prod .btn { padding: 10px 12px; min-height: 42px; font-size: 14.5px; }
.banner { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, #1FA855, #13803F); color: #fff; }
.banner b { font-family: var(--f-disp); font-size: 24px; text-transform: uppercase; line-height: 1.05; display: block; }
.banner .btn { background: #fff; color: #13803F; border-color: #fff; }
.admin { border: 2px dashed var(--gold); }
.admin form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.admin label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
.admin .full { grid-column: 1 / -1; }
.admin input, .admin select, .admin textarea { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); width: 100%; }
.note { font-size: 14px; color: var(--muted); }

/* ---- recherche / assistant */
.res { display: block; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; }
.res em { font-style: normal; font-size: 12px; font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .08em; color: var(--gold-ink); }
.res b { display: block; font-size: 16.5px; }
.res span { color: var(--muted); font-size: 14px; }
mark { background: color-mix(in srgb, var(--gold) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.ans { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 14px; padding: 14px; }
.ans .who { display: flex; align-items: center; gap: 8px; font-family: var(--f-disp); text-transform: uppercase; font-size: 16px; color: var(--gold-ink); margin-bottom: 6px; }

<script type="application/json" id="d-data">{"levels":[{"id":"debutant","nom":"Débutant","sous":"Découvrir la radio","icon":"sparkles","col":"#4FB3E8","intro":"Pour ceux qui n’ont jamais touché une radio : ce qu’est une onde, les fréquences, l’analogique et le numérique, les types de radios et les marques.","mods":["debutant-1","debutant-2"],"quiz":["debutant"]},{"id":"utilisateur","nom":"Utilisateur","sous":"Bien utiliser sa radio","icon":"radio","col":"#F2B01E","intro":"Pour les opérateurs d’engins, conducteurs, équipes de terrain et dispatcheurs : le bon geste, l’urgence, la batterie, le mode direct, le dispatch.","mods":["utilisateur-1","utilisateur-2","utilisateur-3"],"quiz":["utilisateur"]},{"id":"technicien","nom":"Technicien","sous":"Installer, programmer, dépanner","icon":"wrench","col":"#3FBF7F","intro":"Le niveau métier : installer un relais de A à Z, poser une radio sur un engin, câbles et connecteurs, programmation, souterrain, suivi et dépannage.","mods":["technicien-1","technicien-2","technicien-3","technicien-4","technicien-5","technicien-6","technicien-7","technicien-8"],"quiz":["technicien","ciel_ouvert","souterrain","pannes"]},{"id":"avance","nom":"Avancé","sous":"Réseaux IP et multi-sites","icon":"network","col":"#A07BEA","intro":"Codeplug en profondeur, IP Site Connect, Capacity Plus, relier des sites distants (même fréquence, analogique, numérique), dispatch et supervision.","mods":["avance-1","avance-2","avance-3","avance-4","avance-5"],"quiz":["t2_1","t2_2","t2_3","t2_4","t2_5"]},{"id":"expert","nom":"Expert","sous":"Concevoir et diriger un réseau","icon":"graduation-cap","col":"#E8892B","intro":"Concevoir un réseau complet, bilan de liaison, redondance, réception, souterrain multi-sites, rôle de l’ingénieur et organisation du service radio.","mods":["expert-1","expert-2","expert-3","expert-4"],"quiz":["t2_6","t2_7"]}],"modules":{"debutant-1":{"id":"debutant-1","lvl":"debutant","titre":"Découvrir la radiocommunication","steps":[{"t":"La radiocommunication, c’est quoi ?","h":"<p>La <strong>radiocommunication<\/strong>, c’est parler à distance <strong>sans fil<\/strong>, grâce aux <strong>ondes radio<\/strong>. Votre voix entre dans le micro, la radio la transforme en onde, l’onde voyage dans l’air à la vitesse de la lumière, et une autre radio la retransforme en voix.<\/p>\n<div class=\"def\">\n<p><strong>Image simple<\/strong> — jetez une pierre dans l’eau : des vagues partent dans toutes les directions. Une antenne fait la même chose avec des vagues invisibles, les <strong>ondes radio<\/strong>.<\/p>\n<\/div>\n<p>Sur un site minier, la radio sert à :<\/p>\n<ul>\n<li><strong>guider les engins<\/strong> (camions, chargeuses, foreuses) depuis le dispatch ;<\/li>\n<li><strong>signaler un danger<\/strong> ou un accident en quelques secondes ;<\/li>\n<li><strong>coordonner<\/strong> les équipes de production, de maintenance et de sécurité ;<\/li>\n<li><strong>appeler les secours<\/strong> même là où le téléphone ne passe pas.<\/li>\n<\/ul>\n<div class=\"tip\">\n<p><strong>Pourquoi pas le téléphone ?<\/strong> Avec la radio, <strong>un seul appui<\/strong> suffit pour parler à <strong>toute une équipe<\/strong> en même temps, sans numéro à composer, sans réseau d’opérateur, et sans facture à chaque appel.<\/p>\n<\/div>"},{"t":"Les grandes familles de radios","h":"<p>Toutes les radios n’ont pas le même usage. Chaque famille a <strong>ses fréquences<\/strong> et <strong>ses règles<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Famille<\/th>\n<th>Qui l’utilise<\/th>\n<th>Exemples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Radio de diffusion<\/strong><\/td>\n<td>Tout le monde, en écoute<\/td>\n<td>Radio FM, radio AM (grandes ondes)<\/td>\n<\/tr>\n<tr>\n<td><strong>Radio de loisirs (PMR446)<\/strong><\/td>\n<td>Particuliers, petits travaux<\/td>\n<td>Talkies du marché, sans licence en Europe<\/td>\n<\/tr>\n<tr>\n<td><strong>Radio marine (VHF marine)<\/strong><\/td>\n<td>Bateaux, ports<\/td>\n<td>Canal 16 pour la détresse<\/td>\n<\/tr>\n<tr>\n<td><strong>Radio aviation<\/strong><\/td>\n<td>Avions, aéroports<\/td>\n<td>Bande 118–137 MHz<\/td>\n<\/tr>\n<tr>\n<td><strong>Radioamateurs<\/strong><\/td>\n<td>Passionnés avec licence<\/td>\n<td>Bandes HF, VHF, UHF réservées<\/td>\n<\/tr>\n<tr>\n<td><strong>Radio professionnelle (PMR)<\/strong><\/td>\n<td>Mines, sécurité, industrie, ONG<\/td>\n<td>Motorola, Icom, Hytera, Kenwood, Tait<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Sur une mine, seule la radio professionnelle a sa place.<\/strong> Un talkie de loisirs acheté au marché n’est pas programmé sur les fréquences du site, ne parle pas au dispatch et peut <strong>brouiller<\/strong> le réseau. Les fréquences professionnelles sont <strong>autorisées et payées<\/strong> auprès de l’AMRTP.<\/p>\n<\/div>"},{"t":"Une petite histoire de la radio","h":"<table>\n<thead>\n<tr>\n<th>Époque<\/th>\n<th>Ce qui change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Fin des années 1890<\/strong><\/td>\n<td>Premières transmissions sans fil en morse<\/td>\n<\/tr>\n<tr>\n<td><strong>Début des années 1900<\/strong><\/td>\n<td>La voix passe à la radio (modulation <strong>AM<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Années 1930–1940<\/strong><\/td>\n<td>La <strong>FM<\/strong> arrive : un son plus propre, moins de parasites. Premiers talkies portables<\/td>\n<\/tr>\n<tr>\n<td><strong>Années 1960–1980<\/strong><\/td>\n<td>Les radios professionnelles se répandent : police, pompiers, industrie, mines. Les <strong>relais<\/strong> apparaissent sur les points hauts<\/td>\n<\/tr>\n<tr>\n<td><strong>Années 1990<\/strong><\/td>\n<td>Premières normes numériques professionnelles (TETRA, APCO P25)<\/td>\n<\/tr>\n<tr>\n<td><strong>2005<\/strong><\/td>\n<td>Publication de la norme <strong>DMR<\/strong> par l’ETSI. Elle devient très répandue dans les mines (Motorola MOTOTRBO, Hytera, Kenwood…)<\/td>\n<\/tr>\n<tr>\n<td><strong>Aujourd’hui<\/strong><\/td>\n<td>Radio numérique + IP : GPS, messages, liaisons par Internet ou satellite, radio sur réseau 4G (PoC)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Ce que le numérique sait faire","h":"<p>Une radio <strong>analogique<\/strong> transporte la voix telle quelle. Une radio <strong>numérique<\/strong> transforme la voix en <strong>chiffres<\/strong> (des 0 et des 1). Cela ouvre beaucoup de possibilités :<\/p>\n<table>\n<thead>\n<tr>\n<th>Fonction<\/th>\n<th>Ce que ça change sur le terrain<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Son clair<\/strong> jusqu’en limite de portée<\/td>\n<td>Moins de « Répétez ! »<\/td>\n<\/tr>\n<tr>\n<td><strong>2 appels sur une même fréquence<\/strong> (DMR, 2 slots)<\/td>\n<td>Deux fois plus de capacité sans nouvelle licence<\/td>\n<\/tr>\n<tr>\n<td><strong>Identité de l’appelant<\/strong><\/td>\n<td>Le dispatch sait qui parle<\/td>\n<\/tr>\n<tr>\n<td><strong>Appel individuel<\/strong><\/td>\n<td>Parler à une seule personne<\/td>\n<\/tr>\n<tr>\n<td><strong>Messages texte<\/strong><\/td>\n<td>Consignes écrites, sans bavardage<\/td>\n<\/tr>\n<tr>\n<td><strong>Position GPS<\/strong><\/td>\n<td>Voir où sont les engins et les équipes<\/td>\n<\/tr>\n<tr>\n<td><strong>Homme à terre / travailleur isolé<\/strong><\/td>\n<td>Alarme automatique si la personne tombe ou ne répond plus<\/td>\n<\/tr>\n<tr>\n<td><strong>Chiffrement<\/strong><\/td>\n<td>Les conversations sensibles ne s’écoutent plus au scanner<\/td>\n<\/tr>\n<tr>\n<td><strong>Batterie qui dure plus longtemps<\/strong><\/td>\n<td>Jusqu’à environ 40 % de plus qu’en analogique (selon les constructeurs)<\/td>\n<\/tr>\n<tr>\n<td><strong>Liaison par IP<\/strong><\/td>\n<td>Relier des sites éloignés (IP Site Connect, Capacity Plus)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"def\">\n<p><strong>Effet falaise<\/strong> — en analogique, plus on s’éloigne, plus le souffle augmente. En numérique, le son reste clair… puis <strong>coupe d’un coup<\/strong> en limite de portée. On ne « sent » pas la limite venir.<\/p>\n<\/div>"},{"t":"Les types de radios","h":"<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Où on le trouve<\/th>\n<th>Puissance habituelle<\/th>\n<th>Exemples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Portable<\/strong> (talkie-walkie)<\/td>\n<td>Dans la main ou à la ceinture<\/td>\n<td>1 à 5 W<\/td>\n<td>Motorola R7, R2, DP4800e ; Icom IC-F52D<\/td>\n<\/tr>\n<tr>\n<td><strong>Mobile<\/strong><\/td>\n<td>Dans un engin ou un véhicule<\/td>\n<td>25 à 45 W<\/td>\n<td>Motorola DM4600e, DM1600 ; Icom IC-F5400D<\/td>\n<\/tr>\n<tr>\n<td><strong>Poste fixe<\/strong><\/td>\n<td>Au dispatch, dans un bureau<\/td>\n<td>Mobile + alimentation 13,8 V<\/td>\n<td>Mobile monté sur un pupitre<\/td>\n<\/tr>\n<tr>\n<td><strong>Relais<\/strong> (répéteur)<\/td>\n<td>Sur un point haut, dans une armoire<\/td>\n<td>25 à 100 W, service continu<\/td>\n<td>Motorola SLR 5500, SLR 8000 ; Icom IC-FR5300<\/td>\n<\/tr>\n<tr>\n<td><strong>Radio ATEX<\/strong><\/td>\n<td>Zones explosives (gaz, poussières)<\/td>\n<td>Selon certification<\/td>\n<td>Gammes « Ex » des fabricants<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>À retenir<\/strong> — le portable est <strong>petit et peu puissant<\/strong>. Le mobile utilise la batterie de l’engin et une antenne sur le toit : il porte <strong>beaucoup plus loin<\/strong>. Le relais, placé haut, permet à tout le monde de se parler sur tout le site.<\/p>\n<\/div>"},{"t":"Les grandes marques","h":"<table>\n<thead>\n<tr>\n<th>Marque<\/th>\n<th>Pays<\/th>\n<th>Gamme numérique<\/th>\n<th>Points forts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Motorola Solutions<\/strong><\/td>\n<td>États-Unis<\/td>\n<td>MOTOTRBO (DMR)<\/td>\n<td>Très répandue dans les mines, large choix d’accessoires et de systèmes (IP Site Connect, Capacity Plus, Capacity Max)<\/td>\n<\/tr>\n<tr>\n<td><strong>Icom<\/strong><\/td>\n<td>Japon<\/td>\n<td>IDAS (NXDN, et DMR sur certains modèles)<\/td>\n<td>Robuste, bon rapport qualité/prix<\/td>\n<\/tr>\n<tr>\n<td><strong>Hytera<\/strong><\/td>\n<td>Chine<\/td>\n<td>DMR, PDT, TETRA<\/td>\n<td>Gamme large, prix compétitifs<\/td>\n<\/tr>\n<tr>\n<td><strong>Kenwood (JVCKenwood)<\/strong><\/td>\n<td>Japon<\/td>\n<td>NXDN, DMR<\/td>\n<td>Bonne qualité audio<\/td>\n<\/tr>\n<tr>\n<td><strong>Tait<\/strong><\/td>\n<td>Nouvelle-Zélande<\/td>\n<td>DMR, P25<\/td>\n<td>Réseaux de grande taille, simulcast<\/td>\n<\/tr>\n<tr>\n<td><strong>Sepura / Airbus<\/strong><\/td>\n<td>Royaume-Uni / Europe<\/td>\n<td>TETRA<\/td>\n<td>Sécurité publique, grands réseaux<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>DMR, NXDN, TETRA ne se parlent pas entre eux.<\/strong> Avant d’acheter, vérifiez que la radio utilise <strong>la même norme numérique<\/strong> que le réseau du site (ou le mode analogique commun).<\/p>\n<\/div>"}]},"debutant-2":{"id":"debutant-2","lvl":"debutant","titre":"Les bases techniques","steps":[{"t":"Les ondes et les fréquences","h":"<h2>Une onde radio, c’est quoi ?<\/h2>\n<p>Jetez un caillou dans l’eau : des vagues partent en cercles. Une antenne fait la même chose, mais avec des <strong>vagues invisibles<\/strong> qui voyagent dans l’air à la vitesse de la lumière (300 000 km par seconde). Ce sont les <strong>ondes radio<\/strong>.<\/p>\n<figure class=\"fig\" data-fig=\"wave_basics\"><div class=\"plate\"><\/div><figcaption>Une onde : la longueur d’onde est la distance entre deux crêtes ; la fréquence est le nombre de crêtes qui passent en une seconde.<\/figcaption><\/figure>\n<div class=\"def\">\n<p><strong>Fréquence<\/strong> — le nombre de vagues par seconde. Elle se mesure en <strong>hertz (Hz)<\/strong>.\n1 kHz = 1 000 Hz · 1 MHz = 1 000 000 Hz · 1 GHz = 1 000 000 000 Hz.<\/p>\n<\/div>\n<div class=\"def\">\n<p><strong>Longueur d’onde (λ)<\/strong> — la distance entre deux crêtes. Formule simple à retenir :\n<strong>λ (en mètres) = 300 ÷ fréquence (en MHz)<\/strong>.<\/p>\n<\/div>\n<div class=\"exp\">\n<p><strong>Exemple<\/strong> — à 150 MHz (VHF) : λ = 300 ÷ 150 = <strong>2 m<\/strong>. Une antenne « quart d’onde » mesure donc environ <strong>50 cm<\/strong>.\nÀ 450 MHz (UHF) : λ = 300 ÷ 450 ≈ <strong>0,67 m<\/strong>, quart d’onde ≈ <strong>17 cm<\/strong>.<\/p>\n<\/div>\n<h2>Fréquence basse ou haute : ce qui change<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Fréquence plus basse (ex. VHF)<\/th>\n<th>Fréquence plus haute (ex. UHF)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Longueur d’onde<\/td>\n<td>Plus longue<\/td>\n<td>Plus courte<\/td>\n<\/tr>\n<tr>\n<td>Taille d’antenne<\/td>\n<td>Plus grande<\/td>\n<td>Plus petite<\/td>\n<\/tr>\n<tr>\n<td>Terrain ouvert, relief<\/td>\n<td>Porte plus loin, contourne mieux<\/td>\n<td>Un peu moins loin<\/td>\n<\/tr>\n<tr>\n<td>Bâtiments, structures métalliques<\/td>\n<td>Passe moins bien<\/td>\n<td>Passe mieux par les ouvertures<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>La « route » des fréquences<\/h2>\n<p>Toutes les radios du monde se partagent le même « espace » : le <strong>spectre radio<\/strong>. Comme sur une grande route, chaque service a sa voie, et un « policier » organise la circulation : l’<strong>UIT<\/strong> (Union internationale des télécommunications) au niveau mondial, et l’<strong>AMRTP<\/strong> au Mali.<\/p>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Bande de fréquences (repères)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Radio AM (ondes moyennes)<\/td>\n<td>531 kHz – 1,6 MHz<\/td>\n<\/tr>\n<tr>\n<td>Radio HF (longues distances, ex. CODAN)<\/td>\n<td>3 – 30 MHz<\/td>\n<\/tr>\n<tr>\n<td>Radio FM (musique)<\/td>\n<td>87,5 – 108 MHz<\/td>\n<\/tr>\n<tr>\n<td>Aviation<\/td>\n<td>118 – 137 MHz<\/td>\n<\/tr>\n<tr>\n<td><strong>Radio professionnelle VHF (mines)<\/strong><\/td>\n<td><strong>136 – 174 MHz<\/strong><\/td>\n<\/tr>\n<tr>\n<td>VHF marine (bateaux, canal 16 = 156,8 MHz)<\/td>\n<td>156 – 162 MHz<\/td>\n<\/tr>\n<tr>\n<td><strong>Radio professionnelle UHF<\/strong><\/td>\n<td><strong>400 – 470 MHz<\/strong> (jusqu’à 527 MHz selon pays)<\/td>\n<\/tr>\n<tr>\n<td>Téléphonie mobile<\/td>\n<td>700 MHz et plus<\/td>\n<\/tr>\n<tr>\n<td>Wi-Fi<\/td>\n<td>2,4 et 5 GHz<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Sortir de sa voie = brouillage.<\/strong> Émettre sur une fréquence non autorisée gêne les autres (parfois des services de sécurité) et est interdit. Sur un site minier, on n’utilise <strong>que<\/strong> les fréquences attribuées au site.<\/p>\n<\/div>"},{"t":"VHF ou UHF ?","h":"<p>Les deux bandes utilisées en radio professionnelle sont la <strong>VHF<\/strong> (Very High Frequency, 136–174 MHz) et l’<strong>UHF<\/strong> (Ultra High Frequency, 400–470 MHz).<\/p>\n<figure class=\"fig\" data-fig=\"vhf_uhf\"><div class=\"plate\"><\/div><figcaption>VHF : grandes ondes, idéales en terrain ouvert. UHF : ondes plus courtes, meilleures dans les bâtiments.<\/figcaption><\/figure>\n<ul>\n<li><strong>Mine à ciel ouvert, pistes, brousse<\/strong> : la <strong>VHF<\/strong> est souvent le meilleur choix (portée plus grande en terrain dégagé).<\/li>\n<li><strong>Usine, ateliers, bâtiments, structures métalliques<\/strong> : l’<strong>UHF<\/strong> passe souvent mieux.<\/li>\n<li><strong>Souterrain<\/strong> : les deux sont possibles, mais <strong>jamais sans infrastructure<\/strong> (câble rayonnant, nœuds…), voir la Partie 5.<\/li>\n<\/ul>\n<div class=\"warn\">\n<p><strong>VHF et UHF ne se parlent pas directement.<\/strong> Une radio VHF n’entend pas une radio UHF. Un réseau = une bande (ou une passerelle entre les deux). Et une antenne VHF ne se monte <strong>jamais<\/strong> sur une radio UHF (et inversement).<\/p>\n<\/div>"},{"t":"AM, FM, analogique et numérique","h":"<h2>Comment la voix monte sur l’onde<\/h2>\n<p>L’onde est un <strong>camion<\/strong> ; la voix est le <strong>chargement<\/strong>. Pour « charger » la voix, on modifie l’onde : c’est la <strong>modulation<\/strong>.<\/p>\n<ul>\n<li><strong>AM<\/strong> (modulation d’amplitude) : on change la <strong>hauteur<\/strong> de l’onde. Sensible aux parasites (orages).<\/li>\n<li><strong>FM<\/strong> (modulation de fréquence) : on change le <strong>rythme<\/strong> de l’onde. Son plus propre. C’est la technique des radios professionnelles <strong>analogiques<\/strong>.<\/li>\n<\/ul>\n<figure class=\"fig\" data-fig=\"am_fm\"><div class=\"plate\"><\/div><figcaption>AM : la hauteur varie. FM : le rythme varie.<\/figcaption><\/figure>\n<h2>Analogique et numérique<\/h2>\n<div class=\"def\">\n<p><strong>Analogique<\/strong> — la voix est transmise telle quelle, comme une lettre recopiée à la main : chaque « copie » (distance, obstacle) ajoute du bruit.\n<strong>Numérique<\/strong> — la voix est transformée en <strong>0 et 1<\/strong> (comme un SMS) puis reconstruite à l’arrivée : le son reste clair… jusqu’à la limite de portée, où il coupe net.<\/p>\n<\/div>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Analogique (FM)<\/th>\n<th>Numérique (DMR)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Appels par fréquence<\/td>\n<td>1<\/td>\n<td><strong>2<\/strong> (2 slots)<\/td>\n<\/tr>\n<tr>\n<td>Son en limite de portée<\/td>\n<td>Souffle, grésille<\/td>\n<td>Clair, puis coupure nette (« effet falaise »)<\/td>\n<\/tr>\n<tr>\n<td>Identité de l’appelant, GPS, texte<\/td>\n<td>Non<\/td>\n<td><strong>Oui<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Homme à terre, travailleur isolé<\/td>\n<td>Non<\/td>\n<td>Oui (selon modèle/licence)<\/td>\n<\/tr>\n<tr>\n<td>Confidentialité<\/td>\n<td>Aucune<\/td>\n<td>Chiffrement possible<\/td>\n<\/tr>\n<tr>\n<td>Autonomie batterie<\/td>\n<td>Standard<\/td>\n<td>Plus longue<\/td>\n<\/tr>\n<tr>\n<td>Compatibilité entre marques<\/td>\n<td>Totale<\/td>\n<td>Seulement à norme égale (DMR ↔ DMR)<\/td>\n<\/tr>\n<tr>\n<td>Complexité de programmation<\/td>\n<td>Faible<\/td>\n<td>Plus élevée<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Le DMR et ses deux slots<\/h2>\n<p>Le <strong>DMR<\/strong> (Digital Mobile Radio) est une norme européenne de l’<strong>ETSI<\/strong>, publiée en <strong>2005<\/strong> (niveaux I et II), puis en 2012 pour le niveau III (trunking). Elle utilise des canaux de <strong>12,5 kHz<\/strong> comme l’analogique, mais découpe le temps en <strong>2 créneaux<\/strong> (TDMA) : le <strong>slot 1<\/strong> et le <strong>slot 2<\/strong>.<\/p>\n<figure class=\"fig\" data-fig=\"tdma\"><div class=\"plate\"><\/div><figcaption>Une seule fréquence, deux slots qui alternent très vite : deux conversations en même temps.<\/figcaption><\/figure>\n<div class=\"exp\">\n<p><strong>Exemple<\/strong> — une seule fréquence de relais : <strong>slot 1<\/strong> pour le groupe « Mine / dispatch », <strong>slot 2<\/strong> pour le groupe « Maintenance ». Deux équipes parlent en même temps sans se gêner.<\/p>\n<\/div>\n<div class=\"def\">\n<p><strong>Groupe de discussion (talkgroup)<\/strong> — un « salon » de conversation. Plusieurs groupes peuvent partager un slot, mais <strong>un seul appel à la fois par slot<\/strong>.\n<strong>Color code<\/strong> — un code de 0 à 15 propre au relais numérique (l’équivalent du CTCSS en analogique). Mauvais color code = la radio n’entend rien.<\/p>\n<\/div>\n<h2>Les autres normes numériques<\/h2>\n<table>\n<thead>\n<tr>\n<th>Norme<\/th>\n<th>Utilisée par<\/th>\n<th>À retenir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>DMR<\/strong><\/td>\n<td>Motorola MOTOTRBO, Hytera, Tait, Kenwood…<\/td>\n<td>La plus répandue en mines. Compatible entre marques en DMR standard<\/td>\n<\/tr>\n<tr>\n<td><strong>TETRA<\/strong><\/td>\n<td>Police, secours, ONU, grands réseaux<\/td>\n<td>Réseau « trunké », mode direct DMO<\/td>\n<\/tr>\n<tr>\n<td><strong>NXDN / IDAS<\/strong><\/td>\n<td>Icom, Kenwood<\/td>\n<td>Robuste, <strong>non compatible<\/strong> avec le DMR<\/td>\n<\/tr>\n<tr>\n<td><strong>P25<\/strong><\/td>\n<td>Sécurité publique (Amérique du Nord)<\/td>\n<td>Ex. Tait TP9900 : P25 + DMR<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>« Numérique » ne veut pas dire « compatible ».<\/strong> Une radio Icom IDAS (NXDN) et une Motorola DMR ne se parlent qu’en <strong>analogique<\/strong>. Avant d’acheter, vérifiez toujours la norme du réseau du site.<\/p>\n<\/div>"},{"t":"Les éléments d’un réseau radio","h":"<figure class=\"fig\" data-fig=\"network\"><div class=\"plate\"><\/div><figcaption>Le réseau type d’un site minier : un relais en point haut, des portables, des mobiles sur engins, un poste fixe au dispatch.<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>Élément<\/th>\n<th>Rôle<\/th>\n<th>Puissance typique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Portable<\/strong> (ex. R7)<\/td>\n<td>Suit la personne<\/td>\n<td>1 à 5 W<\/td>\n<\/tr>\n<tr>\n<td><strong>Mobile<\/strong> (ex. DM4600e)<\/td>\n<td>Fixée sur l’engin, antenne sur le toit<\/td>\n<td>25 à 45 W<\/td>\n<\/tr>\n<tr>\n<td><strong>Fixe / base<\/strong><\/td>\n<td>Au bureau ou au dispatch, sur alimentation 13,8 V<\/td>\n<td>25 à 45 W<\/td>\n<\/tr>\n<tr>\n<td><strong>Relais<\/strong> (ex. SLR 5500)<\/td>\n<td>Reçoit et réémet les appels pour couvrir tout le site<\/td>\n<td>jusqu’à 50 W en continu<\/td>\n<\/tr>\n<tr>\n<td><strong>Dispatch<\/strong><\/td>\n<td>Le poste central qui écoute, répond et organise<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Direct ou via relais<\/h2>\n<ul>\n<li><strong>Mode direct (simplex / « talkie »)<\/strong> : radio à radio, <strong>une seule fréquence<\/strong>, courte portée (quelques centaines de mètres à quelques km). Fonctionne même si le relais est en panne.<\/li>\n<li><strong>Mode relais (semi-duplex)<\/strong> : la radio émet sur <strong>f1<\/strong>, le relais renvoie sur <strong>f2<\/strong>. Toute la zone du relais est couverte.<\/li>\n<\/ul>\n<figure class=\"fig\" data-fig=\"repeater\"><div class=\"plate\"><\/div><figcaption>Le relais écoute sur f1 et répète sur f2, en même temps, grâce au duplexeur.<\/figcaption><\/figure>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — programmez toujours un <strong>canal direct<\/strong> dans chaque radio. Si le relais tombe, les équipes proches peuvent encore se parler. Mais rappelez-le : <strong>en mode direct, le dispatch n’entend pas<\/strong>. Une urgence doit aussi être signalée au dispatch dès que possible.<\/p>\n<\/div>"},{"t":"Les unités à connaître","h":"<h2>Le watt et le dBm<\/h2>\n<table>\n<thead>\n<tr>\n<th>dBm<\/th>\n<th>Puissance<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0 dBm<\/td>\n<td>1 mW<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>30 dBm<\/td>\n<td>1 W<\/td>\n<td>Portable en basse puissance<\/td>\n<\/tr>\n<tr>\n<td>37 dBm<\/td>\n<td>5 W<\/td>\n<td>Portable VHF (R7) en haute puissance<\/td>\n<\/tr>\n<tr>\n<td>40 dBm<\/td>\n<td>10 W<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>44 dBm<\/td>\n<td>25 W<\/td>\n<td>Mobile en puissance moyenne<\/td>\n<\/tr>\n<tr>\n<td>47 dBm<\/td>\n<td>≈ 50 W<\/td>\n<td>Relais SLR 5500<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"def\">\n<p><strong>Le décibel (dB)<\/strong> — une façon simple de compter les gains et les pertes : <strong>+3 dB = puissance × 2<\/strong> ; <strong>–3 dB = puissance ÷ 2<\/strong> ; <strong>–10 dB = puissance ÷ 10<\/strong>.<\/p>\n<\/div>\n<h2>Le TOS (ou ROS)<\/h2>\n<div class=\"def\">\n<p><strong>TOS (taux d’ondes stationnaires)<\/strong> — la part de puissance qui <strong>revient<\/strong> de l’antenne au lieu de partir dans l’air. Comme de l’eau qui reflue dans un tuyau bouché.<\/p>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>TOS mesuré<\/th>\n<th>Puissance qui revient<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1,0<\/td>\n<td>0 %<\/td>\n<td>Parfait<\/td>\n<\/tr>\n<tr>\n<td>1,5<\/td>\n<td>≈ 4 %<\/td>\n<td>Bon (objectif en pratique)<\/td>\n<\/tr>\n<tr>\n<td>2,0<\/td>\n<td>≈ 11 %<\/td>\n<td>À vérifier<\/td>\n<\/tr>\n<tr>\n<td>3,0<\/td>\n<td>≈ 25 %<\/td>\n<td>Problème : antenne, câble ou connecteur<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Gain d’antenne et impédance<\/h2>\n<ul>\n<li>Le <strong>gain<\/strong> d’une antenne (en <strong>dBi<\/strong> ou dBd) indique comment elle « concentre » l’énergie. Une antenne omni de 6 dBi rayonne plus loin à l’horizontale, mais moins vers le haut et le bas.<\/li>\n<li><strong>Toute la chaîne radio est en 50 ohms<\/strong> : radio, câble, connecteurs, antenne. Mélanger des impédances (par exemple un câble TV 75 ohms) fait monter le TOS.<\/li>\n<\/ul>"}]},"utilisateur-1":{"id":"utilisateur-1","lvl":"utilisateur","titre":"Utiliser sa radio au quotidien","steps":[{"t":"Votre radio en main","h":"<p>Avant tout, il faut connaître les <strong>commandes<\/strong> de sa radio. Elles sont presque les mêmes sur toutes les marques.<\/p>\n<table>\n<thead>\n<tr>\n<th>Commande<\/th>\n<th>À quoi elle sert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bouton marche / volume<\/strong> (en haut)<\/td>\n<td>Allumer, éteindre, régler le son<\/td>\n<\/tr>\n<tr>\n<td><strong>Sélecteur de canaux<\/strong> (en haut)<\/td>\n<td>Choisir le canal de son équipe<\/td>\n<\/tr>\n<tr>\n<td><strong>Bouton PTT<\/strong> (sur le côté, le plus grand)<\/td>\n<td>Appuyer pour <strong>parler<\/strong>, relâcher pour <strong>écouter<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Boutons programmables<\/strong> (sur le côté)<\/td>\n<td>Fonctions choisies par le service radio : mode direct, lampe, volume max…<\/td>\n<\/tr>\n<tr>\n<td><strong>Bouton d’urgence<\/strong> (souvent orange, en haut)<\/td>\n<td>Envoyer une <strong>alarme<\/strong> au dispatch<\/td>\n<\/tr>\n<tr>\n<td><strong>Voyant<\/strong><\/td>\n<td>Vert : réception ; rouge : émission ; clignotant : batterie faible ou alerte<\/td>\n<\/tr>\n<tr>\n<td><strong>Antenne<\/strong><\/td>\n<td>À garder <strong>verticale<\/strong>, jamais pliée ni coupée<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Au début du poste<\/strong> — vérifiez en 30 secondes : batterie chargée, antenne bien vissée, bon canal, volume réglé, et un <strong>appel d’essai<\/strong> au dispatch : « Dispatch, de Camion 22, essai radio. »<\/p>\n<\/div>"},{"t":"Le bon geste pour parler","h":"<ol>\n<li><strong>Écouter<\/strong> d’abord : personne ne parle ?<\/li>\n<li><strong>Appuyer<\/strong> sur le PTT et <strong>attendre une seconde<\/strong> que le relais s’ouvre.<\/li>\n<li><strong>Parler<\/strong> clairement, micro à <strong>10 cm<\/strong> de la bouche, sans crier.<\/li>\n<li><strong>Relâcher<\/strong> le PTT et attendre la réponse.<\/li>\n<\/ol>\n<div class=\"def\">\n<p><strong>La méthode QUI – OÙ – QUOI – BESOIN<\/strong> — « Dispatch, de Chargeuse 12 (<strong>qui<\/strong>), rampe 2 niveau 140 (<strong>où<\/strong>), pneu crevé (<strong>quoi<\/strong>), envoyez la maintenance (<strong>besoin<\/strong>). »<\/p>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>À faire<\/th>\n<th>À ne jamais faire<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Messages courts (moins de 15 secondes)<\/td>\n<td>Bavarder sur le canal<\/td>\n<\/tr>\n<tr>\n<td>Utiliser les noms d’engins et de lieux du site<\/td>\n<td>Bloquer le PTT (canal coupé pour tous)<\/td>\n<\/tr>\n<tr>\n<td>Confirmer les consignes : « Bien reçu »<\/td>\n<td>Parler avant d’appuyer (le début est perdu)<\/td>\n<\/tr>\n<tr>\n<td>Laisser la priorité aux urgences<\/td>\n<td>Insulter, plaisanter, mettre de la musique<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"L’appel d’urgence","h":"<ol>\n<li><strong>Se protéger<\/strong> : arrêter l’engin, se mettre à l’abri si possible.<\/li>\n<li>Appuyer sur le <strong>bouton d’urgence<\/strong> ou dire trois fois « <strong>URGENCE<\/strong> ».<\/li>\n<li>Dire <strong>où<\/strong>, <strong>quoi<\/strong>, et <strong>combien de blessés<\/strong>.<\/li>\n<li><strong>Rester sur le canal<\/strong> et répondre au dispatch.<\/li>\n<li>Tous les autres : <strong>silence radio<\/strong> jusqu’à la fin de l’urgence.<\/li>\n<\/ol>\n<div class=\"warn\">\n<p><strong>Ne jamais tester le bouton d’urgence « pour voir ».<\/strong> Une fausse alarme mobilise les secours et le dispatch. Les tests se font lors d’exercices organisés par le service radio.<\/p>\n<\/div>"},{"t":"Ce que l’on signale toujours au dispatch","h":"<p>Chaque opérateur doit <strong>tout signaler<\/strong>, même ce qui paraît petit :<\/p>\n<ul>\n<li>un <strong>accident<\/strong> ou un <strong>presque-accident<\/strong> ;<\/li>\n<li>une <strong>panne d’engin<\/strong> ou une <strong>panne de radio<\/strong> ;<\/li>\n<li>un début d’<strong>incendie<\/strong>, une fuite d’huile ou de gasoil ;<\/li>\n<li>une <strong>piste dangereuse<\/strong> (trou, eau, éboulement, poussière qui gêne la vue) ;<\/li>\n<li>une <strong>personne non autorisée<\/strong> ou un animal sur la piste ;<\/li>\n<li>chaque <strong>début et fin de poste<\/strong>, chaque changement de zone.<\/li>\n<\/ul>\n<div class=\"tip\">\n<p><strong>Pourquoi ?<\/strong> Le dispatch voit l’ensemble du site. Une information qui paraît banale pour vous peut éviter un accident à un autre engin.<\/p>\n<\/div>"},{"t":"Prendre soin de sa radio et de sa batterie","h":"<table>\n<thead>\n<tr>\n<th>Bonne pratique<\/th>\n<th>Pourquoi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Charger la batterie <strong>complètement<\/strong>, sur le chargeur d’origine<\/td>\n<td>Une batterie à moitié chargée lâche en plein poste<\/td>\n<\/tr>\n<tr>\n<td>Ne pas laisser la radio <strong>en plein soleil<\/strong> sur le tableau de bord<\/td>\n<td>La chaleur détruit la batterie<\/td>\n<\/tr>\n<tr>\n<td>Utiliser seulement des <strong>batteries d’origine<\/strong><\/td>\n<td>Les copies chauffent, gonflent, et peuvent prendre feu<\/td>\n<\/tr>\n<tr>\n<td>Garder les <strong>contacts propres<\/strong> (radio et batterie)<\/td>\n<td>Un contact sale coupe la radio<\/td>\n<\/tr>\n<tr>\n<td>Protéger de la <strong>poussière et de l’eau<\/strong> : bouchons fermés, housse<\/td>\n<td>Même une radio IP67 s’abîme si elle est maltraitée<\/td>\n<\/tr>\n<tr>\n<td>Ne jamais <strong>tenir la radio par l’antenne<\/strong><\/td>\n<td>L’antenne se casse et la portée s’effondre<\/td>\n<\/tr>\n<tr>\n<td>Signaler toute radio <strong>tombée, mouillée ou abîmée<\/strong><\/td>\n<td>Le service radio la contrôle avant qu’elle ne lâche<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Le mode direct (talkie)","h":"<p>En temps normal, les radios passent par le <strong>relais<\/strong>. Mais il existe un <strong>canal direct<\/strong> : radio à radio, <strong>sans relais<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Via le relais<\/th>\n<th>En mode direct<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Portée<\/td>\n<td>Tout le site<\/td>\n<td>Quelques centaines de mètres à 2 ou 3 km<\/td>\n<\/tr>\n<tr>\n<td>Le dispatch entend<\/td>\n<td>Oui<\/td>\n<td>Seulement s’il est proche<\/td>\n<\/tr>\n<tr>\n<td>Quand l’utiliser<\/td>\n<td>Toujours, par défaut<\/td>\n<td>Relais en panne, petit chantier isolé, secours au fond d’une fosse<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p><strong>Prévenir avant de passer en direct.<\/strong> Annoncez au dispatch « Je passe sur le canal direct », puis <strong>revenez<\/strong> sur le canal normal dès que possible. Sinon, plus personne ne peut vous joindre.<\/p>\n<\/div>"},{"t":"Radio perdue, volée ou en panne","h":"<ul>\n<li><strong>Panne<\/strong> : prévenir tout de suite le dispatch ou le service radio, rendre la radio, prendre une <strong>radio de prêt<\/strong>. Ne jamais démonter soi-même.<\/li>\n<li><strong>Perte ou vol<\/strong> : le signaler <strong>immédiatement<\/strong>. Le service radio peut <strong>bloquer<\/strong> la radio à distance (en numérique) pour qu’elle ne serve pas à écouter le réseau.<\/li>\n<li><strong>Changement de poste<\/strong> : rendre la radio et signer la <strong>fiche de retour<\/strong>. Une radio est toujours <strong>au nom<\/strong> de quelqu’un.<\/li>\n<\/ul>"},{"t":"Radio et zone de tir","h":"<p>Une radio qui émet produit une énergie électromagnétique. Près des <strong>détonateurs électriques<\/strong>, cette énergie peut être dangereuse.<\/p>\n<ul>\n<li>Respecter <strong>strictement<\/strong> les consignes et les <strong>distances<\/strong> fixées par le site (affichées à l’entrée des zones).<\/li>\n<li><strong>Ne pas émettre<\/strong> à proximité des charges si la consigne l’interdit : on peut écouter, pas parler.<\/li>\n<li>Suivre les <strong>annonces de tir<\/strong> à la radio et respecter le silence demandé.<\/li>\n<\/ul>\n<div class=\"warn\">\n<p>Les distances de sécurité dépendent du type de détonateur et de la puissance de la radio. <strong>Seul le responsable du tir et les consignes du site<\/strong> font foi.<\/p>\n<\/div>"}]},"utilisateur-2":{"id":"utilisateur-2","lvl":"utilisateur","titre":"Le dispatch radio","steps":[{"t":"Le rôle du dispatch","h":"<p>Le <strong>dispatch<\/strong> est le cœur du réseau radio. L’opérateur dispatch écoute, répond, <strong>organise<\/strong> les appels et déclenche les secours.<\/p>\n<table>\n<thead>\n<tr>\n<th>Mission<\/th>\n<th>En pratique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Écouter<\/strong> en permanence<\/td>\n<td>Aucun appel sans réponse, 24 h sur 24<\/td>\n<\/tr>\n<tr>\n<td><strong>Organiser<\/strong> le canal<\/td>\n<td>Donner la parole, faire libérer le canal pour une urgence<\/td>\n<\/tr>\n<tr>\n<td><strong>Suivre<\/strong> les engins et les équipes<\/td>\n<td>Carte GPS, tableau des engins, début et fin de poste<\/td>\n<\/tr>\n<tr>\n<td><strong>Alerter<\/strong><\/td>\n<td>Secours, maintenance, sécurité, service radio<\/td>\n<\/tr>\n<tr>\n<td><strong>Tracer<\/strong><\/td>\n<td>Journal radio : heure, qui, quoi, suite donnée<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Tenir le journal radio","h":"<p>Chaque événement important s’écrit dans le <strong>journal radio<\/strong> (cahier ou logiciel).<\/p>\n<table>\n<thead>\n<tr>\n<th>Heure<\/th>\n<th>Appelant<\/th>\n<th>Message<\/th>\n<th>Action / suite<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>06 h 02<\/td>\n<td>Camion 22<\/td>\n<td>Début de poste, essai radio OK<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>07 h 45<\/td>\n<td>Chargeuse 12<\/td>\n<td>Pneu crevé, rampe 2 niveau 140<\/td>\n<td>Maintenance prévenue 07 h 47<\/td>\n<\/tr>\n<tr>\n<td>09 h 10<\/td>\n<td>Foreuse 3<\/td>\n<td>Radio en panne<\/td>\n<td>Service radio prévenu, radio de prêt 09 h 40<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Écrire l’heure exacte<\/strong> de chaque appel et de chaque action. En cas d’enquête après un accident, le journal radio est une pièce essentielle.<\/p>\n<\/div>"},{"t":"Gérer une urgence","h":"<ol>\n<li><strong>Prendre la main<\/strong> : « Ici dispatch, urgence en cours, silence radio sur le canal. »<\/li>\n<li><strong>Recueillir<\/strong> : qui, où, quoi, combien de blessés, accès possible.<\/li>\n<li><strong>Alerter<\/strong> les secours (ambulance, pompiers, sécurité) avec les mêmes informations.<\/li>\n<li><strong>Guider<\/strong> les secours et <strong>garder le contact<\/strong> avec la personne.<\/li>\n<li><strong>Clôturer<\/strong> : « Fin de l’urgence, reprise normale du trafic. » et tout noter.<\/li>\n<\/ol>\n<div class=\"def\">\n<p><strong>Homme à terre / travailleur isolé<\/strong> — sur certaines radios numériques, une alarme part toute seule si la radio reste <strong>couchée<\/strong> ou <strong>sans mouvement<\/strong>, ou si la personne ne répond pas à un rappel. Le dispatch traite cette alarme comme une <strong>vraie urgence<\/strong> jusqu’à preuve du contraire.<\/p>\n<\/div>"},{"t":"La relève de poste","h":"<p>À chaque changement d’équipe, l’opérateur sortant transmet :<\/p>\n<ul>\n<li>les <strong>urgences<\/strong> ou incidents <strong>en cours<\/strong> ;<\/li>\n<li>les <strong>engins arrêtés<\/strong> et les <strong>zones fermées<\/strong> ;<\/li>\n<li>les <strong>pannes radio<\/strong> signalées et les radios de prêt sorties ;<\/li>\n<li>les <strong>consignes<\/strong> particulières (tirs prévus, visites, travaux) ;<\/li>\n<li>l’état du <strong>matériel du dispatch<\/strong> (postes fixes, logiciel, enregistreur).<\/li>\n<\/ul>\n<div class=\"warn\">\n<p><strong>Une relève se fait à deux et à voix haute<\/strong>, pas seulement par écrit. Le nouvel opérateur signe le journal.<\/p>\n<\/div>"}]},"utilisateur-3":{"id":"utilisateur-3","lvl":"utilisateur","titre":"Procédures radio complètes","steps":[{"t":"La discipline radio","h":"<h2>Le bon geste<\/h2>\n<ol>\n<li><strong>Écouter<\/strong> avant de parler : le canal est-il libre ?<\/li>\n<li><strong>Appuyer<\/strong> sur le bouton PTT, <strong>attendre une seconde<\/strong> (le relais s’ouvre).<\/li>\n<li><strong>Parler clairement<\/strong>, micro à environ 10 cm, phrases courtes, sans crier.<\/li>\n<li><strong>Relâcher<\/strong> et écouter la réponse.<\/li>\n<\/ol>\n<h2>La méthode QUI – OÙ – QUOI – BESOIN<\/h2>\n<table>\n<thead>\n<tr>\n<th>Information<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>QUI<\/strong> j’appelle, qui je suis<\/td>\n<td>« Dispatch, de Chargeuse 12. »<\/td>\n<\/tr>\n<tr>\n<td><strong>OÙ<\/strong> je suis<\/td>\n<td>« Rampe 2, niveau 140. »<\/td>\n<\/tr>\n<tr>\n<td><strong>QUOI<\/strong> se passe<\/td>\n<td>« Pneu crevé, engin arrêté. »<\/td>\n<\/tr>\n<tr>\n<td><strong>BESOIN<\/strong><\/td>\n<td>« Envoyez la maintenance. »<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Le dispatch <strong>répète<\/strong> pour confirmer : « Chargeuse 12, je répète : pneu crevé rampe 2, niveau 140, maintenance prévenue. »<\/p>\n<h2>L’appel d’urgence<\/h2>\n<ol>\n<li>Se <strong>protéger<\/strong> (engin arrêté, zone sécurisée si possible).<\/li>\n<li>Appuyer sur le <strong>bouton d’urgence<\/strong> ou dire « <strong>URGENCE, URGENCE, URGENCE<\/strong> ».<\/li>\n<li>Donner <strong>où, quoi, combien de blessés<\/strong>.<\/li>\n<li><strong>Rester sur le canal<\/strong> et répondre au dispatch.<\/li>\n<li>Tous les autres : <strong>silence radio<\/strong> jusqu’à la fin de l’urgence.<\/li>\n<\/ol>\n<h2>Ce que l’opérateur signale toujours au dispatch<\/h2>\n<p>Accident, presque-accident, panne d’engin, <strong>panne de radio<\/strong>, début d’incendie, déversement (huile, gasoil), piste dangereuse, personne non autorisée, et chaque <strong>début et fin de poste<\/strong>.<\/p>\n<h2>L’alphabet phonétique international<\/h2>\n<table>\n<thead>\n<tr>\n<th>A Alpha<\/th>\n<th>B Bravo<\/th>\n<th>C Charlie<\/th>\n<th>D Delta<\/th>\n<th>E Echo<\/th>\n<th>F Foxtrot<\/th>\n<th>G Golf<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>H<\/strong> Hotel<\/td>\n<td><strong>I<\/strong> India<\/td>\n<td><strong>J<\/strong> Juliett<\/td>\n<td><strong>K<\/strong> Kilo<\/td>\n<td><strong>L<\/strong> Lima<\/td>\n<td><strong>M<\/strong> Mike<\/td>\n<td><strong>N<\/strong> November<\/td>\n<\/tr>\n<tr>\n<td><strong>O<\/strong> Oscar<\/td>\n<td><strong>P<\/strong> Papa<\/td>\n<td><strong>Q<\/strong> Quebec<\/td>\n<td><strong>R<\/strong> Romeo<\/td>\n<td><strong>S<\/strong> Sierra<\/td>\n<td><strong>T<\/strong> Tango<\/td>\n<td><strong>U<\/strong> Uniform<\/td>\n<\/tr>\n<tr>\n<td><strong>V<\/strong> Victor<\/td>\n<td><strong>W<\/strong> Whiskey<\/td>\n<td><strong>X<\/strong> X-ray<\/td>\n<td><strong>Y<\/strong> Yankee<\/td>\n<td><strong>Z<\/strong> Zulu<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Ce qui ne se dit pas en clair<\/h2>\n<p>Les ondes dépassent la clôture du site : un simple scanner peut écouter. On ne dit <strong>jamais<\/strong> en clair : horaires de convoi (valeurs, explosifs, carburant), codes et mots de passe, informations médicales ou personnelles. Besoin de confidentialité : <strong>chiffrement<\/strong> ou téléphone.<\/p>"}]},"technicien-1":{"id":"technicien-1","lvl":"technicien","titre":"Installer un réseau à ciel ouvert","steps":[{"t":"Étape 1 : l’étude préalable","h":"<p>Avant d’acheter le moindre équipement, le technicien <strong>étudie le site<\/strong>. Une bonne étude évite la plupart des problèmes plus tard.<\/p>\n<h2>Les questions à poser<\/h2>\n<table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>Pourquoi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Combien d’utilisateurs ? Combien d’engins ?<\/td>\n<td>Nombre de radios, de canaux, de slots<\/td>\n<\/tr>\n<tr>\n<td>Quelles équipes doivent se parler ?<\/td>\n<td>Organisation des groupes (mine, usine, sécurité, maintenance)<\/td>\n<\/tr>\n<tr>\n<td>Quelle surface couvrir ? Quel relief ?<\/td>\n<td>Nombre et position des relais<\/td>\n<\/tr>\n<tr>\n<td>Y a-t-il des zones souterraines, des bâtiments ?<\/td>\n<td>Solutions complémentaires (Partie 5)<\/td>\n<\/tr>\n<tr>\n<td>Énergie disponible sur les points hauts ?<\/td>\n<td>Secteur, solaire, groupe<\/td>\n<\/tr>\n<tr>\n<td>Liaisons IP existantes (fibre, VSAT, Starlink) ?<\/td>\n<td>Pour relier plusieurs sites (IP Site Connect)<\/td>\n<\/tr>\n<tr>\n<td>Fréquences déjà autorisées ?<\/td>\n<td>Dossier AMRTP à préparer ou à mettre à jour<\/td>\n<\/tr>\n<tr>\n<td>Matériel déjà en place ?<\/td>\n<td>Inventaire, compatibilité, mode mixte<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>L’inventaire de départ<\/h2>\n<p>Faites l’inventaire <strong>radio par radio<\/strong> : marque, modèle, numéro de série, bande (VHF/UHF), analogique ou numérique, utilisateur ou engin, société, état. Ce fichier sera la base de tout le suivi (voir Partie 6).<\/p>\n<h2>La carte et le relief<\/h2>\n<p>Sur une carte du site (Google Earth ou plan de la mine), repérez :<\/p>\n<ul>\n<li>les <strong>points hauts<\/strong> candidats (collines, verses stabilisées, pylônes existants) ;<\/li>\n<li>le <strong>pit<\/strong> et sa profondeur actuelle et future ;<\/li>\n<li>les zones de travail : pistes, concasseur, usine, ateliers, camp ;<\/li>\n<li>les obstacles : verses, collines, bâtiments métalliques.<\/li>\n<\/ul>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — la règle d’or de la VHF/UHF : <strong>la ligne de vue<\/strong>. Si, depuis l’antenne du relais, vous « voyez » une zone, elle sera bien couverte. Si une colline ou une verse se trouve entre les deux, attendez-vous à une zone d’ombre.<\/p>\n<\/div>\n<figure class=\"fig\" data-fig=\"pit_coverage\"><div class=\"plate\"><\/div><figcaption>Coupe d’un pit : le relais en point haut voit les gradins supérieurs, mais le fond du pit devient une zone d’ombre à mesure qu’il se creuse.<\/figcaption><\/figure>\n<h2>Le dossier réglementaire<\/h2>\n<p>Au Mali, l’exploitation d’un réseau radio privé demande une <strong>autorisation de l’AMRTP<\/strong> et une <strong>assignation de fréquences<\/strong>, soumises à une <strong>redevance annuelle<\/strong>. Seuls des <strong>équipements agréés<\/strong> peuvent être utilisés, et tout changement (nouveau site, nouveaux équipements) doit être <strong>déclaré<\/strong>. Le réseau peut faire l’objet de <strong>contrôles<\/strong> : tenez un <strong>registre de maintenance<\/strong> à jour.<\/p>"},{"t":"Étape 2 : choisir le site du relais et le pylône","h":"<h2>Les critères du bon site<\/h2>\n<ol>\n<li><strong>Hauteur et dégagement<\/strong> : le plus haut possible, avec une vue sur les zones à couvrir.<\/li>\n<li><strong>Accès<\/strong> : un chemin praticable toute l’année (saison des pluies comprise).<\/li>\n<li><strong>Énergie<\/strong> : secteur proche, ou place pour des panneaux solaires.<\/li>\n<li><strong>Sécurité<\/strong> : clôture, abri fermé, loin des zones de tir et des futures extensions du pit.<\/li>\n<li><strong>Stabilité du sol<\/strong> : pas sur une verse récente qui peut bouger.<\/li>\n<\/ol>\n<h2>Le pylône<\/h2>\n<ul>\n<li><strong>Pylône autoportant<\/strong> ou <strong>haubané<\/strong> : choisi selon la hauteur, le vent et la place disponible.<\/li>\n<li><strong>Hauteur typique<\/strong> sur mine : 18 à 40 m selon le relief.<\/li>\n<li><strong>Balisage<\/strong> (peinture rouge et blanche, feu) si exigé (aviation, hauteur).<\/li>\n<li><strong>Fondation<\/strong> calculée par un bureau d’études ; <strong>mise à la terre<\/strong> obligatoire (voir plus loin).<\/li>\n<\/ul>\n<div class=\"warn\">\n<p><strong>Travail en hauteur<\/strong> — on ne monte jamais seul, jamais sans <strong>harnais double longe<\/strong>, jamais par <strong>orage<\/strong> ou vent fort. Un permis de travail en hauteur est généralement exigé par le site.<\/p>\n<\/div>"},{"t":"Étape 3 : la chaîne d’antenne du relais","h":"<p>C’est le cœur de l’installation. Chaque élément compte : un seul mauvais connecteur peut faire perdre la moitié de la portée.<\/p>\n<figure class=\"fig\" data-fig=\"relay_site\"><div class=\"plate\"><\/div><figcaption>La chaîne complète d’un site relais, de l’antenne à la batterie.<\/figcaption><\/figure>\n<h2>1. L’antenne<\/h2>\n<ul>\n<li><strong>Type<\/strong> : antenne <strong>omnidirectionnelle à gain<\/strong> (colinéaire en fibre de verre), réglée sur la bande du relais (ex. VHF 150–160 MHz).<\/li>\n<li><strong>Position<\/strong> : au <strong>sommet<\/strong> du pylône, ou sur un <strong>bras de déport<\/strong> d’au moins 1 m, pour que le métal du pylône ne fasse pas écran.<\/li>\n<li><strong>Polarisation verticale<\/strong> : comme toutes les antennes du réseau.<\/li>\n<li><strong>Écartement<\/strong> des autres antennes (téléphonie, faisceaux) pour éviter les interférences.<\/li>\n<\/ul>\n<figure class=\"fig\" data-fig=\"antenna_mount\"><div class=\"plate\"><\/div><figcaption>Bonne et mauvaise position de l’antenne sur le pylône.<\/figcaption><\/figure>\n<h2>2. Le câble coaxial (la « descente »)<\/h2>\n<ul>\n<li>Câble <strong>faible perte<\/strong> : de type <strong>LMR-400<\/strong> ou <strong>1/2 pouce<\/strong> (« heliax ») pour la descente. Le <strong>RG-58<\/strong> est réservé aux petites longueurs (moins de quelques mètres).<\/li>\n<li><strong>Le plus court possible<\/strong> : chaque mètre coûte de la puissance.<\/li>\n<li>Fixé tous les <strong>1 à 1,5 m<\/strong> avec des colliers inox ou UV.<\/li>\n<li><strong>Boucle d’égouttement<\/strong> avant l’entrée dans l’abri, pour que l’eau ne suive pas le câble.<\/li>\n<\/ul>\n<div class=\"exp\">\n<p><strong>Exemple — ce que coûte le mauvais câble<\/strong> (valeurs indicatives à 150 MHz, 30 m de câble, relais 50 W) :\n<strong>RG-58<\/strong> : environ –6 dB → il reste ≈ <strong>12 W<\/strong> à l’antenne.\n<strong>LMR-400<\/strong> : environ –1,5 dB → il reste ≈ <strong>35 W<\/strong> à l’antenne.\nLe bon câble coûte plus cher, mais il triple la puissance utile.<\/p>\n<\/div>\n<h2>3. Les connecteurs<\/h2>\n<table>\n<thead>\n<tr>\n<th>Connecteur<\/th>\n<th>Où<\/th>\n<th>Remarque<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>N<\/strong> (mâle/femelle)<\/td>\n<td>Antenne, câble de descente, parafoudre, duplexeur, sortie TX du SLR 5500<\/td>\n<td>Vissé, étanche avec joint, excellent en VHF/UHF<\/td>\n<\/tr>\n<tr>\n<td><strong>BNC<\/strong><\/td>\n<td>Entrée RX du SLR 5500, appareils de mesure<\/td>\n<td>Clic quart de tour<\/td>\n<\/tr>\n<tr>\n<td><strong>Mini-UHF<\/strong><\/td>\n<td>Antenne des mobiles Motorola (série DM4000e / XPR 5000)<\/td>\n<td>Petit, vissé<\/td>\n<\/tr>\n<tr>\n<td><strong>SMA<\/strong><\/td>\n<td>Antennes de certains portables<\/td>\n<td>Très petit, fragile<\/td>\n<\/tr>\n<tr>\n<td><strong>PL-259 / SO-239<\/strong><\/td>\n<td>Anciens mobiles et accessoires<\/td>\n<td>Moins bon en UHF<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — étanchéité des connecteurs extérieurs : <strong>1)<\/strong> serrer à la main puis un quart de tour, <strong>2)<\/strong> une couche de <strong>ruban vulcanisant<\/strong> (auto-amalgamant) en l’étirant, <strong>3)<\/strong> une couche de <strong>ruban adhésif électrique<\/strong> par-dessus contre les UV. L’eau dans un connecteur est la première cause de TOS élevé après la saison des pluies.<\/p>\n<\/div>\n<h2>4. Le parafoudre et la mise à la terre<\/h2>\n<figure class=\"fig\" data-fig=\"grounding\"><div class=\"plate\"><\/div><figcaption>Le chemin de la foudre : tout est relié à une même terre.<\/figcaption><\/figure>\n<ul>\n<li>Un <strong>parafoudre coaxial<\/strong> (type « quart d’onde » ou à cartouche gaz) se place <strong>à l’entrée de l’abri<\/strong>, relié à la barre de terre.<\/li>\n<li>Le pylône, le blindage du câble (kits de mise à la terre en haut, au milieu et en bas), l’armoire, le relais et le parafoudre sont <strong>tous reliés à la même terre<\/strong>.<\/li>\n<li><strong>Prise de terre<\/strong> : piquets en cuivre ou ceinture de fond de fouille, câble cuivre nu de forte section. Visez une <strong>résistance la plus basse possible<\/strong> (beaucoup de sites visent moins de 10 Ω) et <strong>mesurez-la chaque année<\/strong>.<\/li>\n<\/ul>\n<h2>5. Le duplexeur<\/h2>\n<div class=\"def\">\n<p><strong>Duplexeur<\/strong> — un filtre (à cavités) qui permet au relais d’<strong>émettre et recevoir en même temps sur une seule antenne<\/strong>, en séparant f1 et f2. Il protège le récepteur du signal puissant de son propre émetteur.<\/p>\n<\/div>\n<ul>\n<li>Il est <strong>réglé (accordé) sur vos fréquences<\/strong> par un technicien équipé : on ne touche pas aux vis de réglage sans appareil de mesure.<\/li>\n<li>Il se raccorde entre le relais (sortie TX en N, entrée RX en BNC sur le SLR 5500) et l’antenne.<\/li>\n<li>Sans duplexeur, il faut <strong>deux antennes bien écartées<\/strong> verticalement.<\/li>\n<\/ul>\n<h2>6. Le relais<\/h2>\n<p>Exemple : <strong>Motorola SLR 5500<\/strong> (données fabricant) :<\/p>\n<table>\n<thead>\n<tr>\n<th>Caractéristique<\/th>\n<th>Valeur<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bandes<\/td>\n<td>VHF 136–174 MHz ; UHF 403–470 / 450–527 MHz<\/td>\n<\/tr>\n<tr>\n<td>Puissance<\/td>\n<td>1 à 50 W, <strong>50 W en continu<\/strong> (cycle 100 %)<\/td>\n<\/tr>\n<tr>\n<td>Canaux<\/td>\n<td>64<\/td>\n<\/tr>\n<tr>\n<td>Alimentation<\/td>\n<td>100–240 V AC <strong>ou<\/strong> 11 à 14,4 V DC (9,5 A en émission, 0,7 A en veille)<\/td>\n<\/tr>\n<tr>\n<td>Chargeur intégré<\/td>\n<td>12 V, 3 A (pour batterie de secours)<\/td>\n<\/tr>\n<tr>\n<td>Connecteurs antenne<\/td>\n<td>TX : <strong>N femelle<\/strong> ; RX : <strong>BNC femelle<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Format<\/td>\n<td>1U rack 19 pouces, 8,6 kg<\/td>\n<\/tr>\n<tr>\n<td>Modes<\/td>\n<td>Analogique, numérique DMR, mode mixte, IP Site Connect, Capacity Plus, Capacity Max<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. L’armoire et l’abri<\/h2>\n<ul>\n<li>Armoire <strong>19 pouces<\/strong> ventilée, fermée à clé.<\/li>\n<li>Abri (shelter ou conteneur) <strong>ventilé ou climatisé<\/strong> : la chaleur est l’ennemie de l’électronique et des batteries.<\/li>\n<li><strong>Étiquetage<\/strong> de chaque câble et équipement.<\/li>\n<li><strong>Schéma<\/strong> du site affiché dans l’abri.<\/li>\n<\/ul>"},{"t":"Étape 4 : l’énergie","h":"<p>Pas de courant = pas de relais = pas de radio sur la mine. L’énergie doit être <strong>secourue<\/strong>.<\/p>\n<figure class=\"fig\" data-fig=\"energy\"><div class=\"plate\"><\/div><figcaption>Trois chaînes d’énergie possibles pour un relais.<\/figcaption><\/figure>\n<h2>Les solutions<\/h2>\n<ol>\n<li><strong>Secteur + onduleur + batteries<\/strong> : le plus courant près des installations.<\/li>\n<li><strong>Solaire autonome<\/strong> : panneaux + régulateur + batteries. Idéal sur les points hauts isolés.<\/li>\n<li><strong>Hybride<\/strong> : secteur ou groupe + solaire + batteries.<\/li>\n<\/ol>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — le SLR 5500 accepte une <strong>alimentation 12 V DC<\/strong> (11–14,4 V) et possède un <strong>chargeur de batterie intégré<\/strong> (12 V, 3 A). C’est pratique pour garder une batterie de secours en charge permanente derrière le relais.<\/p>\n<\/div>\n<h2>Calculer un système solaire (méthode simple)<\/h2>\n<div class=\"exp\">\n<p><strong>Exemple de dimensionnement<\/strong> (chiffres d’exemple : chaque site se calcule avec sa vraie consommation)<\/p>\n<ol>\n<li><strong>Consommation moyenne<\/strong> du site (relais + liaison IP) : 60 W en continu.<\/li>\n<li><strong>Énergie par jour<\/strong> : 60 W × 24 h = <strong>1 440 Wh/jour<\/strong>.<\/li>\n<li><strong>Autonomie voulue<\/strong> sans soleil : 3 jours → 1 440 × 3 = <strong>4 320 Wh<\/strong>.<\/li>\n<li><strong>Profondeur de décharge<\/strong> maxi pour préserver les batteries : 50 % → 4 320 ÷ 0,5 = 8 640 Wh.<\/li>\n<li><strong>Capacité batterie en 24 V<\/strong> : 8 640 ÷ 24 ≈ <strong>360 Ah<\/strong> (par exemple 4 batteries 12 V 180 Ah : 2 en série × 2 en parallèle).<\/li>\n<li><strong>Panneaux<\/strong> : ensoleillement utile ≈ 5,5 h/jour, rendement global 0,75 → 1 440 ÷ (5,5 × 0,75) ≈ <strong>350 Wc<\/strong>. On prend une marge : <strong>400 à 500 Wc<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"warn\">\n<p>Si le relais est en 12 V et le parc batteries en 24 V, il faut un <strong>convertisseur DC/DC 24 → 12 V<\/strong> de puissance suffisante. Ne jamais brancher un équipement 12 V directement sur du 24 V.<\/p>\n<\/div>"},{"t":"Étape 5 : programmation et mise en service","h":"<h2>Programmer le relais<\/h2>\n<p>Le relais se programme avec le logiciel du fabricant (pour Motorola : <strong>MOTOTRBO CPS 2.0<\/strong>). Les réglages principaux (détaillés dans la Partie 4) :<\/p>\n<ul>\n<li>fréquences <strong>TX<\/strong> et <strong>RX<\/strong> (celles de l’autorisation AMRTP) ;<\/li>\n<li><strong>mode<\/strong> de chaque canal : analogique, numérique, ou mixte ;<\/li>\n<li>en analogique : <strong>CTCSS/DCS<\/strong> ; en numérique : <strong>color code<\/strong> ;<\/li>\n<li><strong>puissance<\/strong> (réglée au juste nécessaire) ;<\/li>\n<li>si plusieurs sites : paramètres <strong>IP Site Connect<\/strong> (maître / pairs).<\/li>\n<\/ul>\n<h2>Les mesures obligatoires<\/h2>\n<ol>\n<li><strong>TOS<\/strong> de la ligne d’antenne : objectif <strong>≤ 1,5<\/strong>.<\/li>\n<li><strong>Puissance directe<\/strong> en sortie du relais et après le duplexeur.<\/li>\n<li><strong>Test de couverture<\/strong> : appels d’essai aux points les plus éloignés et au fond du pit.<\/li>\n<li><strong>Test de l’énergie de secours<\/strong> : couper le secteur et vérifier que le relais continue.<\/li>\n<\/ol>\n<h2>Le test de couverture<\/h2>\n<figure class=\"fig\" data-fig=\"coverage_map\"><div class=\"plate\"><\/div><figcaption>Une carte de couverture : chaque point de mesure est noté de 1 à 5.<\/figcaption><\/figure>\n<ul>\n<li>Préparez une <strong>liste de points<\/strong> : fond du pit, rampes, pistes, concasseur, ateliers, bâtiments, camp.<\/li>\n<li>Testez <strong>à pied<\/strong> (portable) et <strong>en véhicule<\/strong> (mobile).<\/li>\n<li>Notez pour chaque point : position GPS, qualité de 1 à 5 (5 = « 5 sur 5 »), canal, date.<\/li>\n<li>Reportez les résultats sur une carte : vert (bon), orange (faible), rouge (pas de contact).<\/li>\n<li><strong>Refaites le test<\/strong> après chaque modification (nouveau relais, avancée du pit, nouvelle verse).<\/li>\n<\/ul>\n<h2>Le dossier de mise en service<\/h2>\n<p>Le technicien remet un dossier qui contient : schéma du site, liste des équipements (modèles et numéros de série), réglages (fréquences, codes, puissances), mesures (TOS, puissance), carte de couverture, photos, et la sauvegarde de la programmation.<\/p>"},{"t":"Étape 6 : faire vivre le réseau avec la mine","h":"<p>Une mine à ciel ouvert <strong>change tous les jours<\/strong> : le pit se creuse, les verses montent, les pistes bougent.<\/p>\n<ul>\n<li><strong>Revoyez la couverture<\/strong> au moins tous les trimestres et à chaque grand changement.<\/li>\n<li><strong>Anticipez<\/strong> : quand le pit atteindra une certaine profondeur, faudra-t-il un relais de plus ou une antenne au bord du pit ?<\/li>\n<li>Gardez un <strong>répéteur portable d’urgence<\/strong> (relais transportable avec batterie et mât) pour les nouvelles zones et les pannes.<\/li>\n<\/ul>\n<div class=\"tip\">\n<p><strong>Conseil du terrain<\/strong> — plusieurs sites (par exemple trois pits ou un camp éloigné) peuvent être reliés par <strong>IP Site Connect<\/strong> : jusqu’à 15 relais reliés par réseau IP (fibre, faisceau hertzien, VSAT, Starlink). Un appel lancé sur un site est entendu sur tous les autres. Voir la Partie 4.<\/p>\n<\/div>"}]},"technicien-2":{"id":"technicien-2","lvl":"technicien","titre":"Radios portables, mobiles et fixes","steps":[{"t":"Le portable : exemple du Motorola R7","h":"<figure class=\"photo\"><img data-img=\"r7\" alt=\"Motorola R7\"><figcaption>Le Motorola MOTOTRBO R7.<\/figcaption><\/figure>\n<p>Le <strong>R7<\/strong> est un portable numérique <strong>DMR<\/strong> (compatible aussi en <strong>analogique<\/strong>), très utilisé sur les sites miniers.<\/p>\n<table>\n<thead>\n<tr>\n<th>Caractéristique<\/th>\n<th>R7 (données fabricant)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bandes<\/td>\n<td>VHF 136–174 MHz ; UHF 400–527 MHz<\/td>\n<\/tr>\n<tr>\n<td>Puissance<\/td>\n<td><strong>5 W<\/strong> (VHF) / 4 W (UHF) en haute puissance ; 1 W en basse<\/td>\n<\/tr>\n<tr>\n<td>Canaux<\/td>\n<td><strong>1 000<\/strong> (version clavier FKP) ; 64 (version sans clavier NKP)<\/td>\n<\/tr>\n<tr>\n<td>Étanchéité<\/td>\n<td><strong>IP68<\/strong> (immersion 2 m pendant 2 h) et IP66<\/td>\n<\/tr>\n<tr>\n<td>Robustesse<\/td>\n<td>MIL-STD 810<\/td>\n<\/tr>\n<tr>\n<td>Autonomie typique (cycle 5/5/90)<\/td>\n<td>Numérique 19 à 28 h ; analogique 14,5 à 22 h selon batterie<\/td>\n<\/tr>\n<tr>\n<td>Modes<\/td>\n<td>Analogique, DMR (Tier II et III), Capacity Plus<\/td>\n<\/tr>\n<tr>\n<td>Connectivité<\/td>\n<td>Bluetooth 5.2 (FKP), Wi-Fi (selon version)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Les accessoires du R7<\/h2>\n<table>\n<thead>\n<tr>\n<th>Accessoire<\/th>\n<th>Référence Motorola<\/th>\n<th>Remarque<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Batterie IMPRES 2 200 mAh<\/td>\n<td><strong>PMNN4807<\/strong><\/td>\n<td>Standard<\/td>\n<\/tr>\n<tr>\n<td>Batterie IMPRES 2 850 mAh<\/td>\n<td><strong>PMNN4809<\/strong><\/td>\n<td>Longue durée<\/td>\n<\/tr>\n<tr>\n<td>Batterie IMPRES 3 200 mAh<\/td>\n<td><strong>PMNN4810<\/strong><\/td>\n<td>Très longue durée (postes de 12 h)<\/td>\n<\/tr>\n<tr>\n<td>Chargeur individuel (prise européenne)<\/td>\n<td><strong>PMPN4577A<\/strong><\/td>\n<td>Au bureau<\/td>\n<\/tr>\n<tr>\n<td>Chargeur mu
